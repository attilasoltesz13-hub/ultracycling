<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 520 250" xmlns="http://www.w3.org/2000/svg" font-family="{{FONT}}" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <defs>
          <linearGradient id="night" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#184f95" stop-opacity="0.10"/><stop offset="1" stop-color="#184f95" stop-opacity="0.02"/></linearGradient>
        </defs>
        <!-- éjszakai sávok: 22–06 -->
        <rect x="40" y="20" width="0" height="180"/>
        <rect x="40" y="20" width="60" height="180" fill="url(#night)"/>
        <rect x="280" y="20" width="60" height="180" fill="url(#night)"/>
        <rect x="500" y="20" width="10" height="180" fill="url(#night)"/>
        <!-- rács -->
        <g stroke="#e1e0d9" stroke-width="1"><line x1="40" y1="200" x2="510" y2="200"/><line x1="40" y1="110" x2="510" y2="110"/></g>
        <!-- S folyamat: fűrészfog, alvás alatt csökken -->
        <path d="M40 60 L100 150 L280 55 L340 32 L510 22" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round"/>
        <!-- C folyamat: szinusz, mélypont ~04:00 -->
        <path d="M40 120 C 70 60, 110 60, 145 120 S 220 190, 260 120 S 330 60, 380 120 S 460 190, 510 120" fill="none" stroke="#eb6834" stroke-width="2.4"/>
        <!-- cirkadián mélypont jelölés -->
        <g>
          <rect x="285" y="20" width="50" height="180" fill="#0d366b" fill-opacity="0.07"/><line x1="310" y1="20" x2="310" y2="200" stroke="#0d366b" stroke-width="1" stroke-dasharray="3 3"/>
          <rect x="262" y="206" width="96" height="16" rx="3" fill="#0d366b"/>
          <text x="310" y="217.5" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">mélypont ≈ 01–05 h</text>
        </g>
        <!-- tengely feliratok -->
        <g font-size="10" fill="#898781">
          <text x="40" y="238">18 h</text><text x="100" y="238">06</text><text x="160" y="238">12</text><text x="220" y="238">18</text><text x="280" y="238">24</text><text x="340" y="238">06</text><text x="400" y="238">12</text><text x="460" y="238">18</text>
          <text x="10" y="45" transform="rotate(-90 10 45)" text-anchor="end">álmosság →</text>
        </g>
        <!-- közvetlen feliratok -->
        <text x="150" y="112" font-size="11" fill="#2a78d6" font-weight="600">S — alvásnyomás</text>
        <text x="392" y="60" font-size="11" fill="#eb6834" font-weight="600">C — belső óra</text>
        <text x="46" y="34" font-size="9" fill="#898781">1. éjszaka (alvás)</text>
        <text x="345" y="60" font-size="9" fill="#898781">2. éjszaka (tekersz)</text>
      </svg>
