# Forrástár — Hosszú távon
# Egy bejegyzés = egy forrás. Kulcs: szerző-év-rövidcím. Egyesítve 2026-09-18 (04 modul kutatási fázis).
# grade: A (RCT/meta/szisztematikus), B (terep/megfigyelés), C (edzői/versenyzői konszenzus, narratív review), D (feltörekvő, nem validált)
# status: ellenorizve-doi = a DOI-t a kutató megnyitott kiadói/Crossref/PubMed oldalon látta; url-megnyitva = nincs DOI, az URL megnyitva
# questions: a 04 modul kutatási kérdései (Q1–Q9), modules: mely modulok hivatkoznak rá
# Fizetőfal/CAPTCHA miatt csak absztraktból/másodlagos forrásból vett számok a notes mezőben jelölve — a végleges szövegbe csak teljes szöveg ellenőrzése után.
sources:
  craven-2022-akut:
    key: craven-2022-akut
    type: journal
    authors:
    - Craven J.
    - McCartney D.
    - Desbrow B.
    - et al.
    year: 2022
    title: 'Effects of Acute Sleep Loss on Physical Performance: A Systematic and Meta-Analytical Review'
    venue: Sports Medicine 52(11):2669-2690
    doi: 10.1007/s40279-022-01706-y
    url: https://link.springer.com/content/pdf/10.1007/s40279-022-01706-y.pdf
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: '69 publikáció, 77 vizsgálat, 227 kimenet, n=959 (89% férfi): akut alvásvesztés utáni fizikai teljesítményváltozás.
      Állóképesség -5,55% (95% CI -8,12 - -2,99), anaerob teljesítmény -6,26% (-9,10 - -3,41), erő -2,85% (-4,47
      - -1,23), készség/technika -20,9% (-27,0 - -14,9). Meta-regresszió: az ébredés óta eltelt óránként -0,36%/h
      (restrikció), késői restrikciónál -0,55%/h.'
    notes: Csak AKUT (1 éjszaka) alvásvesztés; 3+ éjszakára nem ad becslést. 89% férfi minta. Délutáni/esti tesztek
      romlanak, a délelőttiek alig - ultratávon ez a második nap délutánját és az éjszakai szakaszt teszi kritikussá.
      A "készség -20,9%" kevés vizsgálatból (9) származik, tág CI-vel; kerékpáros technikára (vonalvezetés, csoportos
      haladás, defektszerelés) csak analógiásan vihető át.
    status: ellenorizve-doi
  lopes-2023-endurance:
    key: lopes-2023-endurance
    type: journal
    authors:
    - Lopes T.R.
    - Pereira H.M.
    - Bittencourt L.R.A.
    - et al.
    year: 2023
    title: How much does sleep deprivation impair endurance performance? A systematic review and meta-analysis
    venue: European Journal of Sport Science 23(7):1279-1292
    doi: 10.1080/17461391.2022.2155583
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%22How%20much%20does%20sleep%20deprivation%20impair%20endurance%20performance%22&resultType=core&format=json
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: '31 vizsgálat, n=478: az alvásdepriváció közepes negatív hatása az állóképességi teljesítményre, összevont
      SMD = -0,52. A hatás mértékét egyértelműen az edzés/teszt időtartama moderálta: a 30 percnél hosszabb terheléseknél
      nagyobb a romlás.'
    notes: 'Az edzettségi szint, a depriváció súlyossága, a tesztelés időpontja és a terhelés típusa NEM moderálta
      szignifikánsan a hatást - vagyis edzett ultrázók sem védettek. Ultrakerékpárra ez a legdirektebb üzenet: minél
      hosszabb a megterhelés, annál nagyobb a romlás; a labortesztek leghosszabbjai is jóval rövidebbek egy ultránál
      (extrapolációs korlát).'
    status: ellenorizve-doi
  fullagar-2015-athletic:
    key: fullagar-2015-athletic
    type: journal
    authors:
    - Fullagar H.H.K.
    - Skorski S.
    - Duffield R.
    - et al.
    year: 2015
    title: 'Sleep and Athletic Performance: The Effects of Sleep Loss on Exercise Performance, and Physiological
      and Cognitive Responses to Exercise'
    venue: Sports Medicine 45(2):161-186
    doi: 10.1007/s40279-014-0260-0
    url: https://link.springer.com/article/10.1007/s40279-014-0260-0
    grade: C
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 'Narratív áttekintés: a maximális, rövid, bruttó motoros teljesítmények nagyrészt megőrizhetők alvásvesztés
      után, a sportspecifikus és hosszabb, önszabályozott teljesítmények viszont romlanak. Autonóm idegrendszeri
      egyensúlyvesztést ír le, amely a túledzettség tüneteit utánozza, valamint emelkedett gyulladásos citokinszinteket
      és lassabb, pontatlanabb kognitív teljesítményt.'
    notes: 'Nem szisztematikus, nincs összevont hatásméret - a benne leírt ellentmondásokat a későbbi meta-analízisek
      (Craven 2022, Lopes 2023) oldják fel. Fő haszna a mechanizmus-keret: immun-, hormonális és autonóm válaszok,
      amelyek többnapos verseny alatt halmozódnak. Ultrakerékpárra közvetlen adata nincs.'
    status: ellenorizve-doi
  vandongen-2003-doseresponse:
    key: vandongen-2003-doseresponse
    type: journal
    authors:
    - Van Dongen H.P.A.
    - Maislin G.
    - Mullington J.M.
    - et al.
    year: 2003
    title: 'The Cumulative Cost of Additional Wakefulness: Dose-Response Effects on Neurobehavioral Functions and
      Sleep Physiology From Chronic Sleep Restriction and Total Sleep Deprivation'
    venue: Sleep 26(2):117-126
    doi: 10.1093/sleep/26.2.117
    url: https://academic.oup.com/sleep/article-abstract/26/2/117/2709164
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 48 egészséges felnőtt, 14 éjszakán át 4, 6 vagy 8 óra ágyban töltött idő, illetve 3 éjszaka teljes
      depriváció. A 4 és 6 órás csoportban kumulatív, dózisfüggő teljesítményromlás minden kognitív feladaton; a
      14 napi 6 órás alvás kognitív deficitje elérte a 2 éjszaka teljes depriváció szintjét. A PVT-kiesések közel
      lineárisan nőttek a 15,84 órát meghaladó KUMULÁLT ébrenléttel.
    notes: 'Kulcsleletet ad az önértékelés csalódásához: a résztvevők szubjektív álmossága az első napok után alig
      nőtt tovább, és nem tudták megkülönböztetni a 4 és 6 órás feltételt, miközben az objektív teljesítmény folyamatosan
      romlott. Labor, nem terhelés alatt; a napi 15,84 órás "ébrenléti költségvetés" ultraversenyen napi szinten
      túllépésre kerül, így a modell szerint a deficit napról napra halmozódik.'
    status: ellenorizve-doi
  belenky-2003-restoration:
    key: belenky-2003-restoration
    type: journal
    authors:
    - Belenky G.
    - Wesensten N.J.
    - Thorne D.R.
    - et al.
    year: 2003
    title: 'Patterns of performance degradation and restoration during sleep restriction and subsequent recovery:
      a sleep dose-response study'
    venue: Journal of Sleep Research 12(1):1-12
    doi: 10.1046/j.1365-2869.2003.00337.x
    url: https://jhanley.biostat.mcgill.ca/bios601/Surveys/Belenky2003.pdf
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 66 fő (16 nő, 50 férfi), 7 éjszaka 3 / 5 / 7 / 9 óra ágyidő, majd 3 regenerációs éjszaka. A 9 órás
      csoport végig stabil; a 7 órás minimális romlás után stabilizálódott; az 5 órás kezdeti romlás után beállt
      csökkent szinten, kiesései a 6-7. napon nőttek; a 3 órás csoport folyamatosan romlott a 7. napig.
    notes: 'A legfontosabb korlátozó lelet többnapos versenyre: HÁROM regenerációs éjszaka után egyik korlátozott
      csoport sem tért vissza a kiindulási szintre - az adaptív változások napokig fennmaradnak. Labor, fizikai
      terhelés nélkül; az ultra alvásmintázata (töredezett, 20-90 perces alvások) nem egyezik a folyamatos, rövidített
      éjszakával, így az átvitel korlátozott.'
    status: ellenorizve-doi
  limdinges-2010-pvt:
    key: limdinges-2010-pvt
    type: journal
    authors:
    - Lim J.
    - Dinges D.F.
    year: 2010
    title: A Meta-Analysis of the Impact of Short-Term Sleep Deprivation on Cognitive Variables
    venue: Psychological Bulletin 136(3):375-389
    doi: 10.1037/a0018883
    url: https://www.med.upenn.edu/uep/assets/user-content/documents/LimDinges2010MetaAnalysis.pdf
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: '70 közlemény, 147 kognitív teszt, n=1533. A legnagyobb romlás az egyszerű figyelemben (PVT): kiesések
      g=-0,762 (95% CI -0,948 - -0,576), reakcióidő g=-0,732 (-0,874 - -0,590). Munkamemória pontosság g=-0,555,
      komplex figyelem pontosság g=-0,479, feldolgozási sebesség g=-0,302 - -0,245, következtetés g=-0,125.'
    notes: 'Rövid távú (jellemzően <48 óra) depriváció; 3+ éjszakára nem általánosít. A gradiens gyakorlati jelentése:
      az éberségtartás (PVT-kiesések, mikroalvás-közeli állapotok) romlik legelőször és legerősebben, a "gondolkodás"
      (következtetés) csak enyhén - ezért az ultrázó szubjektíve "tisztának" érzi magát, miközben a vigilanciája
      már súlyosan sérült.'
    status: ellenorizve-doi
  dawson-1997-alcohol:
    key: dawson-1997-alcohol
    type: journal
    authors:
    - Dawson D.
    - Reid K.
    year: 1997
    title: Fatigue, alcohol and performance impairment
    venue: Nature 388:235
    doi: 10.1038/40775
    url: https://www.nature.com/articles/40775
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 40 fő, félóránként ismételt számítógépes kéz-szem koordinációs (kiszámíthatatlan követési) feladat
      elnyújtott ébrenlét, illetve kontrollált alkoholadagolás mellett. A 10. és 26. ébrenléti óra között a relatív
      teljesítmény óránként átlagosan 0,74%-kal csökkent. 17 óra ébrenlét után a romlás megfelelt 0,05% véralkoholszintnek,
      24 óra után kb. 0,10%-nak.
    notes: 'Kis minta, egyetlen pszichomotoros feladat, laborkörnyezet - nem valós vezetés vagy kerékpározás. A
      0,74%/óra lineáris közelítés csak a 10-26 órás ablakban érvényes, 26 órán túl nem extrapolálható. Oktatási
      célra a legerősebb, legkönnyebben kommunikálható küszöb: "17 óra ébren = ittas vezetés határa" (Magyarországon
      zéró tolerancia, tehát a hasonlat retorikai, nem jogi).'
    status: ellenorizve-doi
