      terhelése után a rámpa-csúcsteljesítmény (412,6 → 380,2 ill. 374,8 W) és a W'' csökkent, a többi determináns (VO2max,
      küszöbök, gazdaságosság) nem; a két tartomány között nem volt különbség. Következtetés: 60–90 perces terhelésnél az
      intenzitási tartomány nem befolyásolja a durability-t; hosszabb terhelésekre további kutatás kell.'
    quote: '"significant declines were seen in peak ramp power (baseline = 412.6 ± 64.5 W, moderate = 380.2 ± 59.7 W and heavy
