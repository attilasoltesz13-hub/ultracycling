    summary: 'Metaanalízis a hőadaptáció hatásairól: az ismételt hőterhelés javítja a kardiovaszkuláris stabilitást, növeli
      a plazmatérfogatot, korábbra hozza és fokozza az izzadást, csökkenti a hőérzetet és az RPE-t, és javítja a melegben
      mért teljesítményt; a tipikus indukciós protokoll 6–14 nap edzés meleg környezetben, a hatásméretek kicsitől nagyig
      terjednek kimenettől függően.'
    quote: '"typical acclimation periods ranging from 6-14 days of exercise in heated environments producing measurable improvements
      in both physiological responses and exercise performance outcomes" (Crossref-kivonatból, másodlagos megfogalmazás)'
    notes: A (metaanalízis, 153 hivatkozás); vegyes sportok, főleg labor. Pontos összesített hatásméret-számokat a Crossref-
      kivonat nem adott – a modulban a 6–14 napos protokoll-tartomány és az iránymutatás idézhető. A racinais-2015-heat-consensus
      konszenzussal együtt kezelendő.
    status: ellenorizve-doi
    modules:
    - '02'
