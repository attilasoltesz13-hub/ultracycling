      kapcsolat a különböző mozgásformák között "közel átfedő" volt – tehát a módszer mozgásformától és teljesítménymérőtől
      független, univerzális terhelésmutató.'
    quote: '"the relationship between the mean session RPE and the summated heart rate zone score was highly consistent" ...
      the method offers "a valid, intensity-independent approach for monitoring diverse training modes." [absztraktból]'
    notes: 'Klasszikus validációs vizsgálat (kerékpár + kosárlabda, egyetemista/edzett vegyes minta). A validitás referenciája
      maga is pulzus-alapú, nem teljesítmény. Ultrára: teljesítménymérő nélkül is működik, de nagyon hosszú (6-15+ órás) edzésen
      az egyetlen globális RPE a végállapotot súlyozza (recency-torzítás) – ezt későbbi módszertani irodalom jelzi. Számok
      az OpenAlex-absztraktból.'
