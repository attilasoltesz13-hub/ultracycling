      ~19:40. A csúcs és a mélypont közötti különbség 7,62 ± 1,18% (korai), 10,03 ± 1,62% (köztes) és 26,2 ± 3,97% (késői)
      volt. A legmegbízhatóbb előrejelző nem az óraidő, hanem az ébredés óta eltelt idő volt: korai/köztes ~5,6–6,5 óra, késői
      ~11,2 óra.'
    notes: 'Kis teljesítménytesztelt minta (n=20), egyetlen sportág, aerob ingafutás-teszt (nem tartós állóképesség). A 26%-os
      ingadozás késői kronotípusnál a legfontosabb gyakorlati szám: éjszakai kerékpározásnál a késői típus a hajnali órákban
      lényegesen nagyobb relatív esést szenved, a korai típus viszont hamarabb "kifut".'
