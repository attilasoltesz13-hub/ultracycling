      a kJ-mennyisége határozza meg; a kritikus teljesítmény feletti erőfeszítések kevesebb összmunkával is nagyobb teljesítménycsökkenést
      okoznak, mint az alacsony-közepes intenzitásúak. A szerzők szerint ez versenystratégiai következménnyel jár: a terhelést
      intenzitás-specifikusan kell számolni, a kJ önmagában elégtelen.'
