      A nyál-IgA tehát csak egyéni trendként, nem abszolút értékként használható.
    quote: '"No significant correlation existed between absolute s-IgA concentration and URTI incidence (r = 0.11)" ... "a
      marked 28% reduction in s-IgA occurred during the 3 weeks preceding URTI episodes". [absztraktból]'
    notes: 'Vitorlázás (nem állóképességi sport), elit férfiak, de a leghosszabb (50 hetes) longitudinális s-IgA adatsor.
      Gyakorlati üzenet: amatőrnek a heti IgA-mérés nem reális; a helyettesítő az alvás/fáradtság/torokkaparás-trend.'
    status: ellenorizve-doi
    modules:
    - '02'
