      and race strategies, emphasizing the need for intensity-specific workload quantification."'
    notes: 'Pacing-üzenet ultrára: a hegyi „CP feletti" rövid csúcsok aránytalanul drágák a további napok teljesítményében
      – a „hegyen egyenletes watt, ne kövesd a többieket" gyakorlat élettani alapja. Egyetlen bevont vizsgálat sem ultra-
      távú. DOI a Springer kiadói oldalon látható.'
