    venue: Sleep 41(10):zsy144
    doi: 10.1093/sleep/zsy144
    url: https://academic.oup.com/sleep/article/41/10/zsy144/5067408
    grade: B
    questions:
    - 04:Q1
    - 04:Q6
    modules:
    - '04'
