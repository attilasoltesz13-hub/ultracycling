    summary: 'A session-RPE módszer alapcikke: az edzés terhelése = időtartam (perc) × CR-10 skálás érzett erőkifejtés, a
      teljes edzésre, 30 perccel a vége után kérdezve. Egyenletes és intervallum-kerékpáredzésen, valamint kosárlabdaedzésen
