    summary: '15 jól edzett országúti kerékpáros 10 hetes felkészülési időszaka: a heti terhelést TSS-sel, session-RPE-vel
      és négyféle TRIMP-pel (Banister, Edwards, individualizált iTRIMP, Lucia luTRIMP) számolták, és a fittség-változáshoz
      (laborteszt + 8 perces időfutam) viszonyították. A terhelésmutatók és a szubmaximális fittségváltozás korrelációja r=0,54-0,81;
      a 8 perces időfutam-teljesítmény változásával a legerősebb kapcsolatot az iTRIMP (r=0,81), a TSS (r=0,75) és a luTRIMP
      (r=0,70) adta. A TSS és a jobb TRIMP-változatok tehát kerékpárosoknál hasonlóan jól követik az adaptációt.'
