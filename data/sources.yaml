    key: williamson-2000-alcohol
    type: journal
    authors:
    - Williamson A.M.
    - Feyer A.-M.
    year: 2000
    title: Moderate sleep deprivation produces impairments in cognitive and motor performance equivalent to legally
      prescribed levels of alcohol intoxication
    venue: Occupational and Environmental Medicine 57(10):649-655
    doi: 10.1136/oem.57.10.649
    url: https://oem.bmj.com/content/57/10/649
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 39 fő (30 közlekedési dolgozó, 9 katona), 28 órás ébrentartás vs. kontrollált alkoholadagolás. 17-19
      óra folyamatos ébrenlét után a kognitív és motoros teljesítmény a 0,05% véralkoholszintnek megfelelő szintre
      romlott; egyes teszteken a válaszidő akár 50%-kal lassabb lett, a pontosság szignifikánsan rosszabb. Hosszabb
      ébrenlétnél a romlás elérte a maximális alkoholadag (~0,10%) szintjét.
    notes: 'Megerősíti Dawson & Reid küszöbét független mintán és több feladaton - két független laborból származó
      egybehangzó eredmény, ezért ez a Q1 legerősebben alátámasztott küszöbe. Korlát: max. 28 óra, tehát a 2-3.
      éjszakára nincs adata; nem terhelés alatt mérve. A "pontosság vs. sebesség" különválása fontos: az ultrázó
      lassulása kevésbé feltűnő számára, mint a hibázás.'
    status: ellenorizve-doi
  choong-2025-inhibition:
    key: choong-2025-inhibition
    type: journal
    authors:
    - Choong S.Y.
    - Byrne J.E.M.
    - Drummond S.P.A.
    - et al.
    year: 2025
    title: A meta-analytic investigation of the effect of sleep deprivation on inhibitory control
    venue: Sleep Medicine Reviews 80:102042
    doi: 10.1016/j.smrv.2024.102042
    url: https://www.sciencedirect.com/science/article/pii/S1087079224001461
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: '24 vizsgálat, 712 egészséges felnőtt. Az alvásdepriváció közepesen rontja a gátlókontrollt: Go/No-Go
      feladat Hedges g=-0,475, Stop Signal feladat g=-0,482 (mindkettő p<0,001) - több elkövetési (commission) hiba
      és hosszabb stop-jel reakcióidő. 22 vizsgálat teljes depriváció (24-43 óra ébrenlét), 3 részleges restrikció
      (2-6 nap, 3-6 óra alvás).'
    notes: A gátlókontroll az impulzív, korrigálatlan döntések (hirtelen kormánymozdulat, kockázatos előzés, rossz
      forgalmi rés megítélése) laborproxyja - ez teszi biztonsági kérdéssé. A részleges restrikciós alvizsgálat
      nagyon kicsi (3 tanulmány), így a többnapos, krónikusan korlátozott alvásra vonatkozó becslés gyenge. Fizikai
      terhelés nélküli labor.
    status: ellenorizve-doi
  wei-2024-risk:
    key: wei-2024-risk
    type: journal
    authors:
    - Wei X.
    - Ma J.
    - Liu S.-J.
    - et al.
    year: 2024
    title: The effects of sleep deprivation on risky decision making
    venue: Psychonomic Bulletin & Review 32(1):80-96
    doi: 10.3758/s13423-024-02549-6
    url: https://link.springer.com/article/10.3758/s13423-024-02549-6
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: '25 kísérletes vizsgálat szisztematikus áttekintése egészséges felnőtteken, 47 kimenettel. Az eredmények
      erősen ellentmondásosak: 13 kimenet (28%) fokozott kockázatkeresést, 6 (13%) csökkent kockázatkeresést, 28
      (60%) semmilyen szignifikáns hatást nem mutatott. A hatást moderálta a nem, a nyereség-veszteség keretezés,
      pszichotróp szerek használata és a depriváció időtartama.'
    notes: 'A nőknél gyakoribb volt a kockázatkerülő irány (4/12 vs. 2/12 férfiaknál). Koffein és dextroamfetamin
      részben tompította a fokozott kockázatvállalást - ultraversenyen gyakori a koffeinhasználat, ez zavaró tényező.
      FONTOS ÓVATOSSÁG: a "fáradt ultrázó kockázatkeresőbb" állítás NEM tekinthető bizonyítottnak; a gátlókontroll
      romlása (choong-2025) jobban alátámasztott, mint a kockázatpreferencia eltolódása.'
    status: ellenorizve-doi
  roberts-2019-cycling:
    key: roberts-2019-cycling
    type: journal
    authors:
    - Roberts S.S.H.
    - Teo W.-P.
    - Aisbett B.
    - et al.
    year: 2019
    title: Effects of total sleep deprivation on endurance cycling performance and heart rate indices used for monitoring
      athlete readiness
    venue: Journal of Sports Sciences 37(23):2691-2701
    doi: 10.1080/02640414.2019.1661561
    url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1080/02640414.2019.1661561?fields=title,abstract,year,venue,authors,externalIds
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 13 állóképességi sportoló keresztezett elrendezésben, két egymást követő napon önszabályozott kerékpáros
      időfutam, közte normál alvás vagy teljes alvásdepriváció. A deprivációs ág 2. napján az idő 10%-kal volt rosszabb
      a normál alvás 2. napjához képest (64±7 vs 59±4 perc, p<0,01) és 11%-kal a saját 1. napjához képest (58±5
      perc). A szubjektív/objektív intenzitásarány (RPE:átlagpulzus) emelkedett, a hangulatzavar és a PVT átlagos
      válaszidő romlott.
    notes: 'Kicsi minta (n=13), egyetlen éjszaka teljes depriváció - a 10%-os romlás a legkonkrétabb kerékpáros
      szám, de nem extrapolálható 2-3. éjszakára. Gyakorlati üzenet a monitorozásra: az RPE:pulzus arány érzékenyebb
      az alvásvesztésre, mint a nyers pulzusadat - ultraversenyen ez azt jelenti, hogy adott pulzus "nehezebbnek"
      érződik, és a pulzusalapú zónavezérlés félrevezethet. Az anaerob küszöb korrelált a romlás mértékével (R=-0,73).'
    status: ellenorizve-doi
  temesi-2013-central:
    key: temesi-2013-central
    type: journal
    authors:
    - Temesi J.
    - Arnal P.J.
    - Davranche K.
    - et al.
    year: 2013
    title: Does central fatigue explain reduced cycling after complete sleep deprivation?
    venue: Medicine & Science in Sports & Exercise 45(12):2243-2253
    doi: 10.1249/mss.0b013e31829ce379
    url: https://static1.squarespace.com/static/55b7ffebe4b0568a75e3316b/t/59f9e9d16c31941828c3931c/1509550552676/Temesi+et+al.+Med+Sci+Sports+Exerc+2013+Does+Central+Fatigue+Explain+Reduced+Cycling+after+sleep+deprivation.pdf
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 12 aktív férfi (VO2max 60±7 ml/kg/perc), egy éjszaka teljes alvásdepriváció (~24 óra ébrenlét) vs.
      kontroll; 40 perc szubmaximális kerékpározás a maximális aerob teljesítmény 65%-án, majd inkrementális teszt
      kimerülésig. A kimerülésig eltelt idő 7,5%-kal csökkent (1137±253 s vs 1236±282 s, p=0,013), az RPE a 40 perces
      szakaszban szignifikánsan magasabb volt (p=0,009). A maximális akaratlagos izomaktiváció és a motoros kiváltott
      válasz NEM különbözött a két ág között.
    notes: 'Kis minta, csak férfiak, egy éjszaka. Mechanizmus szempontjából kulcsfontosságú negatív lelet: a romlás
      NEM magyarázható fokozott idegizomrendszeri ("központi") fáradással - a romlás elsősorban percepciós/motivációs
      eredetű (az azonos munka nehezebbnek érződik). Ultrakerékpárra ez azt jelenti, hogy a beavatkozásnak a terhelésérzet
      és a vigilancia kezelésére kell irányulnia, nem "izomregenerációra".'
    status: ellenorizve-doi
  gattoni-2025-recovery:
    key: gattoni-2025-recovery
    type: journal
    authors:
    - Gattoni C.
    - Girardi M.
    - Javadi A.-H.
    - et al.
    year: 2025
    title: The effects of one-night sleep deprivation and one-night recovery sleep on endurance cycling performance
    venue: European Journal of Applied Physiology
    doi: 10.1007/s00421-025-05908-w
    url: https://link.springer.com/article/10.1007/s00421-025-05908-w
    grade: A
    questions:
    - Q1
    - Q6
    modules:
    - '04'
    summary: 26 amatőr kerékpáros/triatlonista (30,5 év, VO2peak 55,3 ml/kg/perc), 25 óra folyamatos ébrenlét vs.
      kontroll, három egymást követő napon mérve. Az alvásdepriváció a mérsékelt intenzitású teljesítményt rontotta,
      a magasabb RPE közvetítésével, de a 20 perces nagy intenzitású időfutamot NEM. Egyetlen éjszaka regeneráló
      alvás elegendő volt a mérsékelt intenzitású állóképesség és a vigilancia helyreállításához.
    notes: 'A legfrissebb, leginkább ultra-releváns dizájn: a hosszú, mérsékelt intenzitású (ultratempó) munka sérül,
      a rövid, nagy intenzitású kirobbanó teljesítmény megőrizhető - ez magyarázza, hogy az ultrázó "még tud sprintelni",
      miközben a tartós tempója összeomlik. Korlát: csak 1 éjszaka depriváció, csak férfiak, laborkörülmények; a
      többnapos halmozódásra nem ad választ, és a regenerációra vonatkozó optimista lelet ELLENTMOND Belenky 3 éjszakás
      nem-teljes helyreállásának (más dózis: 1 vs 7 éjszaka korlátozás).'
    status: ellenorizve-doi
