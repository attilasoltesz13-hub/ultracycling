  - key: mckenzie-2026-tcr12-frozen
    type: web-article
    authors: [McKenzie C. (DotWatcher)]
    credential: "Conor McKenzie – DotWatcher.cc szerkesztő-elemző, tracker-alapú versenykommentátor"
    year: 2026
    title: "TCRNo12 Briefing: Frozen Roads, Fast Starts"
    venue: "DotWatcher (Substack), 2026-07-20"
    doi: null
    url: https://dotwatcher.substack.com/p/tcrno12-20-july
    grade: B
    questions: [Q9, Q10]
    summary: >-
      A 2026-os TCR nyitónapja Norvégiában 1 → −1 °C-ra (egy fejegység −3 °C-ot mutatott hajnali 5-kor) hűlt, miközben
      a mezőny a görög nyár felé tart. Az élboly gyakorlatilag nem állt meg (a kumulált top 10 minden tagja 5–31 perc
      álló idő), a legmagasabb nyitónapi mozgósebesség 28,75 km/h; a hideg egy versenyzőnél nyújtásra és rövid
      pihenőkre kényszerítő hátfeszülést okozott. A szerző szerint nem a kontrollpontra érkezés sorrendje, hanem az
      számít, ki halad tovább gyorsan.
    quote: >-
      "Through the opening night, riders reported temperatures tumbling from 1°C to -1°C, with one bike computer showing
      -3°C at 5 am." ... "Every rider in the cumulative top ten recorded between five and 31 minutes stationary." ...
      "Arrival order matters less than what riders do next."
    notes: >-
      Első napi pillanatkép, a hideg tempóra gyakorolt hatását csak anekdotikusan (hátfeszülés, extra megállások) mutatja.
      Kiegészíti a 08-A/B csomag mckenzie-dotwatcher-tcr-2026 kulcsát (7. napi elemzés), másik cikk.
