  - key: ridefar-schedule
    type: web-guide
    authors: [White C. (Ride Far)]
    credential: "Chris White – TCR-befutó (2015–2017), ultra-távú versenyző, a Ride Far tudástár szerzője"
    year: 2017
    title: "Schedule & Goals in Bikepacking Races"
    venue: "ridefar.info"
    doi: null
    url: https://ridefar.info/rider/strategy/schedule/
    grade: C
    questions: [Q9, Q10]
    summary: >-
      A napi távcél és ütemterv gyakorlati modellje: a top versenyzők önellátó versenyen az első 24 órában legalább 600 km-t
      tesznek meg, majd 400–450 km/napra „állnak be"; 300 km/nap a rajtolók felső 20%-át, 240–280 km/nap a mezőny közepét
      jelenti. Javasolja ~5% tartalék betervezését (267 helyett 280 km/nap), az első napokon a frissesség kihasználását,
      hőségben több éjszakai tekerést, és hogy éjszaka soha ne adjuk fel a versenyt.
    quote: >-
      "In most self-supported races, the top riders will ride at least 600 km in the first 24 hours, and then 'settle
      down' to a rate of about 400-450 km per day." ... "Riding more at night and resting more during the day can
      obviously help to avoid extreme heat." ... "Winds tend to decrease when the sun goes down"
    notes: >-
      Az év a Ride Far többi oldalával azonos (2017, azóta frissítve; pontos dátum nem látható). Tapasztalati számok,
      nem tracking-elemzés – de egybevágnak a 08-A/08-B csomag TCR/RAAM tracker-adataival. A „szél éjjel csökken"
      meteorológiailag a nappali termikus szél (konvekció) megszűnésére igaz, frontális szélre nem.
    status: url-megnyitva

