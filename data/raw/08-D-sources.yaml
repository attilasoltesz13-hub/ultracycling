    grade: C
    questions: [Q9, Q10]
    summary: >-
      Muller a 2017-es 24 órás vb-győzelmét a tempó megtanulására vezeti vissza: a hőségben végzett edzések mutatták meg,
      milyen teljesítményt egy órán át sem szabad túllépnie, nemhogy 24 órán át. A nap legmelegebb óráiban tudatosan
      lassított és körönként megállt jégzoknit cserélni; a legsötétebb/leghidegebb órákban (hajnali 2–4) és napkelte
      után koffeint használt; az utolsó órát nem engedte elszállni.
    quote: >-
      "During the hottest part of the day I slowed myself down and avoided riding like a fool, not trying to push
      through when my body wouldn't allow." ... "It will feel so easy in the beginning, but overdoing it early on
      will almost always come back to bite you later."
    notes: >-
      24 órás, kísérős pályaformátum (Borrego Springs, sivatagi hőség nappal, hideg éjjel). A "körönként jégzokni"
      megállás explicit átváltás: álló idő a hőterhelés csökkentéséért. Számszerű watt/pulzus-célt nem közöl.
