  # ================================================================ Q9: hőség, hideg, eső, szél, napszak – lektorált
  - key: racinais-2015-heat-consensus
    type: journal
    authors: [Racinais S., Alonso J.M., Coutts A.J., Flouris A.D., Girard O., González-Alonso J., Hausswirth C., Jay O., Lee J.K.W., Mitchell N., Nassis G.P., Nybo L., Pluim B.M., Roelands B., Sawka M.N., Wingo J., Périard J.D.]
    credential: "Nemzetközi konszenzus-panel (Aspetar, ACSM, IOC-hoz kötődő kutatók); Racinais – Aspetar Orthopaedic and Sports Medicine Hospital"
    year: 2015
    title: "Consensus recommendations on training and competing in the heat"
    venue: "British Journal of Sports Medicine 49(18):1164-1173 (párhuzamosan: Scand J Med Sci Sports 25 Suppl 1)"
    doi: 10.1136/bjsports-2015-094915
    url: https://s3.us-east-2.amazonaws.com/sidearm.nextgen.sites/thecitadel.sidearmsports.com/documents/2024/10/2/Consensus_Recommendations_on_Training_and_Competing_In_the_Heat.pdf
    grade: C
    questions: [Q9]
    summary: >-
      Konszenzus-ajánlás hőségben végzett edzésre és versenyzésre. A pacing-vonatkozás: a hőségben az önszabályozott
      teljesítmény viselkedéses csökkentése (labdarúgók kevesebb nagy intenzitású távot tesznek meg, teniszezők rövidebb
      labdameneteket játszanak) normális termoregulációs alkalmazkodás, nem hiba. Szervezőknek javasolja a rajtidő
      időjárás szerinti ütemezését és hosszabb hűtési/hidratációs szüneteket; verseny közben belső hűtés (jégkása)
      alkalmazható.
    quote: >-
      "scheduling the start time of events based on weather patterns" ... "additional (or longer) recovery periods
      between and during events, for hydration and body cooling opportunities" ... "Internal methods (ie, ice slurry)
      can be used during exercise"
    notes: >-
      Ultrakerékpárra közvetlen adata nincs; az elv (hőségben az intenzitás csökkentése és a pihenők hűtésre használása)
      vihető át. A hőakklimatizációs részt az 5. modul fedi. DOI a Crossref API-n ellenőrizve (BJSM 49(18):1164–1173).
      A PMC-tükör reCAPTCHA-t adott, a Citadel-tükör PDF nyílt meg.
    status: ellenorizve-doi

  - key: periard-2021-heat-review
    type: journal
    authors: [Périard J.D., Eijsvogels T.M.H., Daanen H.A.M.]
    credential: "Périard – University of Canberra Research Institute for Sport and Exercise; Eijsvogels – Radboudumc; Daanen – VU Amsterdam"
    year: 2021
    title: "Exercise under heat stress: thermoregulation, hydration, performance implications, and mitigation strategies"
    venue: "Physiological Reviews 101(4):1873-1979"
    doi: 10.1152/physrev.00038.2020
    url: https://journals.physiology.org/doi/full/10.1152/physrev.00038.2020
    grade: C
    questions: [Q9]
    summary: >-
      Átfogó áttekintés a hőstressz és a teljesítmény kapcsolatáról. Számszerű pacing-adatok: 15 perces önszabályozott
      kerékpározás 40 °C-on ~17%-kal kevesebb munkát ad, mint 20 °C-on; elit kerékpárosok 30 perces időfutamon 32 °C-on
      ~6,5%-kal alacsonyabb átlagteljesítményt hoznak, mint 23 °C-on. A hőségben történő munkaráta-csökkentést a
      testhőmérséklet szabályozásához hozzájáruló viselkedéses alkalmazkodásként írja le. Hőguta: >40 °C maghőmérséklet
      központi idegrendszeri diszfunkcióval.
    quote: >-
      "~17% less work was performed during a 15-min self-paced cycling task in 40°C compared with 20°C conditions"
      ... "~6.5% lower mean power output in elite cyclists undertaking a 30-min time trial in 32°C compared with 23°C
      conditions"
    notes: >-
      A számok rövid (15–30 perces) önszabályozott terhelésekből származnak; ultratávra a hatásméret nem vihető át
      egy az egyben, mert ott az abszolút intenzitás jóval alacsonyabb (kisebb metabolikus hőtermelés). Nem közöl
      maratoni fok/százalék-összefüggést. DOI a Crossref API-n ellenőrizve.
    status: ellenorizve-doi

  - key: elhelou-2012-marathon-weather
    type: journal
    authors: [El Helou N., Tafflet M., Berthelot G., Tolaini J., Marc A., Guillaume M., Hausswirth C., Toussaint J.-F.]
    credential: "IRMES (Institut de Recherche bioMédicale et d'Epidémiologie du Sport), INSEP, Párizs"
    year: 2012
    title: "Impact of Environmental Parameters on Marathon Running Performance"
    venue: "PLOS ONE 7(5):e37407"
    doi: 10.1371/journal.pone.0037407
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0037407
    grade: B
    questions: [Q9]
    summary: >-
      Hat nagy maraton (Párizs, London, Berlin, Boston, Chicago, New York) 2001–2010 közötti eredményeit vetette össze
      a rajtnapi időjárással. A csúcsteljesítményhez optimális léghőmérséklet teljesítményszinttől függően 3,8–9,9 °C;
      a sebességvesztés az optimum felett négyzetes; a páratartalom a második legfontosabb tényező; melegebb napokon
      nő a feladók aránya.
    quote: >-
      "The optimal temperatures to run at maximal speed for men and women, varied from 3.8°C to 9.9°C according to each
      level of performance." ... "Warmer air temperatures were associated with higher percentages of runners'
      withdrawal during a race"
    notes: >-
      Futás, 2–5 órás terhelés; kerékpáron a menetszél miatt a konvektív hűtés jobb, ezért az optimum valószínűleg
      pár fokkal magasabb (lásd galloway-1997-temperature: ~11 °C). A tanulság ultrára: a nappali 30 °C+ szakasz nem
      csak lassabb, hanem a kiesés kockázatát is emeli. DOI a PLOS kiadói oldalon látható.
    status: ellenorizve-doi

  - key: galloway-1997-temperature
    type: journal
    authors: [Galloway S.D.R., Maughan R.J.]
    credential: "University of Aberdeen, Department of Biomedical Sciences (Maughan – később Loughborough, IOC táplálkozási munkacsoport)"
    year: 1997
    title: "Effects of ambient temperature on the capacity to perform prolonged cycle exercise in man"
    venue: "Medicine & Science in Sports & Exercise 29(9):1240-1249"
    doi: 10.1097/00005768-199709000-00018
    url: https://www.stir.ac.uk/research/hub/publication/783504
    grade: A
    questions: [Q9]
    summary: >-
      Kontrollált laborvizsgálat: 70% VO2max-on kimerülésig kerékpározás 4, 11, 21 és 31 °C-on (8 férfi). A teljesítőképesség
      fordított U-alakot követ: 10,5 °C-on volt a leghosszabb (93,5 ± 6,2 perc), 30,5 °C-on a legrövidebb (51,6 ± 3,7 perc);
      4 °C-on is rövidebb, mint 11 °C-on. Ez a "hideg is lassít" tézis klasszikus alapja.
    quote: >-
      "exercise duration was shortest at 30.5°C (51.6 ± 3.7 min) and longest at 10.5°C (93.5 ± 6.2 min)" ... "there is a
      clear effect of temperature on exercise capacity which appears to follow an inverted U relationship"
    notes: >-
      Kis minta (n=8), fix intenzitás (nem önszabályozott), szélcsendes labor – terepen a menetszél és a ruházat módosít.
      Az ultrára vonatkozó üzenet: a hajnali 0–5 °C-os alpesi leereszkedés és a 35 °C-os délután egyaránt a "lassú sáv",
      a 10–20 °C-os reggel/este az "olcsó kilométer". DOI a Crossref API-n ellenőrizve; a stir.ac.uk repozitóriumi
      oldal nyílt meg (absztrakt).
    status: ellenorizve-doi

  - key: ito-2013-rain-cold
    type: journal
    authors: [Ito R., Nakano M., Yamane M., Amano M., Matsumoto T.]
    credential: "Tokyo Institute of Technology / Kyoto Prefectural University, testnevelés-élettan"
    year: 2013
    title: "Effects of rain on energy metabolism while running in a cold environment"
    venue: "International Journal of Sports Medicine 34(8):707-711"
    doi: 10.1055/s-0032-1331770
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=%22Effects%20of%20rain%20on%20energy%20metabolism%20while%20running%20in%20a%20cold%20environment%22&resultType=core&format=json
    grade: A
    questions: [Q9]
    summary: >-
      Kontrollált klímakamra: 7 férfi 70% VO2max-on futott 5 °C-on esőszimulációval és anélkül. Esőben a nyelőcső- és
      bőrhőmérséklet alacsonyabb, a percventiláció, az oxigénfogyasztás és a plazmalaktát magasabb volt – azonos
      sebesség hidegben esőben többe kerül.
    quote: >-
      "Esophageal temperature and mean skin temperature were significantly lower (P<0.05) in RAIN than in CON" ...
      "Higher oxygen consumption and plasma lactate in RAIN indicated that energy demand increases when running in
      cold conditions"
    notes: >-
      Futás, 30 perces terhelés, n=7. Kerékpáron a menetszél a hűtést tovább fokozza, tehát a hatás inkább nagyobb.
      Pacing-üzenet: hideg esőben ugyanaz a watt magasabb élettani költséggel jár, a tempót nem a watt, hanem a
      hőháztartás korlátozza – az álló idő (átöltözés, melegedés) itt "befektetés". DOI az Europe PMC REST-válaszban látható.
    status: ellenorizve-doi

