    notes: >-
      Csak 4 RCT (futó+kerékpáros+sífutó, edzett), kis össz-n; OpenAlex-rekonstruált absztraktból idézve. Print 2019,
      online 2018. A frissebb silva-oliveira-2024-pol-meta árnyalja (időfutamban nincs POL-előny nagyobb mintán).
    status: ellenorizve-doi

  - key: silva-oliveira-2024-pol-meta
    type: journal
    authors: [Silva Oliveira P., Boppre G., Fonseca H.]
    year: 2024
    title: "Comparison of Polarized Versus Other Types of Endurance Training Intensity Distribution on Athletes' Endurance Performance: A Systematic Review with Meta-analysis"
    journal: "Sports Medicine 54:2071-2095"
    doi: 10.1007/s40279-024-02034-z
    url: https://link.springer.com/article/10.1007/s40279-024-02034-z
    grade: A
    questions: [02:Q1]
    summary: >-
      A legfrissebb, legnagyobb TID-meta: 17 vizsgálat, 437 résztvevő (183 POL, 223 egyéb TID). VO2peak-ben kis
      POL-előny (SMD=0,24; 95% CI 0,01–0,48; p=0,040), ami <12 hetes beavatkozásnál (SMD=0,40; CI 0,08–0,71) és
      magasan edzetteknél (SMD=0,46; CI 0,10–0,82) erősebb. Időfutam-teljesítményben viszont NINCS különbség
      (SMD=-0,01; CI -0,28–0,25), és a küszöb-sebességben/teljesítményben sem (SMD=0,04).
    quote: >-
      "SMD = 0.24 [95% CI 0.01, 0.48]; z = 2.02 (p = 0.040); 11 studies, n = 284" (VO2peak) … time-trial:
      "SMD = –0.01 [95% CI -0.28, 0.25]; z = −0.10 (p = 0.92); n = 221".
    notes: >-
      Vegyes sportok, többségében edzett férfiak; kiadói absztraktból idézve. Fő üzenet ultrára: a TID-válasz
      kimenet-függő – VO2peak-re polarizált kicsit jobb, versenyteljesítményre az eloszlások egyenértékűek, ha a
      terhelés azonos. A „melyik TID" kérdés másodlagos a összterhelés és a konzisztencia mögött.
    status: ellenorizve-doi

  - key: filipas-2022-pyr-pol
    type: journal
    authors: [Filipas L., Bonato M., Gallo G., Codella R.]
    year: 2022
    title: "Effects of 16 weeks of pyramidal and polarized training intensity distributions in well-trained endurance runners"
    journal: "Scandinavian Journal of Medicine & Science in Sports 32(3):498-511"
    doi: 10.1111/sms.14101
    url: https://api.crossref.org/works/10.1111/sms.14101
    grade: A
    questions: [02:Q1]
    summary: >-
      60 jól edzett férfi futó, 16 hét, 4 csoport: végig piramis, végig polarizált, piramis→polarizált, polarizált→piramis.
      A piramis→polarizált szekvencia adta a legnagyobb javulást: ~3,0% rel. VO2max, ~1,7% vBLa2, ~1,5% vBLa4, ~1,5%
