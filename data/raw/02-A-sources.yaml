sources:
  # ---------------------------------------------------------------- Q1: intenzitás-eloszlás (polarizált / piramis / küszöb)
  - key: seiler-kjerland-2006
    type: journal
    authors: [Seiler K.S., Kjerland G.Ø.]
    year: 2006
    title: "Quantifying training intensity distribution in elite endurance athletes: is there evidence for an 'optimal' distribution?"
    journal: "Scandinavian Journal of Medicine & Science in Sports 16(1):49-56"
    doi: 10.1111/j.1600-0838.2004.00418.x
    url: https://api.crossref.org/works/10.1111/j.1600-0838.2004.00418.x
    grade: B
    questions: [02:Q1]
    summary: >-
      A „polarizált eloszlás" alapcikke: 12 junior válogatott sífutó 32 napos edzésnaplója pulzus-, laktát- és
      session-RPE-alapon. Pulzus-idő szerint a 3 zóna aránya 75±3% / 8±3% / 17±4% (Z1/Z2/Z3, VT1 és VT2 határokkal);
      a laktátmérések 71%-a ≤2,0 mM, 7%-a 2–4 mM, 22%-a >4 mM. Az edzések ~75%-a egyértelműen VT1 alatt, 15–20%-a
      VT2 felett zajlott – a VT1–VT2 közötti „laktát-akkomodációs zóna" tudatosan kerülve.
    quote: >-
      "75±3%, zone 1; 8±3%, zone 2; 17±4%, zone 3" … "training was organized after a polarized pattern, with most
      sessions performed clearly below (about 75%) or with substantial periods above (15–20%) the lactate accommodation zone".
    notes: >-
      n=12 junior sífutó (norvég, elit utánpótlás), megfigyeléses terepadat, nem RCT – ezért B. Session-alapú (nem
      idő-alapú) számolásnál polarizáltabbnak tűnik ugyanaz az edzés. A 3-zónás VT1/VT2 modell definíciós forrása.
      Számok Crossref-absztraktból. Átvitel ultrára: az eloszlás elve igen, a sífutó-volumen nem.
    status: ellenorizve-doi

  - key: seiler-2010-bestpractice
    type: journal
    authors: [Seiler S.]
    year: 2010
    title: "What is Best Practice for Training Intensity and Duration Distribution in Endurance Athletes?"
    journal: "International Journal of Sports Physiology and Performance 5(3):276-291"
    doi: 10.1123/ijspp.5.3.276
    url: https://api.crossref.org/works/10.1123/ijspp.5.3.276
    grade: C
    questions: [02:Q1, 02:Q2]
    venue_note: "lektorált áttekintés, de narratív jellegű"
    summary: >-
      A „80/20" szabály kanonikus összefoglalója: elit állóképességi sportolóknál a session-ök ~80%-a alacsony
      intenzitású (≤2 mM laktát), ~20%-a magas intenzitású. Érvelés: a sok alacsony intenzitású, hosszú edzés és a
      kevés, kemény intervall adaptációs jelátvitele komplementer; a küszöb körüli „középzóna" nagy stresszt ad
      viszonylag kis többlet-adaptációért. Zóna-definíciók: 3-zónás modell VT1/VT2 (kb. 2 és 4 mM laktát) határokkal.
    quote: >-
      "about 80% of training sessions are performed at low intensity (2 mM blood lactate), with about 20% dominated by
      periods of high-intensity work".
    notes: >-
      Narratív áttekintés (ezért C), de a terület legidézettebb kerete. A 80/20 session-alapú; idő-alapon az elit
      eloszlás inkább 90/10 közeli. Crossref-absztraktból idézve. Amatőr, heti 6–8 órás sportolóra a szerző maga is
      óvatos extrapolációt javasol.
    status: ellenorizve-doi

  - key: stoggl-2014-polarized-rct
    type: journal
    authors: [Stöggl T., Sperlich B.]
    year: 2014
    title: "Polarized training has greater impact on key endurance variables than threshold, high intensity, or high volume training"
    journal: "Frontiers in Physiology 5:33"
    doi: 10.3389/fphys.2014.00033
    url: https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2014.00033/full
    grade: A
    questions: [02:Q1]
    summary: >-
      A legnagyobb TID-RCT: 48 jól edzett állóképességi sportoló (futó, kerékpáros, triatlonos, sífutó; VO2peak
      62,6±7,1 ml/kg/perc) 4 csoportban (POL, HIIT, HVT=nagy volumen, THR=küszöb) 9 hétig. A POL-csoport VO2peak-je
      +6,8 ml/kg/perc (+11,7%, p<0,001), kimerülésig tartó idő +17,4%, csúcssebesség/teljesítmény +5,1%; a 4 mM-os
      sebesség/teljesítmény POL-nál +8,1%, HIIT-nél +5,6% nőtt. A THR- és HVT-csoport kulcsváltozói érdemben nem javultak.
    quote: >-
      "POL demonstrated the greatest increase in VO2peak (+6.8 ml∙min∙kg−1 or 11.7%, P<0.001), time to exhaustion during
      the ramp protocol (+17.4%, P<0.001) and peak velocity/power (+5.1%, P<0.01)".
    notes: >-
      n=48 (41 befejező), vegyes sport, jól edzett férfiak főleg; 9 hét, kiadói teljes szövegből idézve. Kritika: a
      THR-csoport terhelése alacsonyabb lehetett; a HVT-csoport már eleve nagy volument edzett (plafonhatás).
      Ultra-átvitel: a „küszöbön ragadás" ellen szól, de a HVT-kar gyengesége nem cáfolja a volumen szerepét ultrán.
    status: ellenorizve-doi

  - key: neal-2013-polarized-cyclists
    type: journal
    authors: [Neal C.M., Hunter A.M., Brennan L., O'Sullivan A., Hamilton D.L., DeVito G., Galloway S.D.R.]
    year: 2013
    title: "Six weeks of a polarized training-intensity distribution leads to greater physiological and performance adaptations than a threshold model in trained cyclists"
    journal: "Journal of Applied Physiology 114(4):461-471"
    doi: 10.1152/japplphysiol.00652.2012
    url: https://api.crossref.org/works/10.1152/japplphysiol.00652.2012
    grade: A
    questions: [02:Q1]
    summary: >-
      Keresztezett RCT kerékpárosokon: 12 edzett férfi kerékpáros 2×6 hét polarizált (80/0/20) vs. küszöb (57/43/0)
      eloszlással, azonos edzésidő mellett, 4 hét kimosással. A csúcsteljesítmény (PPO) +8±2% vs. +3±1%, a laktátküszöb
      +9±3% vs. +2±4%, a nagy intenzitású kapacitás +85±14% vs. +37±14% a polarizált javára (p<0,05). 40 km-es
      időfutamban is a POL adott nagyobb javulást.
    quote: >-
      "Improvements were greater following polarized rather than threshold for PPO [mean (±SE) change of 8 (±2)% vs.
      3 (±1)%], LT [9 (±3)% vs. 2 (±4)%]" … "high-intensity exercise capacity [85 (±14)% vs. 37 (±14)%]".
    notes: >-
      n=12 férfi kerékpáros, ~heti 6–10 óra edzés – a célközönséghez közeli óraszám; kerékpáros-specifikus.
      Crossref-absztraktból idézve. 6 hét rövid táv; a küszöbcsoport session-RPE-terhelése magasabb volt (nagyobb
      fáradtság ugyanannyi idő alatt) – ultrára ez a „fenntarthatósági" érv.
    status: ellenorizve-doi

  - key: munoz-2014-recreational
    type: journal
    authors: [Muñoz I., Seiler S., Bautista J., España J., Larumbe E., Esteve-Lanao J.]
    year: 2014
    title: "Does Polarized Training Improve Performance in Recreational Runners?"
    journal: "International Journal of Sports Physiology and Performance 9(2):265-272"
    doi: 10.1123/ijspp.2012-0350
    url: https://api.crossref.org/works/10.1123/ijspp.2012-0350
    grade: A
    questions: [02:Q1]
    summary: >-
      Amatőr adat: 30 hobbi futó 10 hétig polarizált (~77/3/20) vs. küszöb közeli (~46/35/19) eloszlással, azonos
      terhelés mellett, heti ~4-5 edzés. Mindkét csoport javított 10 km-en (p<0,001); a polarizált 5,0%, a küszöb 3,6%
      javulás (~41 s különbség a poszt-teszten), a különbség nem szignifikáns. Következtetés: amatőr szinten a
      polarizált legalább olyan jó, és akik ténylegesen elérték a cél-eloszlást, azoknál nagyobb volt a javulás.
    quote: >-
      "Improvements were 5.0% vs 3.6%, ~41 s difference at post-training-intervention." … zone distribution "±77/3/20"
      (PET) vs "±46/35/19" (BThET).
    notes: >-
      n=30 hobbifutó (vegyes), futás, 10 hét – a legjobb közvetlen adat alacsony óraszámú amatőrre. Crossref-absztraktból.
      Csoportkülönbség nem szignifikáns → a „polarizált mindenkinek jobb" állítás amatőröknél gyenge. Kerékpárra
      áttétel: elvi (nem terheléses ízület, több Z2 tolerálható).
    status: ellenorizve-doi

  - key: rosenblat-2019-pol-thr-meta
    type: journal
    authors: [Rosenblat M.A., Perrotta A.S., Vicenzino B.]
    year: 2019
    title: "Polarized vs. Threshold Training Intensity Distribution on Endurance Sport Performance: A Systematic Review and Meta-Analysis of Randomized Controlled Trials"
    journal: "Journal of Strength and Conditioning Research 33(12):3491-3500 (online 2018)"
    doi: 10.1519/jsc.0000000000002618
    url: https://api.openalex.org/works/doi:10.1519/JSC.0000000000002618
    grade: A
    questions: [02:Q1]
    summary: >-
      Az első POL vs. THR meta-analízis RCT-kből: 4 vizsgálat, ebből 3 a metában. Időfutam-teljesítményben közepes
      hatás a polarizált javára (ES=-0,66; 95% CI -1,17 – -0,15). A vizsgálatok módszertani minősége alacsony
      (PEDro 4-5/10), a minta kicsi – az irány konzisztens, a bizonyosság mérsékelt.
    quote: >-
      "moderate effect (ES = -0.66; 95% CI: -1.17 to -0.15) favoring POL group over THR group" … "2 of 4 studies scored
