      periodizált váltása a leghatékonyabb.
    quote: >-
      "participants in the PYR → POL group showed the largest improvement in all these variables (~3.0% for relative
      VO2max, ~1.7% for vBLa2, ~1.5% for vBLa4, ~1.5% for 5-km running time trial performance)".
    notes: >-
      n=60 férfi futó, terep-RCT jellegű; Crossref-absztraktból. Ultrára fordítva: az „alap piramis → specifikus fázisban
      több csúcsosított minőség" sorrend támogatott; de az ultra-versenyintenzitás Z1-Z2, így a „polarizálás" célja itt a
      fittség emelése, nem a versenyspecificitás.
    status: ellenorizve-doi

  - key: galan-rioja-2023-cyclist-tid-sr
    type: journal
    authors: [Galán-Rioja M.Á., González-Ravé J.M., González-Mohíno F., Seiler S.]
    year: 2023
    title: "Training Periodization, Intensity Distribution, and Volume in Trained Cyclists: A Systematic Review"
    journal: "International Journal of Sports Physiology and Performance 18(2):112-122"
    doi: 10.1123/ijspp.2022-0302
    url: https://journals.humankinetics.com/view/journals/ijspp/18/2/article-p112.xml
    grade: A
    questions: [02:Q1, 02:Q2]
    summary: >-
      Kerékpáros-specifikus szisztematikus áttekintés: 7 vizsgálat, 161 edzett kerékpáros (18–41 év). Heti volumen
      7,5–10,76 h (tradicionális) ill. 8,75–11,68 h (blokk-periodizáció) – vagyis a vizsgált „edzett kerékpáros"
      óraszám pont a célközönség sávjában van. Piramis TID: ~80% Z1, a maradék Z2>Z3; polarizált: ~80% Z1, ~20%
      főleg Z3, minimál Z2. Fő következtetés: 8–12 hetes távon egyik periodizációs modell sem bizonyítottan jobb.
    quote: >-
      "Seven studies met the inclusion criteria" … weekly hours "7.5 to 10.76 h·wk–1" (traditional) and
      "8.75 to 11.68 h·wk–1" (block) … "No evidence is currently available favoring a specific periodization model
      during 8 to 12 weeks in trained road cyclists."
    notes: >-
      Kerékpáros, döntően férfi minták; kiadói oldalról idézve. Közvetlenül releváns a 8–12 h/hét sávra. Ultra-specifikus
      kimenet (többórás teljesítmény) egyik beválasztott vizsgálatban sem volt.
    status: ellenorizve-doi

  - key: burnley-2022-pol-debate
    type: journal
    authors: [Burnley M., Bearden S.E., Jones A.M.]
    year: 2022
    title: "Polarized Training Is Not Optimal for Endurance Athletes"
    journal: "Medicine & Science in Sports & Exercise 54(6):1032-1034"
    doi: 10.1249/mss.0000000000002869
    url: https://api.openalex.org/works/doi:10.1249/MSS.0000000000002869
    grade: C
    questions: [02:Q1]
    summary: >-
      Vitacikk a polarizált edzés ellen: az elit sportolók valójában ritkán edzenek ténylegesen polarizáltan (idő-alapon
      inkább piramis), a „polarizált" definíciója következetlen, az edzésnapló-elemzések megerősítési torzításra
      hajlamosak, és nincs meggyőző bizonyíték a más modellekkel szembeni fölényre. A Foster-oldali válaszcikkel együtt
      a terület fő kontroverziáját rögzíti.
    quote: >-
      "polarized training is, in fact, rarely practiced by elite athletes, there is limited to no evidence that it is
      more effective than other training models".
    notes: >-
      Lektorált folyóiratban megjelent álláspont-cikk (nem adatközlés) – ezért C. OpenAlex-ből idézve. Párja: Foster és
      mtsai. pro-polarizált cikke ugyanabban a számban (itt nem külön tétel). Az ellentmondás-blokk kulcsforrása.
    status: ellenorizve-doi

  # ---------------------------------------------------------------- Q2: volumen vs. intenzitás, time-crunched, durability-edzés
  - key: milanovic-2015-hiit-meta
    type: journal
    authors: [Milanović Z., Sporiš G., Weston M.]
    year: 2015
    title: "Effectiveness of High-Intensity Interval Training (HIT) and Continuous Endurance Training for VO2max Improvements: A Systematic Review and Meta-Analysis of Controlled Trials"
    journal: "Sports Medicine 45(10):1469-1481"
    doi: 10.1007/s40279-015-0365-0
    url: https://link.springer.com/article/10.1007/s40279-015-0365-0
    grade: A
    questions: [02:Q2]
    summary: >-
      28 kontrollált vizsgálat, 723 résztvevő (átlag 25,1±5 év): a HIIT VO2max-emelése 5,5 ml/kg/perc (±1,2), a
      folyamatos állóképességi edzésé 4,9 ml/kg/perc (±1,4) nem edző kontrollhoz képest; a HIIT előnye a folyamatos
      edzéssel szemben kicsi, 1,2 ml/kg/perc (±0,9). A time-crunched megközelítés élettani alapja: VO2max-ra a HIIT
      időhatékony helyettesítő.
    quote: >-
      "a possibly small beneficial effect for HIT (1.2 mL·kg−1·min−1; ±0.9 mL·kg−1·min−1)" … endurance training
      "(4.9 mL·kg−1·min−1; 95 % confidence limits ±1.4 mL·kg−1·min−1)", HIT "(5.5 mL·kg−1·min−1; ±1.2 mL·kg−1·min−1)".
    notes: >-
      Döntően fiatal, mérsékelten edzett populációk, rövid (≤16 hét) beavatkozások; kimenet csak VO2max – zsíranyagcsere,
      durability, többórás teljesítmény NEM. Kiadói absztraktból. Ultra-korlát: a VO2max-transzfer nem azonos az
      5-10 órás teljesítménnyel.
    status: ellenorizve-doi

  - key: casado-2019-easyruns
    type: journal
    authors: [Casado A., Hanley B., Santos-Concejero J., Ruiz-Pérez L.M.]
    year: 2019
    title: "World-Class Long-Distance Running Performances Are Best Predicted by Volume of Easy Runs and Deliberate Practice of Short-Interval and Tempo Runs"
    journal: "Journal of Strength and Conditioning Research 35(9):2525-2531 (online 2019)"
    doi: 10.1519/jsc.0000000000003176
    url: https://api.openalex.org/works/doi:10.1519/jsc.0000000000003176
    grade: B
    questions: [02:Q2]
    summary: >-
      Dózis-válasz megfigyelés: 85 (világklasszistól nemzeti szintig terjedő) férfi futó retrospektív edzésadatai az
      első 3-5-7 szisztematikus edzésévre. A könnyű futás volumene r≥0,75 (p<0,001) korrelációt mutatott a
      versenyteljesítménnyel, a tempófutás r=0,68; az összes lefutott távolság a variancia ≥57%-át magyarázta
      (R²≥0,57). A hosszú-intervall gyakorlás korrelációja gyenge (r=0,22).
    quote: >-
      "Eighty-five male runners reported their times in different running events and amounts of DP activities" …
      easy run volume "r ≥ 0.75, p < 0.001", tempo runs "r = 0.68, p < 0.001", total distance "R² ≥ 0.57, p < 0.001".
    notes: >-
      Retrospektív, önbevallásos, futás, csak férfi – okozatiság nem igazolt (a tehetségesebbek többet bírnak edzeni).
      OpenAlex-rekonstruált absztraktból. A „volumen a legerősebb prediktor" tézis fő számszerű forrása; kerékpárra
      elvi átvitel (nem ütéses sport, volumen még skálázhatóbb).
    status: ellenorizve-doi

  - key: spragg-2022-durability-training
    type: journal
    authors: [Spragg J., Leo P., Swart J.]
    year: 2023
    title: "The relationship between training characteristics and durability in professional cyclists across a competitive season"
    journal: "European Journal of Sport Science 23(4):489-498 (online 2022)"
    doi: 10.1080/17461391.2022.2049886
    url: https://api.openalex.org/works/doi:10.1080/17461391.2022.2049886
    grade: B
    questions: [02:Q2, 02:Q3]
    summary: >-
      Az edzés-oldali durability-bizonyíték kulcsa: 30 U23 profi kerékpáros (20,1±1,1 év, VO2max 73,8±2,5) friss és
