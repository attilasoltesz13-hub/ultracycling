  # ================================================================ Q6/Q4: Ridefar modell-sorozat (TCR-útvonalra futtatott sebességmodell)
  - key: white-2016-ridefar-method
    type: guide
    authors: [White C. (Ride Far)]
    credential: "Ultra-távú versenyző (TCR-befutó), Ride Far tudástár; saját fejlesztésű teljesítmény–sebesség modell a teljes TCR-útvonalra"
    year: 2016
    title: "Method, Finish Times & Power Effects – What Determines Cycling Speed?"
    journal: "ridefar.info (Bike → Cycling Speed sorozat, 2. és 1. oldal)"
    doi: null
    url: https://ridefar.info/bike/cycling-speed/method/
    grade: C
    questions: [Q6, Q4, Q3]
    summary: >-
      Saját modell (a Bike Calculator / Best Bike Split / Cycling Power Lab helyett) a 2015-ös (4333 km, ~38 000 m) és
      2016-os (3899 km, ~55 000 m) TCR-útvonalra: 67 kg versenyző + 10 kg bringa + 8 kg felszerelés = 85 kg. Átlagos versenyző
