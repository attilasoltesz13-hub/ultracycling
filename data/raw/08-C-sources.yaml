sources:
  # ================================================================ Q6: fizikai modell (lektorált)
  - key: martin-1998-model
    type: journal
    authors: [Martin J.C., Milliken D.L., Cobb J.E., McFadden K.L., Coggan A.R.]
    credential: "Biomechanikai/élettani kutatók (Univ. of Utah, USOC); a Martin-modell a Best Bike Split és a legtöbb kalkulátor alapja"
    year: 1998
    title: "Validation of a Mathematical Model for Road Cycling Power"
    journal: "Journal of Applied Biomechanics 14(3):276-291"
    doi: 10.1123/jab.14.3.276
    url: https://collections.lib.utah.edu/dl_files/b4/8e/b48ef26086091662c561e673d7bd990d77868437.pdf
    grade: A
    questions: [Q6, Q4]
    summary: >-
      A teljes teljesítményt a légellenállás (½ρ·CdA·v_lég²·v), a gördülési ellenállás (Crr·m·g·v), a kerékcsapágy-veszteség,
      az emelkedő (m·g·GR·v) és a gyorsítás tagjaiból építi fel, hajtáslánc-hatásfokkal (Ec ≈ 97,7%) osztva. Szélcsatornában
      mért CdA 0,255–0,269 m² (0–15° yaw), Crr = 0,0032 (magas nyomású köpeny, Kyle 1988 alapján). Terepi SRM-validálás:
      R² = 0,97, standard hiba 2,7 W, 172,8 ± 14,7 W (SRM) vs 172,0 ± 15,2 W (modell).
    quote: >-
      "The measured values for power were highly correlated (R² = .97) with, and were not different than, the modeled
      values. The standard error between the modeled and measured power (2.7 W) was very small."
    notes: >-
      Ez a kalkulátor alapegyenlete. Az egyenlet (15): Ptot = [V·½ρ(CdA+Fw)·Va² + V·Crr·mT·g + V(91+8,7V)·10⁻³ + V·mT·g·GR +
      ½(mT+I/r²)(Vf²−Vi²)/(tf−ti)]/Ec. A validálás sík, szélcsendes, 20–40 km/h tartományban, versenyzői pozícióban történt –
      terhelt bringával, murván, 15–25 km/h-n a struktúra ugyanaz, de a paraméterek (CdA, Crr) mások (lásd Frank 2021, Bertucci 2013).
      Utah-repozitóriumi szerzői PDF; DOI Crossrefen ellenőrizve.
    status: ellenorizve-doi

  - key: crouch-2017-aero-review
    type: journal
    authors: [Crouch T.N., Burton D., LaBry Z.A., Blair K.B.]
    credential: "Monash University (aerodinamikai kutatócsoport) és MIT Sports Lab"
    year: 2017
    title: "Riding against the wind: a review of competition cycling aerodynamics"
    journal: "Sports Engineering 20(2):81-110"
    doi: 10.1007/s12283-017-0234-1
    url: https://link.springer.com/article/10.1007/s12283-017-0234-1
    grade: A
    questions: [Q6]
    summary: >-
      Áttekintés (96 hivatkozás): síkon a légellenállás az összes ellenállás >90%-a (Kyle & Burke), Martin szerint a
      teljesítmény 56–96%-a a lejtéstől függően. Az ellenállási tényező Cd ≈ 0,6 (áramvonalas TT-pozíció) – >0,8 (felegyenesedett).
      Felsőfogás/kormányszarv → alsófogás: 15–20% kevesebb légellenállás; TT-pozíció: 30–35% kevesebb. Oldalszél aszimmetrikus
      áramlást, plusz oldalerőt és nyomatékokat kelt.
    quote: >-
      "Average wind tunnel data suggest that the reduction in drag between an upright sitting position with straight arms
      (such as the stem and hoods positions) and a drops position can be as much as 15–20%, and for the time-trial position
      as much as 30–35%."
    notes: >-
      Versenykerékpározásra (nem terhelt bringára) vonatkozik; a százalékok a pozícióváltás felső becslései – aerobaron
      táskás bringával a "TT-pozíció" nyeresége kisebb (lásd white-2016-ridefar-aero: −0,03 m², branston-2023-windtunnel: 31 W/35 km/h).
      Springer-oldal megnyitva, DOI Crossrefen ellenőrizve.
    status: ellenorizve-doi

  - key: grappe-1997-obree
    type: journal
    authors: [Grappe F., Candau R., Belli A., Rouillon J.D.]
    year: 1997
    title: "Aerodynamic drag in field cycling with special reference to the Obree's position"
    journal: "Ergonomics 40(12):1299-1311"
    doi: 10.1080/001401397187388
    url: https://api.openalex.org/works/doi:10.1080/001401397187388
    grade: B
    questions: [Q6]
    summary: >-
      Terepi (velodrom, állandó sebesség, mért külső mechanikai teljesítmény) CdA-mérés négy pozícióban: felsőfogás (UP),
      alsófogás (DP), aero (AP), Obree (OP). Az UP-hoz képest DP −7,8%, AP −12,4%, OP −27,8%. A cikk táblázatában ismert
      abszolút értékek: UP 0,299, DP 0,276, AP 0,262, OP 0,216 m² (edzett versenyző, táska nélkül).
    quote: >-
      "Compared to UP, DP, AP and OP produced significant reductions 7.8, 12.4 and 27.8%, respectively"
    notes: >-
      Absztrakt OpenAlex-rekonstrukcióból (a százalékok az absztraktban szerepelnek; az abszolút m²-értékek a cikk 1. táblázatából
      származnak, az absztraktban nem szerepelnek – másodlagosan ismert számok, jelölve). Régi (1997), de ez a leggyakrabban
      idézett terepi CdA-referencia pozíciónként. Ultrára: az "AP" itt klasszikus aerobar-pozíció; terhelt bringán +0,03–0,08 m²
      várható (Frank 2021, Ridefar). DOI Crossrefen ellenőrizve.
    status: ellenorizve-doi

  - key: bertucci-2013-mtb-field
    type: journal
    authors: [Bertucci W., Rogier S., Reiser R.F.]
    year: 2013
    title: "Evaluation of aerodynamic and rolling resistances in mountain-bike field conditions"
    journal: "Journal of Sports Sciences 31(14):1606-1613"
    doi: 10.1080/02640414.2013.792945
    url: https://api.openalex.org/works/doi:10.1080/02640414.2013.792945
    grade: B
    questions: [Q6]
    summary: >-
      Terepi mérés MTB-seknél ülő pozícióban: CdA = 0,357 ± 0,023 m². A légellenállás az összes mozgási ellenállás 8–35%-a
      (a gördülési ellenállás nagyságától függően). Sima köpeny 21 ± 15%-kal kisebb gördülési ellenállás, mint a bütykös;
      a felület (út, homok, fű) és a nyomás (200 vs 400 kPa) is szignifikánsan hat. Másodlagos forrás (Lessa Bernardineli
      2024 HackMD-modell) szerint az út feletti terepen a Crr "2–3-szor magasabb, mint hagyományos országúton".
    quote: >-
      "Mountain-bike cyclists have an effective frontal area of 0.357 ± 0.023 m², with mean aerodynamic representing 8-35%
      of total resistance of cyclists' motion depending on the magnitude of rolling resistance."
    notes: >-
      Absztrakt OpenAlex-rekonstrukcióból; a Crr abszolút számai (út vs fű vs homok) csak a teljes szövegben vannak, amit nem
      sikerült megnyitni (Taylor & Francis 403, PubMed captcha, ResearchGate 429) – a "2–3×" arány MÁSODLAGOS forrásból
      (hackmd.io/@danlessa). Tour Divide-jellegű felületre ez a legjobb lektorált támpont, de a murva nem szerepel a vizsgált
      felületek között. DOI Crossrefen ellenőrizve.
    status: ellenorizve-doi

  - key: bassett-1999-hour-records
    type: journal
    authors: [Bassett D.R., Kyle C.R., Passfield L., Broker J.P., Burke E.R.]
    year: 1999
    title: "Comparing cycling world hour records, 1967–1996: modeling with empirical data"
    journal: "Medicine & Science in Sports & Exercise 31(11):1665-1676"
    doi: 10.1097/00005768-199911000-00025
    url: https://api.openalex.org/works/doi:10.1097/00005768-199911000-00025
    grade: B
    questions: [Q6]
    summary: >-
      Szélcsatorna- és SRM-adatokra épített teljesítménymodell + a magasság aerob teljesítményre gyakorolt hatásának irodalmi
      becslése: a ritkább levegő csökkenti a légellenállást, de a leadható teljesítményt is. Órarekordhoz az optimális
      magasság akklimatizált versenyzőnek 2500 m, nem akklimatizáltnak 2000 m; a rekordjavulás ~60%-a technológia, ~40%
      élettan.
    quote: >-
      "The ideal elevation for record attempts is predicted to be 2500 m for acclimatized riders and 2000 m for
      unacclimatized riders."
    notes: >-
      Absztrakt OpenAlex-rekonstrukcióból; LWW kiadói oldal 402-t adott. Ultrára az üzenet: a magasság kettős hatása
      (ρ −0,8–1%/100 m vs VO2max-esés) 1500–2500 m-ig kb. kiegyenlíti egymást síkon, emelkedőn viszont csak a
      teljesítményvesztés marad (a gravitáció nem ritkul). A konkrét %/100 m számok a Ridefar oldalról (white-2016-ridefar-resistance).
      DOI Crossrefen ellenőrizve.
    status: ellenorizve-doi

  - key: isvan-2015-wind-yaw
    type: journal
    authors: [Isvan O.]
    year: 2015
    title: "Wind speed, wind yaw and the aerodynamic drag acting on a bicycle and rider"
    journal: "Journal of Science and Cycling 4(1):42-50"
    doi: null
    url: https://www.jsc-journal.com/index.php/JSC/article/download/168/250
    grade: B
    questions: [Q6]
    summary: >-
      Terepi mérés (szélszenzor + erőmérő + SRM): a légellenállás a négyzetes légsebesség tengelyirányú komponensével arányos,
      nem a tengelyirányú komponens négyzetével – oldalszélben a hagyományos szélszenzor alulbecsli a drag-et. Bevezeti
      az oldal-/front-CdA arányt (μ ≈ 1,2 egy 179 cm/64 kg-os versenyzőnél) és a λ = cos²β + μ·sin²β korrekciót; a "virtuális
      yaw" módszer a 30%-nál nagyobb hibájú pontok arányát 17,4%-ról 2,9%-ra csökkentette.
    quote: >-
      "air drag is proportional to the axial component of the squared airspeed; it is not proportional to the square of
      the axial component"
    notes: >-
      DOI nem ellenőrizve (a JSC oldala nem mutat DOI-t; Crossref-keresés 429). n=1 versenyző, iBike Newton szenzorral.
      Kalkulátorhoz: oldalszélben a hatásos CdA nő (μ>1), tehát a "csak a fejszél-komponenst számolom" közelítés
      alábecsüli a veszteséget – ultrán a tiszta oldalszél is lassít.
    status: url-megnyitva

  - key: groeskamp-2017-incline-wind
    type: journal
    authors: [Groeskamp S.]
    year: 2017
    title: "Translating Uphill Cycling into a Head-Wind and Vice Versa"
    journal: "Journal of Science and Cycling 6(1):32-37"
    doi: null
