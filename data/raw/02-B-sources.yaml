      Egy versenyző tapasztalata, nem mért adat — C. Kísérős/fix-körös 12–24 órás versenyre írva; a 75%-os leghosszabb
      edzés szabálya többnapos önellátó versenyre NEM vihető át (ott a leghosszabb edzés a versenytáv törtrésze).
      Publikálás dátuma bizonytalan (2000-es évek eleje).
