  - key: ronnestad-2011-strength-185min
    type: journal
    authors: [Rønnestad B.R., Hansen E.A., Raastad T.]
    year: 2011
    title: "Strength training improves 5-min all-out performance following 185 min of cycling"
    journal: "Scandinavian Journal of Medicine & Science in Sports 21(2):250-259 (online 2009)"
    doi: 10.1111/j.1600-0838.2009.01035.x
    url: https://api.openalex.org/works/doi:10.1111/j.1600-0838.2009.01035.x
    grade: A
    questions: ["02:Q6"]
    summary: >-
      A legultra-relevánsabb erősítés-vizsgálat: 20 edzett kerékpáros, 12 hét, heti 2 nehéz láberősítés (4 gyakorlat,
      3×4–10 RM) + állóképesség (E+S, n=11) vs. csak állóképesség (E, n=9). 185 perc szubmaximális tekerés UTÁN mért
      5 perces all-out teljesítmény az E+S csoportban 371±9 W-ról 400±13 W-ra nőtt (~+8%, p<0,05), az E csoportban nem
      változott. Az E+S-ben a hosszú tekerés alatt kisebb lett az oxigénfogyasztás, pulzus, laktát és RPE (p<0,05) —
      azaz az erősítés a FÁRADT állapotbeli teljesítményt (durability) javítja.
    quote: >-
      "power output improved from 371±9 to 400±13 W in E+S (P<0.05), while no change occurred in E"; E+S showed
      "greater reductions in oxygen consumption, heart rate, blood lactate, and perceived exertion during prolonged cycling".
    notes: >-
      Absztraktból (OpenAlex; ott 2009-es online évszám, nyomtatott 2011). n=20 férfi, labor, 185 perc — az ultrához
      képest rövid, de a „több órás munka utáni frissesség" kimenet a durability-irodalom (spragg-2023-durability,
      maunder-2021-durability) erősítés-oldali párja.
    status: ellenorizve-doi

  - key: schumann-2022-concurrent-meta
    type: journal
    authors: [Schumann M., Feuerbacher J.F., Sünkeler M., Freitag N., Rønnestad B.R., Doma K., Lundberg T.R.]
    year: 2022
    title: "Compatibility of Concurrent Aerobic and Strength Training for Skeletal Muscle Size and Function: An Updated Systematic Review and Meta-Analysis"
    journal: "Sports Medicine 52(3):601-612 (online 2021)"
    doi: 10.1007/s40279-021-01587-7
    url: https://api.openalex.org/works/doi:10.1007/s40279-021-01587-7
    grade: A
    questions: ["02:Q6"]
    summary: >-
      Frissített meta-analízis (43 vizsgálat) az „interferencia-hatásról": az egyidejű állóképességi+erő edzés a
      maximális erőt (SMD=-0,06; 95% CI -0,20–0,09; p=0,446) és a hipertrófiát (SMD=-0,01; -0,16–0,18; p=0,919)
      NEM rontja; egyedül az explozív erő csökken mérsékelten (SMD=-0,28; -0,48– -0,08; p=0,007), főleg ha a két
      edzés ugyanabban az edzésegységben van (≥3 óra szétválasztás enyhíti). Ultrásnak megnyugtató: a magas aerob
      volumen mellett az erőfejlesztés működik.
    quote: >-
      "maximal strength: SMD = -0.06 (95% CI: -0.20 to 0.09; p=0.446)… muscle hypertrophy: SMD = -0.01 (p=0.919)…
      explosive strength: SMD = -0.28 (95% CI: -0.48 to -0.08; p=0.007)", attenuation intensified "within the same session".
    notes: >-
      Absztraktból (OpenAlex; online 2021, nyomtatott 2022). Egészséges felnőttek (nem csak sportolók), vegyes nem.
      Az explozív erő ultrán másodlagos, így az interferencia gyakorlati jelentősége kicsi; időzítési tanács (külön
      napra vagy ≥3 órára szétválasztani) közvetlenül alkalmazható.
    status: ellenorizve-doi

