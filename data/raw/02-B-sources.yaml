      Edzői keret többnapos ultrára: a terhelés-csúcs a verseny előtt 4–6 héttel legyen (30–42 nap kell az
      adaptációnak); 3+1 vagy 2+1 hetes építő/regeneráló mikrociklusok; heti 6 edzésnap + 1 teljes pihenőnap;
      a taper 2–3 héttel a verseny előtt kezdődik, csökkentett volumennel és megtartott/emelt intenzitással.
      Merev fázisok helyett fokozatos terhelés-emelést hangsúlyoz.
    quote: >-
      "Progression does not mean that each day has to be higher than the previous… but that the general trend of load
      needs to increase over time, to constructively build fitness."
    notes: >-
      Edzői tapasztalat — C. Többnapos önellátó ultrára írva (TABR/RAAM), ezért a taper- és csúcsidőzítés-számai a
      modul ütemterv-generátorának közvetlen bemenetei.
