  - key: towers-2024-trainingweek
    type: web-article
    authors:
    - Towers G.
    credential: Gregor Towers – ultrakerékpáros versenyző és edző (Equilibrio Cycling), DotWatcher-szerző
    year: 2024
    title: Perfect your ultra cycling training strategy & avoid my biggest mistake
    venue: gregortowers.substack.com, 2024-05-24
    doi: null
    url: https://gregortowers.substack.com/p/perfect-your-ultra-cycling-training
    grade: C
    questions: [02:Q10]
    summary: >-
      Versenyző-edző saját heti mintája: 15–20 óra/hét a "sweet spot", 12 óra alatt szerinte nem optimális az ultra-
      felkészülés; 4 hetes blokkok (3 terhelő + 1 regeneráló hét); heti szerkezet: hétfő pihenő/1 h könnyű, kedd VO2max-
      intervall, szerda tempó/küszöb (2,5 h), csütörtök Z2 (2–3 h), péntek alapozó 3–5 h, hétvégén back-to-back 5+ órás
      hosszú edzések; 80/20 (néha 90/10) intenzitás-eloszlás; heti egy ~162 km-es edzés. Legnagyobb hibája: 7 hetes
      blokkok pihenőhét nélkül → krónikus fáradtság.
    quote: >-
      "15-20 hour weeks is the sweet spot for my training. Anything below 12 hour training weeks isn't going to optimally
      prepare your body." ... "The balance between zone 2 riding (endurance) and intensity should be 80/20, sometimes 90/10."
    notes: >-
      n=1 versenyzői-edzői gyakorlat (C); a 15–20 h a célközönség (6–15 h/hét) felső sávja fölött van. A "12 óra alatt nem
      optimális" ellentmond a CTS time-crunched (4–6 h) és a Ride Far "havi km-cél" megközelítésnek – mátrix-sor. Idézetek
      WebFetch-kivonatból.
    status: url-megnyitva

  - key: comeau-2017-raam-training
    type: web-article
    authors:
    - Comeau B.
    credential: World UltraCycling Association (WUCA) cikk; Hughes/Allen/Empfield-idézetekkel, RAAM-versenyzői körkérdéssel
    year: 2017
    title: 'From the Field: How RAAM Riders Train'
    venue: ultracycling.com (WUCA), 2017-02-02
    doi: null
    url: https://ultracycling.com/how-raam-riders-train/
    grade: C
    questions: [02:Q10]
    summary: >-
      A "klasszikus" RAAM-felkészülés négy fázisa: alap (4 hónap, ~5500 mérföld ≈ 8850 km, a fázis végére 12–18 órás
      hetek); sebesség-munka (1–2 hónap, heti egy intenzív edzés a hosszú edzés megtartásával); csúcsforma (6 hét,
      heti 100 mérföldes időfutamok + hétvégi back-to-back 250+150 mérföld vagy egyben 300 mérföld, egyeseknél 3×24 órás
      edzés, ~2500 mérföld/hó); tapering (1–3 hét, hosszú edzés 100–150 mérföldre, ~600 mérföld/hó). Összvolumen: ~10 000
      mérföld (~16 000 km) a RAAM előtti 7–8 hónapban. Az 1998-as RAAM utáni körkérdés tanulsága: a versenyzők többsége
      "több sebesség-munkát" iktatna be.
    quote: >-
      "Accomplished RAAM riders typically ride about 10,000 miles in the 7-8 months preceding RAAM" ... "For endurance
      riders, total volume is less important than the long ride of the week." ... many responded: "more speed work."
    notes: >-
      Szerkesztett szakcikk versenyzői körkérdéssel, n nincs számszerűsítve (C). Kísérős RAAM-ra kalibrált (a mezőny
      felső része); a 12–18 órás hetek és a back-to-back csúcshétvége az önellátó felkészüléssel egybevág, a 3×24 órás
      edzés szélsőség. Idézetek WebFetch-kivonatból.
    status: url-megnyitva

