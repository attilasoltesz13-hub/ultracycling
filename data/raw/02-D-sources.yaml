    summary: >-
      CTS-keret munka melletti sportolónak: heti 2 kemény nap (kedd–csütörtök horgony-edzések), heti 4–6 óra összvolumen
      2–3 órás leghosszabb edzéssel is fenntartható fejlődést adhat; legalább 1 teljes pihenőnap/hét; a "nehéz" edzés
