      Három élversenyző felkészülési elvei: Ibbett 6 hónappal a verseny előtt általános fitnesz + küszöb/tempó fókuszt
      javasol, és óva int a "csak hosszú-lassú" edzéstől ("attól leszel jó, hogy lassan mész sokáig"); kulcs-edzése egy
