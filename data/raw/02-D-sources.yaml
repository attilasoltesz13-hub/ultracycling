    quote: >-
      "Two hard days per week is a great starting point" ... "Designate at least 1 day completely off the bike per week"
      ... "Easy: TSS 10-25% BELOW CTL; Hard: TSS 50-100% ABOVE CTL" (WebFetch-kivonatból)
    notes: >-
      Edzői keret (C), nem ultra-specifikus, de a CTS a RAAM-versenyzők edzőműhelye, és a célközönség (6–15 h/hét) alsó
      sávjára ez a legrelevánsabb publikus keret. A 4–6 h/hét mint minimum éles ellentét Towers "12 óra alatt nem
      optimális" tételével – mátrix-sor. TSS-szabályai a terhelés-kalkulátorhoz használhatók.
