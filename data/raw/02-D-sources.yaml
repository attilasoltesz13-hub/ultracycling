    quote: >-
      "Rides longer than about 4-6 hours do not increase your physical capabilities." ... "aim to be on the bike for
      10+ hours per a day" ... "at least 80% to 90% of the elapsed time actually in the saddle" (WebFetch-kivonatból)
    notes: >-
      Tapasztalati (C). Pontos darabszámot és időzítést nem ad ("a hónapokban a verseny előtt"). Kontraszt: az Apidura-
