  - key: white-ridefar-trainingplan
    type: web-guide
    authors:
    - White C. (Ride Far)
    credential: Chris White – TCR-befutó (2015–2017), a Ride Far ultra-bikepacking tudástár szerzője
    year: 2017
    title: Training Plans for Bikepacking Races
    venue: ridefar.info (Rider → Physical Training)
    doi: null
    url: https://ridefar.info/rider/physical/training-plan/
    grade: C
    questions: [02:Q10]
    summary: >-
      A Ride Far edzésterv-filozófiája: havi (nem heti) km-célok, tipikusan 500–1000 km/hó télen és 1000–1500 km/hó
      tavasszal-nyáron, azaz 2000–20 000+ km a verseny előtti hat hónapban (az elit példa: Allegaert ~20 000 km 7 hónap
      alatt). A 4–6 óránál hosszabb edzések szerinte nem adnak további élettani hasznot, csak a regenerációt rontják;
      a ~2 W/kg 12 órán át napi szinten már a legtöbb bikepacking-verseny befejezéséhez elég. Ingázás a leghatékonyabb
      volumenforrás; a rajt előtt 1–2 hét könnyítés és sok alvás.
    quote: >-
      "Between 2,000 km and 20,000+ km in the six months leading up to the event." ... "Averaging about 2 watts per kg
      for 12 hours of riding per day will allow you to finish most bikepacking races in a reasonable time." (WebFetch-kivonatból)
    notes: >-
      Nem lektorált tapasztalati útmutató (C), n nincs. A "4–6 óra fölött nincs többlet-adaptáció" állítás ellentmond a
      hosszú edzések durability-irodalmának (spragg-2024-intensity) és a WUCA/CTS "long ride a kulcs" elvének – ez a
      konvergencia-mátrix egyik fő eltérése. Idézetek a WebFetch-összefoglalóból (másodlagos kivonat az oldal szövegéből).
    status: url-megnyitva

