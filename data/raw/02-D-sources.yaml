  - key: knechtle-2011-finishers-720km
    type: journal
    authors: [Knechtle B., Knechtle P., Rüst C.A., Rosemann T., Lepers R.]
    year: 2011
    title: "Finishers and nonfinishers in the 'Swiss Cycling Marathon' to qualify for the 'Race Across America'"
    journal: "Journal of Strength and Conditioning Research 25(12):3257-3263"
    doi: 10.1519/jsc.0b013e31821606b3
    url: https://api.openalex.org/works/pmid:22080313
    grade: B
    questions: [02:Q10]
    summary: >-
      720 km-es RAAM-kvalifikációs verseny, 39 befutó vs. 37 kieső amatőr. A befutók hetente több edzésegységet, több
      km-t és gyorsabb edzéstempót mutattak; a teljesítéssel a heti edzéstáv (r=0,37), a heti edzésóra (r=0,44) és az
      edzéssebesség (r=-0,59) korrelált, a versenyidővel a szervezői (r=0,50) és saját (r=0,49) táplálkozás. Az
      antropometria nem jelezte előre a teljesítést – a szerzők szerint az edzésvolumen és a megfelelő táplálkozás a
      siker kulcsa ultrakerékpáron.
    quote: >-
      "training distance (r=0.37), weekly training hours (r=0.44), and training speed (r=-0.59) correlated with race
      completion" (absztraktból, OpenAlex-rekonstrukció)
    notes: >-
      Terep-megfigyelés (B), n=76 férfi amatőr ultrakerékpáros, 720 km-es egynapos formátum. Az abszolút heti óraszámok
      a teljes szövegben vannak (nem nyitható); csak korrelációk idézhetők. Ellentmondás: knechtle-2009-anthropometry-600km
      a befutókon belül nem talált edzésvolumen–sebesség kapcsolatot.
    status: ellenorizve-doi

  - key: knechtle-2009-anthropometry-600km
    type: journal
    authors: [Knechtle B., Wirth A., Knechtle P., Rosemann T.]
    year: 2009
    title: "Moderate Association of Anthropometry, But Not Training Volume, With Race Performance in Male Ultraendurance Cyclists"
    journal: "Research Quarterly for Exercise and Sport 80(3):563-568"
    doi: 10.5641/027013609x13088500159606
    url: https://api.openalex.org/works/doi:10.5641/027013609x13088500159606
    grade: B
    questions: [02:Q10]
    summary: >-
      28 férfi hobbi-ultrakerékpáros a 600 km-es Swiss Cycling Marathonon: a verseny előtti 3 hónap edzésóráit és km-eit
      rögzítették. Többszörös lineáris regresszióban az antropometria mérsékelten függött össze a versenysebességgel
      (r²=0,178, p<0,05), az edzésvolumen egyáltalán nem (r²=0,000, p>0,05). Vagyis a befutók között a "ki mennyit
      edzett" önmagában nem jósolta a sebességet.
    quote: >-
      "anthropometry demonstrated a moderate association with race speed (r² = .178, p < .05), while training volume
      showed no significant correlation (r² = .000, p > .05)" (absztraktból, OpenAlex-rekonstrukció)
    notes: >-
      Megfigyelés (B), n=28 férfi amatőr, 600 km. A volumen–teljesítmény kapcsolat hiánya a BEFUTÓKON belül értendő;
      a teljesítés valószínűségét a volumen igenis jelzi (knechtle-2011-finishers-720km) – a kettő együtt: a volumen
      "belépő", nem rangsoroló. r² a sebesség varianciájára; CI nem közölt.
    status: ellenorizve-doi

