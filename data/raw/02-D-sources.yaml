  - key: mcquarrie-tec-zone3
    type: web-guide
    authors:
    - McQuarrie C. (Thomas Endurance Coaching)
    credential: Carson McQuarrie – Thomas Endurance Coaching, ultra-távú kerékpáros specialista edző
    year: 2023
    title: Top 5 Zone 3 Workouts for the Ultra-Endurance Cyclist
    venue: thomasendurancecoaching.com
    doi: null
    url: https://www.thomasendurancecoaching.com/top-5-zone-3-workouts-for-the-ultra-endurance-cyclist/
    grade: C
    questions: [02:Q10]
    summary: >-
      Ultra-specifikus Z3/tempó edzések időhiányos versenyzőknek: 3–6 óra a küszöb 76%-án; 2,5 h 70%-on + 4×15 perc
      hegyi ismétlés 78%-on; "stacked" edzés (este 3 h + reggel 90 perc intervallal) a kevés pihenővel tekerés
      gyakorlására; over-under küszöbmunka. A Z3 szerinte a leghatékonyabb TSS-építő, amikor a versenytáv-hosszú edzés
      nem fér bele – a versenyközeli 6–8 hétre ajánlva.
    quote: >-
      "Strategically weaving zone 3 workouts that replicate race demands into an ultra-endurance cyclists' training is
      the key to shorter training time." ... "3 – 6 hours @ 76% of Threshold" (WebFetch-kivonatból)
    notes: >-
      Edzői közlés (C), n nincs. A Z3-hangsúly részben ELTÉR a 80/20 polarizált ajánlástól (Towers, Seiler) – a mátrix
      "intenzitás-eloszlás" sorának eltérés-oszlopa; a védekezés: az ultra versenyintenzitása maga is Z2-Z3 határa.
