  - key: storbeck-2019-pbp-speeds
    type: web-article
    authors: [Storbeck O.]
    credential: "Cycling Intelligence blog szerzője, randonneur (PBP 2015, 2019 befutó), újságíró"
    year: 2019
    title: "Why don't seven decades of cycling innovation show up in PBP speeds?"
    journal: "cycling-intelligence.com, 2019-12-30"
    doi: null
    url: https://cycling-intelligence.com/2019/12/30/why-dont-seven-decades-of-cycling-innovation-show-up-in-pbp-speeds/
    grade: C
    questions: [Q2, Q5]
    summary: >-
      PBP-átlagidők: 1948-ban 78:37 óra (15,6 km/h átlag), 1975-ben 73:10 (16,0 km/h, leggyorsabb év),
      2019-ben ~78 óra (15,3 km/h); a leggyorsabbak 1948-ban 51:15 (23,4 km/h), 1966-ban 44:21, 2015-ben 42:26
      (rekord). A szerző tézise: a bruttó sebességet nem az anyag, hanem a megállási/alvási idő és a mezőny
      összetétele határozza meg; 1 kg tömegcsökkentés kb. napi 3 percet ér.
    quote: >-
      "In 1948, long before Di2, hub dynamos and tubeless tyres with low rolling resistance were invented, the
      average rider came around in 78:37 hours, an average speed of 15.6 kph."
    notes: >-
      Nem lektorált, hivatalos eredménylistákból számolt átlagok. A 1200 km-es brevet bruttó sebessége (15–16 km/h)
      vs. a gyorsak 23–28 km/h-ja a mozgásidő-hányad szerepét illusztrálja; kontrollonkénti sebesség-lecsengést
      nem közöl. A "3 perc/nap/kg" a szerző (és forrása, Chris White) becslése, nem mérés.
    status: url-megnyitva

