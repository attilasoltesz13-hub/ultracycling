  - key: dekoning-2011-hazard
    type: journal
    authors: [de Koning J.J., Foster C., Bakkum A., Kloppenburg S., Thiel C., Joseph T., Cohen J., Porcari J.P.]
    year: 2011
    title: "Regulation of Pacing Strategy during Athletic Competition"
    journal: "PLoS ONE 6(1):e15863"
    doi: 10.1371/journal.pone.0015863
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0015863
    grade: A
    questions: [Q2]
    summary: >-
      Laboratóriumi szimulált versenyek alapján a "Hazard Score" = pillanatnyi RPE × hátralévő távolság-hányad.
      1,5 alatt a versenyzők gyorsítanak, 1–3 között tartják a sebességet, 3 fölött lassítanak. A modell a
      tempóváltoztatás valószínűségét írja le, nem az optimális stratégiát.
    quote: >-
      "There was a significant likelihood that the change in velocity would be positive (acceleration) when the
      Hazard Score was less than 1.5, negative when the Hazard Score was greater than 3 and unchanged when the
      Hazard Score was between 1–3."
    notes: >-
      Rövid laborfutamok (percek–1 óra), nem ultra; a keret (RPE × hátralévő rész) az ultrán is használható
      önellenőrző szabály: ha a verseny elején (hátralévő hányad ~1) az RPE már 3 fölött van, a lassulás
      elkerülhetetlen. Elméleti alap az abbiss-2008-pacing és tucker-2009-anticipatory mellé. Nyílt hozzáférés.
    status: ellenorizve-doi

