  - key: bossi-2017-24h-running
    type: journal
    authors: [Bossi A.H., Matta G.G., Millet G.Y., Lima P., Pertence L.C., de Lima J.P., Hopker J.G.]
    year: 2017
    title: "Pacing Strategy During 24-Hour Ultramarathon-Distance Running"
    journal: "International Journal of Sports Physiology and Performance 12(5):590-596"
    doi: 10.1123/ijspp.2016-0237
    url: https://kar.kent.ac.uk/56782/1/Bossi%20et%20al%202016%20Pacing%20Strategy%20During%2024-hour%20Ultramarathon-Distance%20Running.pdf
    grade: B
    questions: [Q2]
    summary: >-
      501 futó (398 férfi, 103 nő) öt kiadás (2008–2012) 24 órás pályafutásán (Rio, 400 m-es pálya), legalább
      19,2 óra tényleges futással. Átlag 135,6 ± 33,0 km, 22,4 ± 1,3 óra aktív idő. Fordított J-alakú tempó:
      folyamatos lassulás a 19. óráig, kis emelkedés, majd az utolsó órában szignifikáns esés. A leggyorsabb
      csoport (180,5 km) alacsonyabb relatív rajtintenzitással és egyenletesebben futott, a leglassabb (97,2 km)
      gyorsabban indult és jobban ingadozott. Az első 2 óra normalizált sebessége és az összes távolság között
      r = -0,58 (p < 0,001), az utolsó 2 óráé nem korrelált (r = 0,03).
    quote: >-
      "an inverse moderate correlation was found between total running distance and normalised mean running
      speed in the first 2 h" ... "the fastest runners start at lower relative intensities and display a more
      even pacing strategy than slower runners."
    notes: >-
      Futás, 24 órás formátum – a 24 órás kerékpáros versenyekre a legközelebbi analógia (időlimit, kör,
      folyamatos). A "túl gyors rajt ára" itt a saját átlaghoz viszonyított rajtsebesség: aki a saját átlagához
      képest gyorsan kezd, kevesebbet tesz meg. Megfigyeléses (nem randomizált) – a jobb futó okos rajtja
      lehet a tapasztalat következménye is. Kent-repozitóriumi szerzői PDF, DOI a Crossref-en ellenőrizve.
    status: ellenorizve-doi

  - key: inoue-2019-24h-pacing
    type: journal
    authors: [Inoue A., Santos T.M., Hettinga F.J., Alves D.S., Viana B.F., Terra B.S., Pires F.O.]
    year: 2019
    title: "The Impact of Sex and Performance Level on Pacing Behavior in a 24-h Ultramarathon"
    journal: "Frontiers in Sports and Active Living 1:57"
    doi: 10.3389/fspor.2019.00057
    url: https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2019.00057/full
    grade: B
    questions: [Q2]
    summary: >-
      51 futó (30 férfi, 21 nő), 24 órás pályafutás (Rio). Sebesség: kezdeti szakasz 9,5 ± 1,5 km/h, középső
      6,2 ± 1,4, záró 6,5 ± 1,4 km/h. A sebesség variációs együtthatója (CV) a jó teljesítményű férfiaknál
      21,5 ± 4,8%, a gyengébbeknél 27,2 ± 3,0%. Az összes távolság fordítottan korrelált a jelentős
      sebességcsökkenések (SSR) számával és a CV-vel (férfiak: r = -0,47 és -0,64; nők: -0,61 és -0,47).
    quote: >-
      "Total distance was inversely correlated with the number of SSR and speed CV in male (r= -0.47 and r= -0.64,
      respectively) and female (r= -0.61 and r= -0.47, respectively)."
    notes: >-
      Futás; a "sebesség-ingadozás = távolságveszteség" tétel legtisztább számszerűsítése 24 órás keretben.
      Az SSR (jelentős sebességcsökkenés) fogalma a kerékpáros megállások/lassulások elemzésére átvihető.
      Kis minta (n=51), egy kiadás. Nyílt hozzáférés, teljes szöveg.
    status: ellenorizve-doi

  - key: deusch-2021-timelimited
    type: journal
    authors: [Deusch H., Nikolaidis P.T., Alvero-Cruz J.R., Rosemann T., Knechtle B.]
    year: 2021
    title: "Pacing in Time-Limited Ultramarathons from 6 to 24 Hours—The Aspects of Age, Sex and Performance Level"
    journal: "Sustainability 13(5):2705"
    doi: 10.3390/su13052705
    url: https://www.mdpi.com/2071-1050/13/5/2705
    grade: B
    questions: [Q2]
    summary: >-
      937 befutó (677 férfi, 260 nő; 48,6 ± 11,8 év) 6, 12 és 24 órás időlimites futóversenyeken (Svájc, Románia,
      Görögország, 2009–2018). A tempó variációs együtthatója a táv hosszával nő: 6 h CV = 0,120 ± 0,062;
      12 h 0,176 ± 0,070; 24 h 0,218 ± 0,186. A gyorsabb futók egyenletesebbek: 12 h-n r = -0,64 (nők) és -0,49
      (férfiak), 24 h-n r = -0,47 (p < 0,001).
    quote: >-
      "The faster running speed in the 12 h (women, r = -0.64; men, r = -0.49, p < 0.001)...was related to less
      variable pacing." ... "the finishers in the 24 h showed the most variable pacing."
    notes: >-
      Futás, nagy minta, több verseny – a "hosszabb táv = nagyobb tempó-ingadozás" trend a kerékpáros 6–24 órás
      versenyekre analógiaként vihető át (ott a megállások, éjszaka, hőmérséklet is növeli a CV-t). A folyóirat
      (Sustainability) nem sporttudományi profilú – a szerzőcsoport (Knechtle/Nikolaidis) viszont az ultra-pacing
      irodalom fő forrása. Nyílt hozzáférés.
    status: ellenorizve-doi

