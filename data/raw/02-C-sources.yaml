  - key: vesterinen-2016-hrv-rct
    type: journal
    authors: [Vesterinen V., Nummela A., Heikura I.A., Laine T., Hynynen E., Botella J., Häkkinen K.]
    year: 2016
    title: "Individual Endurance Training Prescription with Heart Rate Variability"
    journal: "Medicine & Science in Sports & Exercise 48(7):1347-1354"
    doi: 10.1249/MSS.0000000000000910
    url: https://api.openalex.org/works/doi:10.1249/MSS.0000000000000910
    grade: A
    questions: [02:Q8]
    summary: >-
      40 amatőr futó, 8 hét, randomizált: a HRV-csoport csak akkor futott kemény edzést, ha a reggeli HRV a normál
      sávban volt. A HRV-csoport szignifikánsan KEVESEBB intenzív edzést végzett (13,2±6,0 vs. 17,7±2,5), mégis többet
      javult 3000 m-en (+2,1±2,0%, p=0,004 vs. +1,1±2,7%, p=0,118). VO2max mindkét csoportban nőtt (3,7±4,6% vs. 5,0±5,2%).
