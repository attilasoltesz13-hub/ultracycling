    url: https://api.openalex.org/works/doi:10.1136/bjsports-2016-096572
    grade: A
    questions: [02:Q9]
    summary: >-
      IOC-konszenzus a terhelés és a betegségkockázat kapcsolatáról: a helytelen terhelésmenedzsment (hirtelen
      terhelésugrás, zsúfolt versenynaptár, pszichés stressz, utazás) az akut megbetegedés és a túledzés szignifikáns
      kockázati tényezője. Ajánlás: egyénre szabott, fokozatos terhelésprogresszió, wellness-monitorozás (alvás, hangulat,
