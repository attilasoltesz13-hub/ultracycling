sources:
  # ---------------------------------------------------------------- Q7: terhelésmutatók
  - key: foster-2001-session-rpe
    type: journal
    authors: [Foster C., Florhaug J.A., Franklin J., Gottschall L., Hrovatin L.A., Parker S., Doleshal P., Dodge C.]
    year: 2001
    title: "A New Approach to Monitoring Exercise Training"
    journal: "Journal of Strength and Conditioning Research 15(1):109-115"
    doi: 10.1519/00124278-200102000-00019
    url: https://api.openalex.org/works/doi:10.1519/00124278-200102000-00019
    grade: A
    questions: [02:Q7]
    summary: >-
      A session-RPE módszer alapcikke: az edzés terhelése = időtartam (perc) × CR-10 skálás érzett erőkifejtés,
      a teljes edzésre, 30 perccel a vége után kérdezve. Egyenletes és intervallum-kerékpáredzésen, valamint
      kosárlabdaedzésen a session-RPE-alapú pontszám szorosan együtt mozgott a pulzuszóna-alapú (Edwards-TRIMP jellegű)
      terheléssel, és a regressziós kapcsolat a különböző mozgásformák között "közel átfedő" volt – tehát a módszer
      mozgásformától és teljesítménymérőtől független, univerzális terhelésmutató.
    quote: >-
      "the relationship between the mean session RPE and the summated heart rate zone score was highly consistent"
      ... the method offers "a valid, intensity-independent approach for monitoring diverse training modes." [absztraktból]
    notes: >-
      Klasszikus validációs vizsgálat (kerékpár + kosárlabda, egyetemista/edzett vegyes minta). A validitás referenciája
      maga is pulzus-alapú, nem teljesítmény. Ultrára: teljesítménymérő nélkül is működik, de nagyon hosszú (6-15+ órás)
      edzésen az egyetlen globális RPE a végállapotot súlyozza (recency-torzítás) – ezt későbbi módszertani irodalom jelzi.
      Számok az OpenAlex-absztraktból.
    status: ellenorizve-doi

  - key: sanders-2017-load-cyclists
    type: journal
    authors: [Sanders D., Abt G., Hesselink M.K.C., Myers T., Akubat I.]
    year: 2017
    title: "Methods of Monitoring Training Load and Their Relationships to Changes in Fitness and Performance in Competitive Road Cyclists"
    journal: "International Journal of Sports Physiology and Performance 12(5):668-675"
    doi: 10.1123/ijspp.2016-0454
    url: https://api.openalex.org/works/doi:10.1123/ijspp.2016-0454
    grade: B
    questions: [02:Q7]
    summary: >-
      15 jól edzett országúti kerékpáros 10 hetes felkészülési időszaka: a heti terhelést TSS-sel, session-RPE-vel és
      négyféle TRIMP-pel (Banister, Edwards, individualizált iTRIMP, Lucia luTRIMP) számolták, és a fittség-változáshoz
      (laborteszt + 8 perces időfutam) viszonyították. A terhelésmutatók és a szubmaximális fittségváltozás korrelációja
      r=0,54-0,81; a 8 perces időfutam-teljesítmény változásával a legerősebb kapcsolatot az iTRIMP (r=0,81), a TSS (r=0,75)
      és a luTRIMP (r=0,70) adta. A TSS és a jobb TRIMP-változatok tehát kerékpárosoknál hasonlóan jól követik az adaptációt.
    quote: >-
      "Large to very large correlations were observed between training-load methods and submaximal fitness changes
      (r = .54–.81)" ... strongest with "iTRIMP (r = .81), TSS (r = .75) and luTRIMP (r = .70)". [absztraktból]
    notes: >-
      n=15 férfi versenykerékpáros, terep + labor, 10 hét. Kis minta, korrelációs (nem oksági) design; a "sima" Banister-
      és Edwards-TRIMP gyengébben teljesített, mint az egyénre kalibrált változatok. Amatőr ultrásra a fő üzenet: a mutató
      egyéni kalibrálása (FTP frissítés, egyéni laktát-HR görbe) többet számít, mint a mutató választása.
    status: ellenorizve-doi

  - key: gabbett-2016-paradox
    type: journal
    authors: [Gabbett T.J.]
    year: 2016
    title: "The training-injury prevention paradox: should athletes be training smarter and harder?"
    journal: "British Journal of Sports Medicine 50(5):273-280"
    doi: 10.1136/bjsports-2015-095788
    url: https://api.openalex.org/works/doi:10.1136/bjsports-2015-095788
    grade: C
    questions: [02:Q7]
    summary: >-
      Az ACWR (akut:krónikus terhelésarány) koncepció alapcikke: a magas krónikus terhelés önmagában véd (a jobban edzett
      sportoló kevesebbet sérül), a sérüléskockázatot a terhelés hirtelen megugrása (magas akut:krónikus arány) hajtja.
      A javasolt "édes zóna" kb. 0,8-1,3 közötti arány, 1,5 felett a kockázat emelkedik (a csapatsport-adatokból származó
      ábra alapján). Az elv: okosabban ÉS keményebben edzeni, fokozatos progresszióval.
    quote: >-
      "athletes accustomed to high training loads have fewer injuries than athletes training at lower workloads" ...
      "the acute:chronic workload ratio ... is a critical predictor of injury risk". [absztraktból]
    notes: >-
      Narratív áttekintés, elsősorban csapatsport (rögbi, futball) sérülésadataira épül – kerékpáros/ultra validáció nincs.
      A konkrét 0,8-1,3 sáv a szerző korábbi csapatsport-elemzéseiből származik. A módszertani kritikát lásd
      impellizzeri-2020-acwr. Állóképességi sportban az ACWR inkább betegség/túlterhelés-, mint sérülés-proxi.
    status: ellenorizve-doi

  - key: impellizzeri-2020-acwr
    type: journal
    authors: [Impellizzeri F.M., Tenan M.S., Kempton T., Novak A.R., Coutts A.J.]
    year: 2020
    title: "Acute:Chronic Workload Ratio: Conceptual Issues and Fundamental Pitfalls"
    journal: "International Journal of Sports Physiology and Performance 15(6):907-913"
    doi: 10.1123/ijspp.2019-0864
    url: https://api.openalex.org/works/doi:10.1123/ijspp.2019-0864
    grade: C
    questions: [02:Q7]
    summary: >-
      Az ACWR módszertani kritikája: a mutató és a sérülés közti kapcsolat nem oksági ("no studies have even tried to
      estimate causal effects properly"), az arányképzés statisztikai műtermékeket kelt és zajt ad hozzá, a kapcsolat
      iránya vizsgálatonként inkonzisztens, és a "0,8-1,3 édes zóna" ábrája módszertanilag hibás. Következtetés: az
      ACWR-re épített terhelésmenedzsment-rendszerek bizonyítéka elégtelen, a mutató önmagában nem döntési alap.
    quote: >-
      "no studies have even tried to estimate causal effects properly" ... the ratio "adds noise and creates statistical
      artifacts". [absztraktból]
    notes: >-
      Vezető terhelés-módszertani kutatók (Impellizzeri, Coutts) kritikai álláspontja; az IOC 2016-os terhelés-konszenzusa
      még ajánlotta az ACWR-t, ez a vita máig nyitott. Ultrás gyakorlatban: a "ne ugorj hetek alatt a duplájára" elv marad,
      a konkrét számküszöb nem védhető.
    status: ellenorizve-doi

  - key: friel-ramp-rate
    type: web-article
    authors: [Friel J.]
    credential: "Edző, a 'Training Bible' sorozat szerzője, a TrainingPeaks társalapítója"
    year: 2013
    title: "The CTL Ramp Rate"
    venue: joefrieltraining.com
    doi: null
    url: https://joefrieltraining.com/the-ctl-ramp-rate/
    grade: C
    questions: [02:Q7]
    summary: >-
      Edzői ökölszabály a CTL-emelkedés (ramp rate) biztonságos ütemére: a legtöbb sportolónak heti 5-8 CTL-pont emelkedés
      "körülbelül megfelelő"; egyes kivételes sportolók rövid ideig (legfeljebb kb. 1 hét) heti 10+ pontot is elbírnak
      ("crash" blokk), de ezen túl a kimenetel várhatóan romlik (túlterhelés, betegség, kiégés kockázata).
    quote: >-
      "an increase in CTL of about 5 to 8 points per week is about right for most" ... "Go much beyond a week at 10 or
      more weekly CTL ramp rate and the outcomes aren't likely to be as beneficial."
    notes: >-
      Edzői heurisztika, nem validált vizsgálat; a számok TSS/nap dimenziójú CTL-pontban értendők. Heti 6-15 órás amatőr
      ultrásnál a CTL jellemzően 50-90 közt mozog, így a heti 5-8 pont valóban érzékelhető progresszió. KALKULÁTOR-paraméter.
    status: url-megnyitva

  - key: trainingpeaks-tss-explainer
    type: web-article
    authors: [TrainingPeaks (McGregor S. szerk.)]
    credential: "A TSS/CTL/ATL/TSB (PMC) modellt forgalmazó platform hivatalos ismertetője"
    year: 2023
    title: "What is TSS (Training Stress Score)?"
    venue: trainingpeaks.com
    doi: null
    url: https://www.trainingpeaks.com/blog/what-is-tss/
    grade: C
    questions: [02:Q7]
    summary: >-
      A TSS hivatalos definíciós plafonja: 1 óra teljes, 100%-os (FTP-n tekert) munka = 100 TSS, és óránként soha nem
      szerezhető 100 pontnál több; egy edzésen belül viszont igen, ha 1 óránál hosszabb. Példa: 2 óra "5-ös szinten"
      (kb. 50 TSS/óra) = 100 pont. Ez rögzíti a TSS/óra skálát, amire a zónánkénti tipikus értékek épülnek.
    quote: >-
      "You earn 100 TSS for an all out, 100%, 60-minute workout." ... "you can earn more than 100 TSS within a single
      workout (as long as it is longer than an hour), but never more than 100 TSS per hour."
    notes: >-
      Gyártói közlés (a Coggan-féle definíció népszerűsítő formája). A TSS-képlet: TSS = (t_s × NP × IF)/(FTP × 3600) × 100,
      ahol IF = NP/FTP. Ultra-vonatkozás: a nagyon hosszú Z1-Z2 edzés IF~0,55-0,65 mellett is 30-45 TSS/órát ad, a modell
      viszont az élettani költség nem-lineáris részét (glikogén, alváshiány, ülésfájdalom) nem látja.
    status: url-megnyitva

  # ---------------------------------------------------------------- Q8: HRV és készenlét
  - key: javaloyes-2019-hrv-cycling
    type: journal
    authors: [Javaloyes A., Sarabia J.M., Lamberts R.P., Moya-Ramon M.]
    year: 2019
    title: "Training Prescription Guided by Heart-Rate Variability in Cycling"
    journal: "International Journal of Sports Physiology and Performance 14(1):23-32"
    doi: 10.1123/ijspp.2018-0122
    url: https://api.crossref.org/works/10.1123/ijspp.2018-0122
    grade: A
    questions: [02:Q8]
    summary: >-
      17 jól edzett kerékpáros, 8 hét, randomizált: HRV-vezérelt (napi reggeli rMSSD 7 napos gördülő átlaga alapján
      módosított) vs. hagyományos, előre írt periodizáció. A HRV-csoport javult: csúcsteljesítmény +5,1%, teljesítmény
      a laktátküszöbön +13,9%, 40 perces időfutam +7,3%; a hagyományos csoport nem javult szignifikánsan. Ez az első
      kifejezetten kerékpáros HRV-vezérelt RCT.
    quote: >-
      "the HRV-guided group showed meaningful improvements in peak power output (5.1%), lactate threshold power (13.9%),
      and 40-min time trial performance (7.3%)" ... "daily training prescription based on HRV could result in a better
      performance enhancement than a traditional periodization in well-trained cyclists." [absztraktból]
    notes: >-
      n=17 férfi, jól edzett, 8 hét – kis minta, rövid időtáv, a csoportkülönbség részben a kontrollcsoport stagnálásából
      adódik. A protokoll lényege: ha a 7 napos rMSSD-átlag kilóg a normál sávból (SWC), az aznapi intenzív edzés
      alacsony intenzitásúra cserélődik. Ultra-felkészülés hosszú Z2 blokkjaira közvetlenül nem tesztelt.
    status: ellenorizve-doi

  - key: medellin-2020-hrv-meta
    type: journal
    authors: [Medellín Ruiz J.P., Rubio-Arias J.Á., Clemente-Suárez V.J., Ramos-Campo D.J.]
    year: 2020
    title: "Effectiveness of Training Prescription Guided by Heart Rate Variability Versus Predefined Training for Physiological and Aerobic Performance Improvements: A Systematic Review and Meta-Analysis"
    journal: "Applied Sciences 10(23):8532"
    doi: 10.3390/app10238532
    url: https://www.mdpi.com/2076-3417/10/23/8532
    grade: A
    questions: [02:Q8]
    summary: >-
      8 RCT, n=190 (férfi+nő): HRV-vezérelt vs. előre írt edzés. Egyik kimenetben sincs szignifikáns csoportkülönbség:
      VO2max MD=0,96 ml/kg/perc (95% CI -1,11-3,03; p=0,36), maximális aerob teljesítmény SMD=0,06 (-0,26-0,38),
      aerob teljesítmény SMD=0,14 (-0,22-0,51), teljesítmény VT1-en SMD=0,27 (-0,16-0,70), VT2-n SMD=0,18 (-0,20-0,57).
      A HRV-vezérlés tehát nem rosszabb, de csoportszinten nem is jobb az előre írt tervnél.
    quote: >-
      "Although HRV-based training periodization improved both physiological variables and aerobic performance, this
      method did not provide significant benefit over PT." (VO2max "MD = 0.96; 95% CI: −1.11, 3.03; p = 0.36")
    notes: >-
      Vegyes populáció (futó, kerékpáros, ülő), rövid (4-15 hetes) beavatkozások, kis vizsgálatok. Több egyedi RCT-ben
      (Kiviniemi 2007, Vesterinen 2016, Javaloyes 2019) a HRV-csoport a KEVESEBB intenzív edzésnappal érte el ugyanazt
      vagy jobbat – az érvelhető haszon a felesleges intenzitás kiszűrése, nem a többletteljesítmény.
    status: ellenorizve-doi

  - key: stone-2021-wearable-validity
    type: journal
    authors: [Stone J.D., Ulman H.K., Tran K., Thompson A.G., Halter M.D., Ramadan J.H., Stephenson M., Finomore V.S., Galster S.M., Rezai A.R., Hagen J.A.]
    year: 2021
    title: "Assessing the Accuracy of Popular Commercial Technologies That Measure Resting Heart Rate and Heart Rate Variability"
    journal: "Frontiers in Sports and Active Living 3:585870"
    doi: 10.3389/fspor.2021.585870
