  - key: campbell-2018-immune-debunk
    type: journal
    authors: [Campbell J.P., Turner J.E.]
    year: 2018
    title: "Debunking the Myth of Exercise-Induced Immune Suppression: Redefining the Impact of Exercise on Immunological Health Across the Lifespan"
    journal: "Frontiers in Immunology 9:648"
    doi: 10.3389/fimmu.2018.00648
    url: https://api.openalex.org/works/doi:10.3389/fimmu.2018.00648
    grade: C
    questions: [02:Q9]
    summary: >-
      A J-görbe/"nyitott ablak" hipotézis kritikai újraértelmezése: az edzés utáni limfocitaszám-esés nem immunszuppresszió,
      hanem az immunsejtek átmeneti, időfüggő kivándorlása a perifériás szövetekbe (fokozott immunfelügyelet); a nyál-IgA
      változásai nem jelölnek ki immunszupprimált időszakot; megbízható bizonyíték a megnövekedett opportunista
      fertőzéskockázatra korlátozott. A rendszeres edzés összességében javítja az immunkompetenciát.
    quote: >-
      "limited reliable evidence exists to support the claim that exercise heightens risk of opportunistic infections"
      ... changes in salivary IgA "do not signpost a period of immune suppression". [absztraktból]
    notes: >-
      Narratív, provokatív álláspont; a vita nem zárult le (Simpson 2020-as ellencikk védte a nyitott ablakot). A
      gyakorlati közös nevező: a fertőzésklaszterek nagy versenyek/nagy terhelésblokkok körül valósak, de az ok
      multifaktoriális (kitettség, utazás, alvás, energiahiány), nem az edzés önmagában.
    status: ellenorizve-doi

  - key: walsh-2018-immune-recs
    type: journal
    authors: [Walsh N.P.]
    year: 2018
    title: "Recommendations to maintain immune health in athletes"
    journal: "European Journal of Sport Science 18(6):820-831"
    doi: 10.1080/17461391.2018.1449895
    url: https://api.crossref.org/works/10.1080/17461391.2018.1449895
    grade: C
    questions: [02:Q9]
    summary: >-
      Áttekintés + 10 pontos gyakorlati ajánlás: elhúzódó nehéz terhelés (≥90 perc) után az immunfunkciók órákra 15-70%-kal
      csökkennek; hosszú repülőút 2-5-szörös URTI-tünet kockázattal jár; a <6 óra alvás ~4-5-szörösére emeli a megfázás
      esélyét vírus-expozíció után. Betegség-szabály: "lázzal, nyak alatti tünetekkel ne edz és ne versenyezz"; kockázati
      tényező még az alacsony energia-elérhetőség, a pszichés stressz és a depresszió.
    quote: >-
      "Do not train or compete with 'below-the-neck' symptoms" ... athletes sleeping "less than 6 hours" had "4-5 times
      greater chance" of developing a common cold after viral exposure. [teljes szövegből, LJMU repozitórium-kézirat]
    notes: >-
      Egy szerzős szakértői áttekintés; az alvás-megfázás szám a Prather 2015 (Sleep) kísérletből idézett másodlagos adat.
      A "nyak-szabály" (nyak feletti tünet: könnyű edzés mehet; nyak alatti tünet/láz: tilos) itt lektorált formában
      jelenik meg – ultrán a lázas állapotban versenyzés miokarditisz-kockázata miatt abszolút stopszabály.
    status: ellenorizve-doi

  - key: neville-2008-siga
    type: journal
    authors: [Neville V., Gleeson M., Folland J.P.]
    year: 2008
    title: "Salivary IgA as a Risk Factor for Upper Respiratory Infections in Elite Professional Athletes"
    journal: "Medicine & Science in Sports & Exercise 40(7):1228-1236"
    doi: 10.1249/mss.0b013e31816be9c3
    url: https://api.openalex.org/works/doi:10.1249/mss.0b013e31816be9c3
    grade: B
    questions: [02:Q9]
    summary: >-
      38 elit America's Cup vitorlázó, 50 hét, heti nyál-IgA mérés. Az abszolút s-IgA szint NEM korrelált az URTI-vel
      (r=0,11), a mutató egyéni variabilitása óriási (CV 48% egyénen belül, 71% egyének közt); viszont az URTI-t megelőző
