    summary: >-
      Szisztematikus szemléletű narratív áttekintés: az OTS és a RED-S tünetei és élettani útvonalai nagymértékben
      átfednek (teljesítményesés, hormonális szuppresszió, hangulatzavar, immunproblémák), és a publikált "túledzés"-esetek
