  # ---------------------------------------------------------------- Q9: túledzés és betegség
  - key: meeusen-2013-ots-consensus
    type: consensus
    authors: [Meeusen R., Duclos M., Foster C., Fry A., Gleeson M., Nieman D., Raglin J., Rietjens G., Steinacker J., Urhausen A.]
    year: 2013
    title: "Prevention, diagnosis and treatment of the overtraining syndrome: Joint consensus statement of the European College of Sport Science (ECSS) and the American College of Sports Medicine (ACSM)"
    journal: "European Journal of Sport Science 13(1):1-24"
    doi: 10.1080/17461391.2012.730061
    url: https://api.crossref.org/works/10.1080/17461391.2012.730061
    grade: A
    questions: [02:Q9]
    summary: >-
      ECSS-ACSM konszenzus: a kontinuum funkcionális overreaching (FOR: átmeneti teljesítményesés, pihenés után
      szuperkompenzáció, napok-hetek), nem-funkcionális overreaching (NFOR: elhúzódó, hetek-hónapok, haszon nélkül) és
      túledzés-szindróma (OTS: hónapok, több rendszert érintő "prolonged maladaptation", pszichés tünetekkel). A diagnózis
      kizárásos (szervi betegség, hiányállapot, fertőzés kizárása); egyetlen megbízható, általánosan elfogadott
      biomarker sincs, a legjobb jel maga a teljesítménycsökkenés + hangulatzavar.
    quote: >-
      OTS is characterized by "prolonged maladaptation" of multiple biological systems ... multiple markers exist
      (hormonal, psychological, biochemical, immune) "but none universally meet acceptance criteria". [absztraktból]
    notes: >-
      Konszenzus, nem új adat. Prevalencia-becslések a szakirodalomban: elit állóképességi sportolók ~10%-a (karrier
      szinten 30-60% is előfordul egyes felméréseknél) – a konszenzus maga óvatos a számokkal. Heti 6-15 órás amatőrnél
      az OTS ritka; a reális kockázat a NFOR (munka+család+edzés össz-stressz), aminél a "kizárásos" logika ugyanúgy áll.
    status: ellenorizve-doi

  - key: tenhaaf-2017-for-prediction
    type: journal
    authors: [ten Haaf T., van Staveren S., Oudenhoven E., Piacentini M.F., Meeusen R., Roelands B., Koenderman L., Daanen H.A.M., Foster C., de Koning J.J.]
    year: 2017
    title: "Prediction of Functional Overreaching From Subjective Fatigue and Readiness to Train After Only 3 Days of Cycling"
    journal: "International Journal of Sports Physiology and Performance 12(s2):S2-87-S2-94"
    doi: 10.1123/ijspp.2016-0404
    url: https://api.openalex.org/works/doi:10.1123/ijspp.2016-0404
    grade: B
    questions: [02:Q9]
    summary: >-
      Nem elit kerékpárosok 8 napos, 1300 km-es, 18 500 m szintemelkedésű túrája (n=15): akik utána teljesítményt
      vesztettek, funkcionálisan túlterheltnek (FOR) minősültek. Egyetlen napi mutató (nyugalmi pulzus, hőmérséklet,
      hangulat) sem különböztette meg egyénileg a FOR-t az akut fáradtságtól; a kérdőíves fáradtság + edzéskészség
      (readiness to train) kombinációja viszont már a 3. napon 78%-os pontossággal (szenzitivitás 79%, specificitás 77%)
      előre jelezte a FOR-t.
    quote: >-
      "a combination of questionnaire-based changes in readiness to train" predicted "78% of subjects or FOR
      (sensitivity = 79%, specificity = 77%)". [absztraktból]
    notes: >-
      Kerékpáros, többnapos, amatőr-releváns terepvizsgálat (a hivatkozott esemény a Klimmen naar Parijs jellegű túra).
      Kis n; a "FOR" határa itt a teszt-teljesítmény esése. Üzenet ultrásnak: az egyszerű napi kérdőív (fáradtság,
      készenlét) korábban és jobban jelez, mint a pulzus-alapú objektív mutatók.
    status: ellenorizve-doi

  - key: hausswirth-2014-sleep-illness
    type: journal
    authors: [Hausswirth C., Louis J., Aubry A., Bonnet G., Duffield R., Le Meur Y.]
    year: 2014
    title: "Evidence of Disturbed Sleep and Increased Illness in Overreached Endurance Athletes"
    journal: "Medicine & Science in Sports & Exercise 46(5):1036-1045"
    doi: 10.1249/MSS.0000000000000177
    url: https://api.openalex.org/works/doi:10.1249/MSS.0000000000000177
    grade: A
    questions: [02:Q9]
    summary: >-
      27 edzett férfi triatlonista, 6 hét aktigráfiás alvásmonitorozás, randomizált túlterheléses (n=18) vs. kontroll
      (n=9) csoport. A túlterheltek fele (9/18) funkcionálisan túledzetté (F-OR) vált: alvásidő -7,9±6,7%,
      alváshatékonyság -1,6±0,7%; a felső légúti megbetegedés az F-OR csoport 67%-át érintette, a kontroll 11%-át.
      Taper alatt az alvás helyreállt. A romló alvás tehát a túlterhelés korai, mérhető kísérőjele, és a fertőzéskockázat
      megugrásával jár együtt.
    quote: >-
      F-OR athletes showed a "decrease in duration (−7.9% ± 6.7%), efficiency (−1.6% ± 0.7%), and immobile time
      (−7.6% ± 6.6%)"; illness incidence "F-OR group reported 67%, control athletes 11%". [absztraktból]
    notes: >-
      n=27, csak férfi, triatlon, laborhoz kötött edzésblokk. Az ok-okozat kétirányú lehet (rossz alvás → túlterhelés is).
      Ultrás gyakorlat: nagy volumenblokk + romló alvás + munkahelyi stressz együttese a legerősebb betegség-előjel;
      az alvásminőség-trend a legolcsóbb monitor.
    status: ellenorizve-doi

  - key: clarke-2013-banister-model
    type: journal
    authors: [Clarke D.C., Skiba P.F.]
    year: 2013
    title: "Rationale and resources for teaching the mathematical modeling of athletic training and performance"
    journal: "Advances in Physiology Education 37(2):134-152"
    doi: 10.1152/advan.00078.2011
    url: https://api.crossref.org/works/10.1152/advan.00078.2011
    grade: C
    questions: [02:Q7]
    summary: >-
      Lektorált módszertani áttekintés a Banister-féle impulzus-válasz modellről, amelynek kereskedelmi leegyszerűsítése
      a TrainingPeaks PMC (CTL/ATL/TSB): a teljesítménykapacitás a terhelés-impulzusokból számolt "fittség" (lassú,
      alap-időállandó ~42 nap) és "fáradtság" (gyors, ~7 nap) exponenciálisan lecsengő különbsége. A modell jól illeszthető
      egyéni teljesítményadatokra, de az élettant absztrahálja; az időállandók egyénenként nagyon eltérnek, és a jövőbeli
      előrejelző ereje kalibrálás nélkül gyenge.
    quote: >-
      the Banister impulse-response model describes how "an individual's performance capacity changes over time as a
      function of training" ... such models can "accurately fit performance data" while abstracting underlying physiology.
      [absztraktból]
    notes: >-
      Oktatási célú áttekintés, nem validációs vizsgálat. A PMC-modell rejtett feltevései ultrásnak: (1) minden TSS-pont
      egyenértékű (1 óra FTP = 3 óra Z1?), (2) a fáradtság 1 dimenziós, (3) a konstansok (42/7 nap) populációs átlagok.
