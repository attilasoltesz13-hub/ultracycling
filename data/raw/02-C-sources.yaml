    notes: >-
      n=40 amatőr futó (vegyes nem), 8 hét. Futás, nem kerékpár; kerékpáros megfelelője javaloyes-2019-hrv-cycling.
      Munka melletti amatőrnek a "kevesebb, jól időzített intenzitás" kifejezetten releváns tanulság.
