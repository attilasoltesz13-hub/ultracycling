    authors: [Morton J.P., Fell J.M., Gonzalez J.T., Hearris M.A., Podlogar T., Pugh J.N., Wallis G.A.]
    year: 2026
    title: "From Metabolism to Medals: Contemporary Perspectives and Revisiting Carbohydrate Guidelines for Fueling Endurance Athletes during Exercise"
    journal: "The Journal of Nutrition (in press, 101442)"
    doi: 10.1016/j.tjnut.2026.101442
    url: https://www.sciencedirect.com/science/article/pii/S002231662600091X
