    summary: >-
      2026-os áttekintés az irányelvek revíziójáról (a 120 g/h-kutatások vezető szerzőitől). Az ACSM 2016 szerint ≤90 g/h
      többszörös transzportálható CHO >2,5–3 órás eseményre; a terepen megfigyelt 120–200 g/h "hatékonyságát a jelenlegi
      tudomány nem támasztja alá", de a felső határ edzett sportolóknál 90-ről 120 g/h-ra emelhető, mert az exogén és a
      teljes CHO-oxidáció is nő. Csúcs exogén oxidáció 1,60–1,75 g/perc (96–105 g/h) 2,0–2,4 g/perc bevitelnél. A >6 órás
