      zsírtömeg −1,5 kg, izomglikogén −60%. 800 km-es, 152,5 órás kalandverseny (6 férfi): 80 000 ± 18 000 kcal
      (500 ± 100 kcal/h), testtömeg változatlan. Az oxigénpulzus 12 óra után 10% ill. 5%-kal nőtt – a pulzusalapú
      becslés korrekció nélkül alábecsül.
    quote: >-
      "Mean energy expenditure was 18,050 ± 2,390 kcal (750 ± 100 kcal h⁻¹) and 80,000 ± 18,000 kcal (500 ± 100 kcal h⁻¹),
