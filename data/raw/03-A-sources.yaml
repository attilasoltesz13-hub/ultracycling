      maltodextrin:fruktóz). A 2. órában az exogén oxidáció 0,89 / 1,31 / 1,68 g/perc (60/90/120 g/h), teljes CHO-oxidáció
      2,09 / 2,46 / 3,07 g/perc; a 120 g/h 8,1 ml O2/kg/km-rel javította a futóökonómiát a 60 g/h-hoz képest (p=0,039).
