  # ---------------------------------------------------------------- Q1: exogén oxidáció, felszívódási plafon, 120 g/h
  - key: jeukendrup-2006-ultra-exo
    type: journal
    authors: [Jeukendrup A.E., Moseley L., Mainwaring G.I., Samuels S., Perry S., Mann C.H.]
    year: 2006
    title: "Exogenous carbohydrate oxidation during ultraendurance exercise"
    journal: "Journal of Applied Physiology 100(4):1134-1141"
    doi: 10.1152/japplphysiol.00981.2004
    url: https://api.crossref.org/works/10.1152/japplphysiol.00981.2004
    grade: A
    questions: [Q1]
    summary: >-
      Kontrollált labor: 8 edzett kerékpáros 5 órán át tekert 58% VO2max-on, 1,5 g/perc (90 g/h) szénhidrátot fogyasztva
      csak glükózként, illetve glükóz+fruktóz 2:1 arányban, vagy vizet. A csak-glükóz exogén oxidációja 120 perc után
      platót ért el, csúcs 1,24 ± 0,04 g/perc (~74 g/h); a glükóz+fruktóz csúcsa 1,40 ± 0,08 g/perc (~84 g/h), gyorsabb
      felfutással és kisebb teltségérzettel. Ez a leghosszabb (5 órás) itt talált izotópos mérés, ami a "60 g/h egyetlen transzporter" plafon
      és a "többszörös transzportálható CHO" előny közvetlen, ultra-releváns bizonyítéka.
    quote: >-
      "CHO oxidation rates following the ingestion of Glu leveled off after 120 min and peaked at 1.24 ± 0.04 g/min"
      … glucose plus fructose gave "a significantly higher peak rate of CHO oxidation (1.40 ± 0.08 g/min)".
    notes: >-
      n=8 férfi, labor, kerékpár-ergométer, 5 h, alacsony intenzitás (58% VO2max) – ultrás tempóhoz közel. Számok Crossref-
      absztraktból. Csak 90 g/h bevitelt teszteltek, 120 g/h-t nem. A glükóz-plafon (~1,2 g/perc) itt magasabb a "60 g/h"
      tankönyvi számnál, mert 90 g/h-t etettek; a hatásfok ~80%. Több napra nem vihető át közvetlenül.
    status: ellenorizve-doi

  - key: podlogar-2022-120vs90
    type: journal
    authors: [Podlogar T., Bokal Š., Cirnski S., Wallis G.A.]
    year: 2022
    title: "Increased exogenous but unaltered endogenous carbohydrate oxidation with combined fructose-maltodextrin ingested at 120 g h−1 versus 90 g h−1 at different ratios"
    journal: "European Journal of Applied Physiology 122:2393-2401"
    doi: 10.1007/s00421-022-05019-w
    url: https://link.springer.com/article/10.1007/s00421-022-05019-w
    grade: A
    questions: [Q1]
    summary: >-
      11 jól edzett férfi kerékpáros (VO2peak 62,6 ml/kg/perc), 3 óra tekerés 95% GET-en éhgyomorra, 13C-jelölés. 120 g/h
      (fruktóz:maltodextrin 0,8:1) mellett az exogén CHO-oxidáció a 120–180. percben 1,51 ± 0,22 g/perc, 90 g/h-nál (1:2)
      1,29 ± 0,16 g/perc (p=0,026). Az endogén CHO-oxidáció NEM változott (2,15 vs 2,20 g/perc, p=0,786) – a plusz 30 g/h
      nem "kímélte" a glikogént, csak a teljes CHO-oxidációt emelte. GI-panaszban nem volt különbség.
    quote: >-
      "120–180 min: 1.51 ± 0.22 g min−1" vs "1.29 ± 0.16 g min−1; p = 0.026" … endogenous "2.15 ± 0.30 and 2.20 ± 0.33 g min−1
      for 120 and 90 g h−1 conditions, respectively; p = 0.786".
    notes: >-
      n=11, labor, 3 h, éhgyomri állapot (ez növeli az exogén hasznosítást). Hatásfok 120 g/h-nál ~75%. Fő tanulság: a
      120 g/h nem glikogén-kímélő, hanem "több üzemanyag összesen"; ultrán a hasznosság az abszolút oxidációs igénytől függ.
      Teljesítménymérés nem volt.
    status: ellenorizve-doi

