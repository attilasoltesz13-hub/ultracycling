    notes: >-
      Narratív, de konszenzus-jellegű szakértői áttekintés lektorált folyóiratban; a 120 g/h iskola saját összegzése,
      ezért a >120 g/h-ra vonatkozó óvatossága különösen súlyos. Nem ad ultra-specifikus (6+ óra, több nap) adatot –
      ez maga a hiány. A "30–66 g/h 12–24 órás versenyeken" másodlagos (a szerzők idézik).
