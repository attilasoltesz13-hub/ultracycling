  # ---------------------------------------------------------------- Q1: terepi bevitel, GI, bevitel–teljesítmény
  - key: viribay-2020-120-mountain
    type: journal
    authors: [Viribay A., Arribalzaga S., Mielgo-Ayuso J., Castañeda-Babarro A., Seco-Calvo J., Urdampilleta A.]
    year: 2020
    title: "Effects of 120 g/h of Carbohydrates Intake during a Mountain Marathon on Exercise-Induced Muscle Damage in Elite Runners"
    journal: "Nutrients 12(5):1367"
    doi: 10.3390/nu12051367
    url: https://www.mdpi.com/2072-6643/12/5/1367
    grade: A
    questions: [Q1]
    summary: >-
      Terepi randomizált vizsgálat: 20 elit férfi hegyi maratonista (42,2 km, ~4000 m szint), 60 / 90 / 120 g/h csoport
      (n=6/7/7), előzetes bél-edzéssel. A 120 g/h csoportban a belső terhelés (sRPE-alapú) 3805 ± 281 AU vs 4688 / 4692 AU
      (p=0,019), és 24 órával a verseny után a CK-emelkedés 156% vs 976% (60 g/h), az LDH 8,5% vs 46,7%, a GOT 27% vs 162%.
      A 26 indulóból 3 GI-problémával lépett vissza; a 20 befejező GI-panasz nélkül teljesített. Versenyidő nem különbözött
      (p=0,871).
    quote: >-
      "internal exercise load during the mountain marathon was significantly lower (p = 0.019; η2p = 0.471) in EXP (3805 ± 281 AU)
      compared to LOW (4688 ± 705 AU) and CON (4692 ± 716 AU)".
    notes: >-
      Kis csoportok (n=6–7), futás, ~4–5 h; nem ultra-kerékpár. Teljesítményre nem volt hatás, csak izomkárosodás-markerekre
      és belső terhelésre – a többnapos versenyek "másnapja" szempontjából releváns. A résztvevők 4 hetes gut-trainingen estek
      át; a 120 g/h tolerálása erre épül.
    status: ellenorizve-doi

  - key: arribalzaga-2021-ultratrail-sr
    type: journal
    authors: [Arribalzaga S., Viribay A., Calleja-González J., Fernández-Lázaro D., Castañeda-Babarro A., Mielgo-Ayuso J.]
    year: 2021
    title: "Relationship of Carbohydrate Intake during a Single-Stage One-Day Ultra-Trail Race with Fatigue Outcomes and Gastrointestinal Problems: A Systematic Review"
    journal: "International Journal of Environmental Research and Public Health 18(11):5737"
    doi: 10.3390/ijerph18115737
    url: https://www.mdpi.com/1660-4601/18/11/5737
    grade: A
    questions: [Q1]
    summary: >-
      Szisztematikus áttekintés 8 egynapos ultratrail-vizsgálatról: a mért CHO-bevitel 22–126 g/h között szórt, a futók
      többsége nem érte el a 90 g/h ajánlást. Két vizsgálat a 120 g/h-t alacsonyabb belső terheléssel és kisebb
      izomkárosodással kötötte össze; hat vizsgálatban a GI-tünetek gyakorisága 65–82% volt, és inkább magasságtól,
      környezettől és sebességtől függött, mint önmagában a bevitel szintjétől.
    quote: >-
      "In six studies, athletes had GI symptoms between 65–82%. In summary, most of the runners did not meet CHO intake standard
      recommendations for SOUT events (90 g/h)".
    notes: >-
      Futás, egynapos; a szerzőcsoport azonos a 120 g/h terepvizsgálatokéval (önhivatkozás-torzítás). A 22–126 g/h tartomány
      a valós szórást mutatja. Kerékpárra a GI-mechanizmus (rázkódás, splanchnikus hypoperfúzió) enyhébb – a bevitel felső
      tartománya kerékpáron könnyebben elérhető.
    status: ellenorizve-doi

  - key: costa-2016-ultra-gis-intake
    type: journal
    authors: [Costa R.J.S., Snipe R., Camões-Costa V., Scheer V., Murray A.]
    year: 2016
    title: "The impact of gastrointestinal symptoms and dermatological injuries on nutritional intake and hydration status during ultramarathon events"
    journal: "Sports Medicine – Open 2:16"
    doi: 10.1186/s40798-015-0041-9
    url: https://link.springer.com/article/10.1186/s40798-015-0041-9
    grade: B
    questions: [Q1, Q2]
    summary: >-
      Terepi megfigyelés: többnapos ultramaraton (MSUM, n=54) és 24 órás futás (n=22), ad libitum étel-folyadék naplózással.
      GI-tünetet a MSUM-on 85%, a 24 órán 73% jelentett. A többnaposon a GI-tünet csökkentette a napi, futás közbeni és
      szakasz utáni energia- és makrotápanyag-bevitelt (futás közbeni CHO −8 g/h a tünetesek­nél, p<0,01); a 24 órás
      versenyen viszont a GI-tünet nem változtatta meg a bevitelt.
    quote: >-
      "GIS were reported by 85 and 73 % of ultramarathon runners throughout MSUM and 24 h, respectively." … "Rate of
      carbohydrate intake during running was also significantly lower (−8 g/h) in participants reporting GIS (p < 0.01 vs. no-GIS)".
    notes: >-
      Futás, sivatagi többnapos (Al Andalus-típusú) és 24 h; kerékpárra a GI-arány valószínűleg alacsonyabb. Kulcs a
      többnapos versenyekre: a GI-tünet nem csak kellemetlen, hanem a bevitelt (és így az energiamérleget) rontja –
      lásd Q2. DOI a Springer URL-ből.
    status: ellenorizve-doi

  - key: noakes-2025-sub2h-critique
    type: journal
    authors: [Noakes T.D., Prins P.J.]
    year: 2025
    title: "Are very high rates of exogenous carbohydrate ingestion (>90 g/hr) sufficient or indeed necessary to run a sub-2hr marathon? An analysis of the model predictions of Lukasiewicz and colleagues"
    journal: "Frontiers in Nutrition 11:1507572"
    doi: 10.3389/fnut.2024.1507572
    url: https://www.frontiersin.org/journals/nutrition/articles/10.3389/fnut.2024.1507572/full
    grade: C
    questions: [Q1, Q3]
    summary: >-
      Ellenvélemény: a szerzők szerint 2 óra alatt a bevitt CHO-nak legfeljebb ~50%-a oxidálódik; 144 g/h bevitelnél is
      legfeljebb ~137 g (68,5 g/h) exogén oxidáció valószínű, és a bevitt CHO 53–70%-a oxidálatlanul a bélben marad. Elegendő
      zsíroxidációval (0,7 g/perc férfi, 0,9 g/perc nő) a sub-2h maraton exogén CHO nélkül is lehetséges lenne.
    quote: >-
      "The maximum amount of exogenous CHO oxidation during a sub2hrM in which subjects ingest CHO even at 144 g/hr, would
      likely be only 137 g (68.5 g/hr)." … "Fifty three and 70% of the ingested CHO … remained unoxidized after 2 hours exercise".
    notes: >-
      Vitairat, nem adat; a 2 órás ablak érvelése ultrára (ahol az exogén oxidáció 2–3 óra után éri el a platót) csak
      részben érvényes. Fontos az "ELLENTMONDÁS" blokkhoz: az izotópos mérések 1,5–1,7 g/perc csúcsot mutatnak (podlogar-2022-120vs90,
      hearris-2022-120-formats, ravikanti-2025-marathoners-120), Noakes ezt a 2 órás átlagos hasznosulással vitatja.
    status: ellenorizve-doi

  # ---------------------------------------------------------------- Q2: energiaforgalom, deficit, testösszetétel, RED-S
  - key: knechtle-2005-raam-case
    type: journal
    authors: [Knechtle B., Enggist A., Jehle T.]
    year: 2005
    title: "Energy Turnover at the Race Across AMerica (RAAM) – a Case Report"
    journal: "International Journal of Sports Medicine 26(6):499-503"
    doi: 10.1055/s-2004-821136
    url: https://www.thieme-connect.com/products/ejournals/abstract/10.1055/s-2004-821136
    grade: B
    questions: [Q2, Q1]
    summary: >-
      n=1 szóló RAAM-versenyző (33 év, 73 kg, VO2max 60), 4701 km 9 nap 16 óra 45 perc alatt, napi 470 ± 73 km. Becsült
