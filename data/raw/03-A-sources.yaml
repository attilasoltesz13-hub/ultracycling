  # ---------------------------------------------------------------- Q3 kiegészítés: kerékpáros keto-vizsgálatok, esettanulmány, CHO-visszavezetés
  - key: mcswiney-2018-keto-cyclists
    type: journal
    authors: [McSwiney F.T., Wardrop B., Hyde P.N., Lafountain R.A., Volek J.S., Doyle L.]
    year: 2018
    title: "Keto-adaptation enhances exercise performance and body composition responses to training in endurance athletes"
    journal: "Metabolism 81:25-34"
    doi: 10.1016/j.metabol.2017.10.010
    url: https://www.sciencedirect.com/science/article/abs/pii/S0026049517302986
    grade: B
    questions: [Q3]
    summary: >-
      20 férfi állóképességi sportoló (33 ± 11 év), 12 hét azonos edzés magas CHO (n=11) vs ketogén (n=9) étrenden
      (önválasztott csoportok). Testtömeg −5,9 vs −0,8 kg (p=0,006), testzsír −5,2 vs −0,7% (p=0,008); 100 km-es
      időfutam −4,07 vs −1,13 perc (p=0,057, n.s.); 6 s sprint csúcsteljesítmény +0,8 vs −0,1 W/kg (p=0,025); kritikus
      teljesítmény +1,4 vs −0,7 W/kg (p=0,047). Éhgyomri BHB 0,1→0,5 mmol/l.
    quote: >-
      Absztraktból: 100 km time trial "HC −1.13 min, LCKD −4.07 min, P=0.057"; body mass "−5.9 kg vs. −0.8 kg, P=0.006";
      critical power "LCKD increased 1.4 w/kg; HC decreased −0.7 w/kg (P=0.047)".
    notes: >-
      Kerékpáros, 100 km-es (~3 h) teszt – a legultrásabb keto-vizsgálat. Nem randomizált; a W/kg-javulás nagyrészt a
      6 kg-os tömegvesztésből származhat (abszolút W nem közölt az absztraktban); a 100 km-es különbség nem szignifikáns.
      Volek társszerző (FASTER-csoport). A tömegvesztés ultrán (hegyi szakaszok) valódi előny lehet, de a "hatásfok"
      kérdést nem válaszolja meg.
    status: ellenorizve-doi

