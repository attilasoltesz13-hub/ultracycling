  - key: kenefick-2018-drinking-strategies
    type: journal
    authors: [Kenefick R.W.]
    year: 2018
    title: "Drinking Strategies: Planned Drinking Versus Drinking to Thirst"
    journal: "Sports Medicine 48(Suppl 1):31-37"
    doi: 10.1007/s40279-017-0844-6
    url: https://link.springer.com/article/10.1007/s40279-017-0844-6
    grade: C
    questions: [Q5]
    summary: >-
      Narratív állásfoglalás a tervezett ivás mellett: a szomjúság a teljes rehidráció előtt megszűnik; ≥2% testtömeg-
      veszteség rontja a hőszabályozást, emeli a kardiovaszkuláris terhelést és (melegben, hosszan, intenzíven) az aerob
      teljesítményt. Tervezett ivás javasolt >90 perces, meleg, magas izzadásrátájú, teljesítmény-orientált helyzetben;
      szomjúság szerinti ivás elég <60–90 perc, hűvös, alacsony intenzitás mellett. Szabály: soha ne igyál annyit, hogy
      hízz; a cél a ±2% testtömeg-ablak.
    quote: >-
      "Dehydration of ≥ 2% body mass is associated with impaired thermoregulatory function, elevated cardiovascular strain
      and, in many conditions (e.g., warmer, longer, more intense), impaired aerobic exercise performance."
    notes: >-
      Narratív (C), ellentétes a goulet-2011-dehydration-meta és a Hew-Butler-vonal "szomjúság szerint" ajánlásával
      (a cikkhez Goulet és Valenzuela kommentárt írt). Ultrán a kettő összeegyeztetése: tervezett FELSŐ korlát (ne hízz)
      + szomjúság mint alsó jelzés; többnapos, alváshiányos állapotban a szomjúságérzet megbízhatóságáról nincs adat.
    status: ellenorizve-doi

  - key: gauckler-2024-ultracycling-fluid
    type: journal
    authors: [Gauckler P., Kesenheimer J.S., Leierer J., Kruus M., Schreinlechner M., Theurl F., Bauer A., Denicolò S., Egger A., Seeber B., Mayer G., Kolbinger F.R., Kronbichler A.]
    year: 2024
    title: "Exercise-Induced Fluid Retention, Cardiac Volume Overload, and Peripheral Edema in Ultra-Distance Cyclists"
    journal: "Kidney International Reports 9(1)"
    doi: 10.1016/j.ekir.2023.10.025
    url: https://www.sciencedirect.com/science/article/pii/S2468024923015668
    grade: B
    questions: [Q5]
    summary: >-
      13 ultrakerékpáros (5 nő, 8 férfi) 6 napos, önellátó túrán (átlag 1205 km, 19 417 m szint). Testtömeg stabil (-0,26%,
      n.s.), de teljes testvíz +1,98±1,37 l (p=0,003), plazmatérfogat +18,9±10,7% (p<0,001), NT-proBNP +298±190 ng/l
      (p<0,001), copeptin (AVP-marker) +38,3±18,9 pg/ml (p<0,001), szérum-Na +1,77±2,46 mmol/l (p=0,04). Arc/szemhéj-ödéma
      az 5. napon tetőzött, boka/csukló-körfogat nőtt (p<0,001); vizelet-Na mélypont a 4. napon (RAAS + AVP aktiváció).
      Két enyhe hyponatraemia (133–134) már a rajtnapon.
    quote: >-
      "Ultracycling over multiple days induces extracellular volume expansion, peripheral edema, and cardiac volume
      overload. Renal sodium and water retention is likely contributing to this condition."
    notes: >-
      Többnapos ultrakerékpáros terepadat (TCR-típusú önellátó formátum), n=13. Absztraktból + eredménytáblából
      (ScienceDirect). Kulcs: a stabil testtömeg NEM jelent stabil folyadékháztartást – a zsír/glikogén-vesztést a
      visszatartott víz és só "pótolja", a mérleg félrevezet. Ezért a többnapos ultrán a testtömeg-alapú hidratálási cél
      (±2%) csak az első napon értelmezhető.
    status: ellenorizve-doi

