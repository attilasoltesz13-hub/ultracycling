    quote: >-
      "peak I-FABP, 875 ± 137 ... 474 ± 74 ... 507 ± 103 ... 352 ± 44 pg·mL, respectively."
    notes: >-
      n=9, kerékpáros ergométer, labor. Absztraktból (OpenAlex-rekonstrukció). Kerékpározás volt a terhelési forma –
      közvetlenül átvihető. Ultrán az NSAID-használat (nyereg-, térd-, nyakfájdalom) a GI-sérülés és – a Q5-ben – a
      hyponatraemia kockázatát is emeli.
    status: ellenorizve-doi

  - key: snipe-2018-heat-gi
    type: journal
    authors: [Snipe R.M.J., Khoo A., Kitic C.M., Gibson P.R., Costa R.J.S.]
    year: 2018
    title: "The impact of exertional-heat stress on gastrointestinal integrity, gastrointestinal symptoms, systemic endotoxin and cytokine profile"
    journal: "European Journal of Applied Physiology 118(2):389-400"
    doi: 10.1007/s00421-017-3781-z
    url: https://link.springer.com/article/10.1007/s00421-017-3781-z
    grade: A
    questions: [Q4]
    summary: >-
      10 futó, 2 h 60% VO2max 35 °C-on vs. 22 °C-on. Maghőmérséklet-emelkedés 2,4±0,8 vs. 1,4±0,5 °C. I-FABP-emelkedés
      432% (hő) vs. 127% (mérsékelt), p<0,001. GI-tünet előfordulás 90% vs. 70%, a tünet-súlyosság 720 vs. 58 pont
      (p=0,008) – a hő tehát a GI-tünetek intenzitását ~12-szeresére emelte ugyanannál a terhelésnél.
    quote: >-
      "Exertional-heat stress induces a thermoregulatory strain that subsequently injures the intestinal epithelium,
      reduces endotoxin clearance capacity, promotes greater cytokinaemia, and development of gastrointestinal symptoms."
    notes: >-
      n=10, futás, labor, kontrollált. A hő-GI kapcsolat a kerékpáros ultrára (nyári RAAM-sivatag, TCR-Balkán) közvetlenül
      releváns. Számok a Springer absztraktból.
    status: ellenorizve-doi

  - key: mlinaric-2025-gi-strategies-sr
    type: journal
    authors: [Mlinaric J., Mohorko N.]
    year: 2025
    title: "Nutritional strategies for minimizing gastrointestinal symptoms during endurance exercise: systematic review of the literature"
    journal: "Journal of the International Society of Sports Nutrition 22(1)"
    doi: 10.1080/15502783.2025.2529910
    url: https://api.openalex.org/works/doi:10.1080/15502783.2025.2529910
    grade: A
    questions: [Q4]
    summary: >-
      PRISMA szisztematikus áttekintés, 29 vizsgálat (RCT, keresztezett, esettanulmány) öt területen: gut-training
      protokollok, CHO-keverékek, low-FODMAP diéta, hidrogél-CHO, probiotikum. Következtetés: a gut-training ígéretes;
      az ajánlás szerinti CHO-bevitel kevesebb és enyhébb GI-tünettel jár; a low-FODMAP csökkentheti a tüneteket, de
