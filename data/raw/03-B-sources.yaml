    notes: >-
      Narratív (C), de a leggyakrabban idézett ok-lista; a számok másodlagosak (a review hivatkozásaiból). Kerékpárra a
      "kevesebb mechanikai tünet" közvetlenül vonatkozik; ultrán viszont a tartam + hő + NSAID + ozmolaritás dominál.
    status: ellenorizve-doi

  - key: pasternak-2021-ondansetron
    type: journal
    authors: [Pasternak A.V., Fiore D., Islas A., Toti S., Hoffman M.D.]
    year: 2021
    title: "Treatment with Oral Ondansetron for Ultramarathon-Associated Nausea: The TOO FUN Study"
    journal: "Sports 9(3):35"
    doi: 10.3390/sports9030035
    url: https://www.mdpi.com/2075-4663/9/3/35
    grade: A
    questions: [Q4]
    summary: >-
      Randomizált, kettős vak: 62 hányingerre hajlamos ultrafutó (160/80/55 km, 2018–19) 4 mg ondanszetron vs. placebo
      kapszulát vett be tünet esetén (max. 4 adag). 31-en használták (20 ondanszetron, 11 placebo): nem volt különbség a
      javulás gyakoriságában (p=0,26) vagy mértékében (p=0,15). A bevezetés szerint a hányinger az ultrafutók akár 60%-át
      érinti, és a 161 km-es feladás elsődleges oka.
    quote: >-
      "In this small study, there were no group differences in those reporting any improvement in nausea and vomiting
      (p = 0.26) or in the amount of improvement (p = 0.15). We found no evidence that ondansetron capsules improve nausea
      and vomiting during ultramarathons."
    notes: >-
