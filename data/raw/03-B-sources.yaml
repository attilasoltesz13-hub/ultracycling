sources:
  # ---------------------------------------------------------------- Q4: a bél edzése, GI-panaszok
  - key: costa-2017-guttraining
    type: journal
    authors: [Costa R.J.S., Miall A., Khoo A., Rauch C., Snipe R., Camões-Costa V., Gibson P.]
    year: 2017
    title: "Gut-training: the impact of two weeks repetitive gut-challenge during exercise on gastrointestinal status, glucose availability, fuel kinetics, and running performance"
    journal: "Applied Physiology, Nutrition, and Metabolism 42(5):547-557"
    doi: 10.1139/apnm-2016-0453
    url: https://api.openalex.org/works/doi:10.1139/apnm-2016-0453
    grade: A
    questions: [Q4]
    summary: >-
      A Costa-munkacsoport alap "gut training" RCT-je: 25 állóképességi futó, 2 hetes napi "bélkihívás" (edzés közben
      30 g CHO 20 percenként = 90 g/h, 2:1 glükóz:fruktóz gél, vagy ugyanennyi CHO ételként, vagy placebo). A gél-csoportban
      a GI-tünetek 60%-kal (p=0,008), az étel-csoportban 63%-kal (p=0,046) csökkentek a 2. tesztre; a kilégzett H2-csúcs
      (felszívódási zavar markere) 6 ppm (gél) vs. 9 (étel) vs. 12 ppm (placebo). Vércukor gélnél 7,2 vs. 6,1–6,2 mmol/l.
      1 órás távteszt: +5,2% (gél), +4,3% (étel), -2,1% (placebo), trial×time p=0,009.
    quote: >-
      "Gastrointestinal symptoms reduced in GC2 CHO-S (60%; p = 0.008) and CHO-F (63%; p = 0.046); reductions were greater
      than PLA (p < 0.05)."
    notes: >-
      n=25, futók, laboratóriumi (2 h 60% VO2max + 1 h teszt). Absztraktból (OpenAlex-rekonstrukció), a cdnsciencepub
      oldal 403-at adott. A 90 g/h a kerékpáros ultra-céltartomány alsó fele; a futás mechanikai terhelése miatt a
      kerékpárosnál a tüneti nyereség lehet kisebb, de a felszívódási adaptáció (SGLT1) sportfüggetlen. 2 hét elég a
      mérhető tüneti javuláshoz – a "gut training" gyakorlati alapja.
    status: ellenorizve-doi

  - key: miall-2018-gutchallenge
    type: journal
    authors: [Miall A., Khoo A., Rauch C., Snipe R.M.J., Camões-Costa V.L., Gibson P.R., Costa R.J.S.]
    year: 2018
    title: "Two weeks of repetitive gut-challenge reduce exercise-associated gastrointestinal symptoms and malabsorption"
    journal: "Scandinavian Journal of Medicine & Science in Sports 28(2):630-640"
    doi: 10.1111/sms.12912
    url: https://api.openalex.org/works/doi:10.1111/sms.12912
    grade: A
    questions: [Q4]
    summary: >-
      Placebo-kontrollált, vak gut-training vizsgálat 18 futóval: 2 hét, napi 90 g CHO/h (vs. 0 g/h placebo) edzés közben.
      A CHO-csoportban csökkent a bél-diszkomfort (p=0,012), az összes GI-tünet (p=0,009), a felső (p=0,015) és alsó
      (p=0,008) GI-tünetek és a hányinger (p=0,05); a kilégzett H2-csúcs 6±3 ppm vs. placebo 13±6 ppm (p=0,004).
      A záró 1 órás futótáv 11,7±1,5 → 12,3±1,3 km (p=0,035) csak a CHO-csoportban nőtt.
    quote: >-
      "In GC 2, a reduced gut discomfort (P=.012), total (P=.009), upper-(P=.015), lower-gastrointestinal (P=.008)
      symptoms, nausea (P=.05) observed on CHO but not PLA."
    notes: >-
      n=18, futók, labor. Absztraktból (OpenAlex-rekonstrukció, Wiley 403). Az étkezési tolerancia (feeding tolerance)
      nem változott – azaz a "mennyit tudok lenyelni" nem, a "mennyire zavar" és "mennyi szívódik fel" igen.
      Ultrakerékpárra a 90 g/h-s edzésprotokoll közvetlenül átvihető (hosszú alapozó tekeréseken).
    status: ellenorizve-doi

  - key: costa-2017-eigs-review
    type: journal
    authors: [Costa R.J.S., Snipe R.M.J., Kitic C.M., Gibson P.R.]
    year: 2017
    title: "Systematic review: exercise-induced gastrointestinal syndrome—implications for health and intestinal disease"
    journal: "Alimentary Pharmacology & Therapeutics 46(3):246-265"
    doi: 10.1111/apt.14157
    url: https://api.openalex.org/works/doi:10.1111/apt.14157
    grade: A
    questions: [Q4]
    summary: >-
      Szisztematikus áttekintés (5 adatbázis) az "exercise-induced gastrointestinal syndrome" (EIGS) mechanizmusairól:
      az intenzitás és időtartam növekedésével nő a bélsérülés és -permeabilitás, romlik a gyomorürülés, lassul a
      vékonybél-tranzit és nő a felszívódási zavar. Küszöb: ≥2 óra 60% VO2max-on, edzettségtől függetlenül. A hőstressz
      és a futó mozgásforma súlyosbítja. 396 hivatkozás (OpenAlex).
    quote: >-
      "Exercise ≥2 hours at 60% VO2max appears to be the threshold whereby significant gastrointestinal perturbations
      manifest, irrespective of fitness status."
    notes: >-
      Mechanisztikus alap (splanchnikus vérátáramlás-csökkenés → epithel-sérülés → permeabilitás/endotoxin; neuroendokrin
      ág → gyomorürülés/tranzit lassulás). "Running mode" súlyosbító: kerékpáron a mechanikai komponens kisebb, a
      keringési/hő komponens azonos. Absztraktból (OpenAlex-rekonstrukció).
    status: ellenorizve-doi

  - key: jeukendrup-2017-trainingthegut
    type: journal
    authors: [Jeukendrup A.E.]
    year: 2017
    title: "Training the Gut for Athletes"
    journal: "Sports Medicine 47(Suppl 1):101-110"
    doi: 10.1007/s40279-017-0690-6
    url: https://link.springer.com/article/10.1007/s40279-017-0690-6
    grade: C
    questions: [Q4]
    summary: >-
      Narratív áttekintés a bél adaptálhatóságáról. A GI-panaszok az állóképességi sportolók 30–50%-ánál rendszeresek.
      Öt "gut training" stratégia: (1) magas napi CHO-bevitel (Cox 2010: 28 nap 8,5 vs. 5,3 g/kg/nap → nagyobb exogén
      CHO-oxidáció kerékpárosoknál), (2) rendszeres CHO-bevitel edzés közben, (3) gyomortérfogat-tolerancia edzése
      (nagy folyadék/étel mennyiség edzés közben), (4) verseny-szimuláció a tervezett menüvel, (5) többféle CHO
      (glükóz:fruktóz). Cunningham: 3 napi 400 g glükóz → gyomor fél-ürülési idő 29,1 → 20,7 perc.
    quote: >-
      "It is clear that 'nutritional training' can improve gastric emptying and absorption and likely reduce the chances
      and/or severity of GI problems, thereby improving endurance performance as well as providing a better experience
      for the athlete."
    notes: >-
      Narratív (C fokozat), de a hivatkozott alapvizsgálatok (Cox 2010 kerékpáros; Cunningham 1991) mért adatok. A
      kerékpáros ultrára a leginkább átvihető: a Cox-vizsgálat kerékpárosokon készült. Az adaptáció időskálája (2 hét vs.
      4 hét) nyitott kérdés a cikk szerint is.
    status: ellenorizve-doi

  - key: pfeiffer-2012-gi-endurance-events
    type: journal
    authors: [Pfeiffer B., Stellingwerff T., Hodgson A.B., Randell R.K., Pöttgen K., Res P., Jeukendrup A.E.]
    year: 2012
    title: "Nutritional Intake and Gastrointestinal Problems during Competitive Endurance Events"
    journal: "Medicine & Science in Sports & Exercise 44(2):344-351"
    doi: 10.1249/MSS.0b013e31822dc809
    url: https://api.openalex.org/works/doi:10.1249/MSS.0b013e31822dc809
    grade: B
    questions: [Q4]
    summary: >-
      221 állóképességi versenyző (Ironman Hawaii, Ironman Németország, 70.3, maraton, 100/150 km-es országúti
      kerékpárverseny, profi kerékpárosok szakaszversenyen) verseny utáni kérdőíve. CHO-bevitel: IM 62±26 és 71±25 g/h,
      70.3 65±25, maraton 53±22, kerékpárverseny 35±26 g/h; egyéni szórás 6–136 g/h. Súlyos GI-tünet: IM ~31%, 70.3 14%,
      maraton 4%, profi kerékpáros 7%. A felső GI-tünetpontszám korrelált a CHO-bevitellel (r=0,37 és 0,51), de a
      nagyobb CHO-bevitel jobb IM-időt is jelentett.
    quote: >-
      "Prevalence of serious GI symptoms was highest during IM races (~31%, P=0.001) compared with 70.3 (14%), marathon
      (4%), and PRO (7%), and correlated with a history of GI problems."
    notes: >-
      n=221, vegyes sportok, terep-kérdőív (0–9-es skála, "súlyos" = ≥5). Absztraktból (OpenAlex-rekonstrukció). A
      kerékpáros alcsoportokban (amatőr 100/150 km, profi szakaszverseny) alacsony a prevalencia, a versenyidő is
      rövid (<8 h); ultrakerékpárra a tartamhatás miatt csak alsó becslés. A "GI-előzmény" a legerősebb prediktor.
    status: ellenorizve-doi

  - key: stuempfle-2015-wser-gi
    type: journal
    authors: [Stuempfle K.J., Hoffman M.D.]
    year: 2015
    title: "Gastrointestinal distress is common during a 161-km ultramarathon"
    journal: "Journal of Sports Sciences 33(17):1814-1821"
    doi: 10.1080/02640414.2015.1012104
    url: https://api.openalex.org/works/doi:10.1080/02640414.2015.1012104
    grade: B
    questions: [Q4]
    summary: >-
      Western States 161 km, 272 futó (a rajtolók 71%-a) verseny utáni kérdőíve 12 GI-tünetről négy versenyszakaszban.
      GI-tünet 96,0%-nál; leggyakoribb: puffadás/szél 65,9%, böfögés 61,3%, hányinger 60,3%. A célba érők 43,9%-ánál a
      GI-tünet rontotta a teljesítményt (ebből hányinger 86,0%); a feladók 35,6%-ánál a GI-panasz volt a feladás oka
      (hányinger 90,5%). A tünetek a legmelegebb, legnehezebb szakaszon tetőztek.
    quote: >-
      "Among non-finishers, 35.6% cited GI distress as their reason for dropping out, with nausea (90.5%) most prevalent."
    notes: >-
      n=272, futás, terep-kérdőív (retrospektív). Absztraktból (OpenAlex-rekonstrukció). Ultrafutó adat; kerékpáron a
      mechanikai rázkódás kisebb, de a hő + tartam + hányinger-mint-feladási-ok mintázat a RAAM-beszámolókkal egybevág.
    status: ellenorizve-doi

  - key: martinez-2025-mallorca312
    type: journal
    authors: [Martínez P., Martínez S., Mingorance J.A., Riera-Sampol A., Aguiló A., Tauler P.]
    year: 2025
    title: "Gastrointestinal symptoms and nutritional intake among participants in a non-professional cycling event"
    journal: "European Journal of Applied Physiology 125(1):37-48"
    doi: 10.1007/s00421-024-05582-4
    url: https://link.springer.com/article/10.1007/s00421-024-05582-4
    grade: B
    questions: [Q4]
    summary: >-
      Mallorca 312 (2023; 167/225/312 km-es távok), 247 amatőr kerékpáros verseny előtt, 138 utána. GI-tünet edzésen és
      korábbi versenyeken 22–26%, a versenyen 38,4% (közepes/súlyos 13,8%), a verseny után 28,3%. Leggyakoribb: szelesség
      25,4%, böfögés 23,2%, puffadás 15,2%. Átlagos bevitel: 59,2 g CHO/h, ~500 ml folyadék/h, ~285 kcal/h. Az intake és a
      GI-tünetek között nem volt összefüggés; a nyugalmi GI-tünetek és a rajt előtti idegesség jelezte előre a tüneteket.
    quote: >-
      "No association was found between GI symptoms and nutritional parameters"
    notes: >-
      Kerékpáros terepadat (a legközelebb az ultrakerékpárhoz: 312 km, ~10–14 h). n=138 a versenyutáni mintában; kérdőíves.
      Az idézet a Springer-oldal absztraktjából. Tanulság: 60 g/h és 500 ml/h mellett a kerékpáros GI-panasz inkább
      egyéni hajlam/szorongás, mint a bevitel függvénye – a bél edzése és a rutin számít.
    status: ellenorizve-doi

  - key: vanwijck-2012-ibuprofen
    type: journal
    authors: [van Wijck K., Lenaerts K., van Bijnen A.A.J.H.M., Boonen B., van Loon L.J.C., Dejong C.H.C., Buurman W.A.]
    year: 2012
    title: "Aggravation of Exercise-Induced Intestinal Injury by Ibuprofen in Athletes"
    journal: "Medicine & Science in Sports & Exercise 44(12):2257-2262"
    doi: 10.1249/MSS.0b013e318265dd3d
    url: https://api.openalex.org/works/doi:10.1249/MSS.0b013e318265dd3d
    grade: A
    questions: [Q4, Q5]
    summary: >-
      Kontrollált keresztezett vizsgálat, 9 edzett férfi, 4 kar: 2×400 mg ibuprofen + kerékpározás; kerékpározás;
      ibuprofen nyugalomban; nyugalom. Az I-FABP csúcs (vékonybél-sérülés markere): 875±137 (ibuprofen+kerékpár) vs.
      474±74 (kerékpár) vs. 507±103 (ibuprofen nyugalomban) vs. 352±44 pg/ml. Bélpermeabilitás (laktulóz/ramnóz):
