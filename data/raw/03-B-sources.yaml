    notes: >-
      Csak PubMed, 2023. jan.–márc. keresés; a beválogatott vizsgálatok többsége futó/kerékpáros labor. Absztraktból
      (OpenAlex-rekonstrukció, T&F 403). A hidrogél-következtetés ellentmond Rowe 2022-nek (l. rowe-2022-hydrogel).
    status: ellenorizve-doi

  - key: rowe-2022-hydrogel
    type: journal
    authors: [Rowe J.T., King R.F.G.J., King A.J., Morrison D.J., Preston T., Wilson O.J., O'Hara J.P.]
    year: 2022
    title: "Glucose and Fructose Hydrogel Enhances Running Performance, Exogenous Carbohydrate Oxidation, and Gastrointestinal Tolerance"
    journal: "Medicine & Science in Sports & Exercise 54(1):129-140"
    doi: 10.1249/MSS.0000000000002764
    url: https://api.openalex.org/works/doi:10.1249/MSS.0000000000002764
    grade: A
    questions: [Q4]
    summary: >-
      11 edzett férfi futó, randomizált kettős vak: 120 perc 68% VO2max + 5 km időfutam, 90 g/h 2:1 glükóz:fruktóz
      hidrogélként vs. sima oldatként vs. CHO-mentes placebo. Időfutam: hidrogél 7,6%, sima oldat 5,6% gyorsabb a
      placebónál; hidrogél 2,1%-kal gyorsabb a sima oldatnál (p=0,033). Exogén CHO-oxidáció 68,6±10,8 g (hidrogél) vs.
      63,4±8,1 g. Az összes GI-tünet magasabb volt a sima oldatnál (p<0,001).
    quote: >-
      "Time-trial performance was 7.6% and 5.6% faster after hydrogel (19:29±2:24, P<0.001) and nonhydrogel
      (19:54±2:23, P=0.002), respectively, versus placebo (21:05±2:34). Hydrogel was 2.1% faster than nonhydrogel (P=0.033)."
    notes: >-
      n=11, futás, labor; ez a hidrogél-irodalom kevés pozitív vizsgálata (kerékpáros vizsgálatok – Baur 2019, King 2020,
      McCubbin 2020 – nem mutattak előnyt). Absztraktból (OpenAlex-rekonstrukció). Ultrakerékpáron a hidrogél előnye
      legfeljebb a magas (≥90 g/h) beviteli szinten, futáshoz hasonló rázkódás nélkül még kevésbé valószínű.
    status: ellenorizve-doi

  - key: deoliveira-2014-gi-complaints
    type: journal
    authors: [de Oliveira E.P., Burini R.C., Jeukendrup A.]
    year: 2014
    title: "Gastrointestinal Complaints During Exercise: Prevalence, Etiology, and Nutritional Recommendations"
    journal: "Sports Medicine 44(Suppl 1):79-85"
    doi: 10.1007/s40279-014-0153-2
    url: https://link.springer.com/article/10.1007/s40279-014-0153-2
    grade: C
    questions: [Q4]
    summary: >-
      Narratív áttekintés: az állóképességi sportolók 30–50%-a (távfutóknál 30–90%) tapasztal GI-panaszt; a tünetek
      futóknál gyakoribbak, mint kerékpárosoknál (mechanikai ok). Maximális terhelésnél a splanchnikus vérátáramlás akár
