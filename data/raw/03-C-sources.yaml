    authors: [Wharam P.C., Speedy D.B., Noakes T.D., Thompson J.M.D., Reid S.A., Holtzhausen L.M.]
    year: 2006
    title: "NSAID Use Increases the Risk of Developing Hyponatremia during an Ironman Triathlon"
    journal: "Medicine & Science in Sports & Exercise 38(4):618-622"
    doi: 10.1249/01.mss.0000210209.40694.09
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1249/01.mss.0000210209.40694.09&resultType=core&format=json
    grade: B
    questions: [Q6]
    summary: >-
      Terepvizsgálat, 330 induló a 2004-es új-zélandi Ironmanen. NSAID-használat 30%; a hyponatraemia összincidenciája 1,8%; az
      NSAID-használat összefüggött a hyponatraemia előfordulásával (p=0,0002), és az NSAID-csoport plazma-nátriuma alacsonyabb volt (p=0,02).
    quote: >-
      "The incidence of NSAID use was 30%" ... "NSAID use was related to the incidence of hyponatremia (P = 0.0002)" ...
      "The NSAID group had lower plasma Na (P = 0.02)"
    notes: >-
      Absztraktból (Europe PMC REST); esélyhányados az absztraktban nincs. Triatlon, ~10–12 óra; megfigyeléses. Mechanizmus: az NSAID
      gátolja a prosztaglandin-függő vese-vízkiválasztást (ADH-hatás erősödik), ezért túlivásnál hyponatraemiát segít elő – ultrán a
      hosszú, alacsony intenzitású, "sokat iszom" fázisokban ez a kockázat.
    status: ellenorizve-doi

  - key: rust-2012-swiss-cycling-marathon
    type: journal
    authors: [Rüst C.A., Knechtle B., Knechtle P., Rosemann T.]
    year: 2012
    title: "No case of exercise-associated hyponatraemia in top male ultra-endurance cyclists: the 'Swiss Cycling Marathon'"
    journal: "European Journal of Applied Physiology 112:689-697"
    doi: 10.1007/s00421-011-2024-y
    url: https://link.springer.com/article/10.1007/s00421-011-2024-y
    grade: B
    questions: [Q8, Q6]
    summary: >-
      65 férfi ultrakerékpáros a 720 km-es Swiss Cycling Marathonon (PBP/RAAM-kvalifikáció), ad libitum ivás. Testtömeg-változás
      −1,5 (1,7)% (p<0,01); a folyadékbevitel negatívan korrelált a plazma-nátrium változásával (r=−0,32, p<0,05); egyetlen versenyző sem
      lett hyponatraemiás. Ez a legnagyobb mintájú ultrakerékpáros folyadék/nátrium terepadat.
    quote: >-
      "The cyclists lost 1.5 (1.7)% body mass (P < 0.01)" ... "No athlete developed EAH"
    notes: >-
      Kiadói absztrakt-oldal; l/h folyadékbevitel az absztraktban nincs (a teljes szöveg tartalmazza). Csak férfiak, ~24–30 órás
      verseny, mérsékelt svájci nyári hőmérséklet. A −1,5% átlagos veszteség és a nulla EAH azt jelzi, hogy ad libitum ivással a
      kerékpáros ultrán a mérsékelt dehidráció, nem a túlivás a tipikus.
    status: ellenorizve-doi

  - key: sim-2019-iron-athlete
    type: journal
    authors: [Sim M., Garvican-Lewis L.A., Cox G.R., Govus A., McKay A.K.A., Stellingwerff T., Peeling P.]
    year: 2019
    title: "Iron considerations for the athlete: a narrative review"
    journal: "European Journal of Applied Physiology 119:1463-1478"
    doi: 10.1007/s00421-019-04157-y
    url: https://link.springer.com/article/10.1007/s00421-019-04157-y
    grade: C
    questions: [Q9]
    summary: >-
      Narratív áttekintés: vashiány a női sportolói kohorszok ~15–35%-ánál, a férfi kohorszok ~5–11%-ánál; oka részben a terhelés
      indukálta hepcidin-emelkedés (ami a vasfelszívódást órákra gátolja), a hemolízis, izzadás, GI-vérveszteség. Magasság és nagy
      edzésvolumen növeli a szükségletet.
    quote: >-
      female athletes "~ 15–35% athlete cohorts deficient" ... "approximately 5–11% of male athlete cohorts also present with this issue"
    notes: >-
      Kiadói absztrakt-oldal; a hepcidin-időzítés (3–6 óra terhelés után) és a ferritin-küszöb a teljes szövegben, az absztraktban nem
      szerepel – itt nem idézem számmal. Nem ultra-specifikus. A tankönyvi ajánlás (ferritin-ellenőrzés a felkészülés elején,
      reggeli/terhelés előtti vasbevitel) a review teljes szövegére és thomas-2016-ra épül.
    status: ellenorizve-doi

  - key: owens-2018-vitamin-d
    type: journal
    authors: [Owens D.J., Allison R., Close G.L.]
    year: 2018
    title: "Vitamin D and the Athlete: Current Perspectives and New Challenges"
    journal: "Sports Medicine 48(Suppl 1):3-16"
    doi: 10.1007/s40279-017-0841-9
    url: https://link.springer.com/article/10.1007/s40279-017-0841-9
    grade: C
    questions: [Q9]
    summary: >-
      Narratív áttekintés: elégséges 25(OH)D >75 nmol/l, súlyos hiány <25 nmol/l, toxicitási aggály >180 nmol/l. Elit sportban a
      pótlás 1000 NE/nap-tól heti 100 000 NE bólusig terjed; 4000 NE/nap javította az erő regenerációját excentrikus izomkárosító
      terhelés után; alacsony D-szint több felső légúti fertőzéssel jár; a csontsűrűséggel meglepően nem találtak összefüggést etnikailag
      vegyes sportolói mintán.
    quote: >-
      Supplementation "at 4000 IU/day has a positive effect on the recovery of force following a bout of damaging eccentric exercise" ...
      "no association between serum 25[OH]D concentration and measures of bone health in an ethnically diverse athletic population."
    notes: >-
      Kiadói absztrakt-oldal. Nem ultra-specifikus; téli felkészülésben (okt–márc, 47° é. sz.) a hiány gyakori, laborral ellenőrizve
      pótolni – a nagy bólusok kerülendők.
    status: ellenorizve-doi

