  # ---------------------------------------------------------------- Q6: koffein – adag, időzítés, genetika, ismételt kis adagok
  - key: guest-2021-issn-caffeine
    type: position-stand
    authors: [Guest N.S., VanDusseldorp T.A., Nelson M.T., Grgic J., Schoenfeld B.J., Jenkins N.D.M., Arent S.M., Antonio J., Stout J.R., Trexler E.T., Smith-Ryan A.E., Goldstein E.R., Kalman D.S., Campbell B.I.]
    year: 2021
    title: "International society of sports nutrition position stand: caffeine and exercise performance"
    journal: "Journal of the International Society of Sports Nutrition 18:1"
    doi: 10.1186/s12970-020-00383-4
    url: https://jissn.biomedcentral.com/articles/10.1186/s12970-020-00383-4
    grade: A
    questions: [Q6]
    summary: >-
      Az ISSN konszenzus-állásfoglalása a koffeinről. Hatásos adag 3–6 mg/kg; a leggyakoribb időzítés 60 perc a terhelés
      előtt; alacsony adag (1–3 mg/kg) is mérhető ergogén hatású; nagyon nagy adag (9 mg/kg) sok mellékhatással jár és nem
      szükséges. A koffein a fáradtság felhalmozódásakor (hosszú, folyamatos terhelés) a leghasznosabb, alváshiányban is javíthatja
      a kognitív és fizikai teljesítményt egyeseknél. Az egyéni válaszkülönbség részben CYP1A2 és ADORA2A gén-variánsokhoz köthető.
      Objektív alvásmérések szerint rontja az elalvási latenciát, az éjszakai ébrenlétet, az alváshatékonyságot és az alvásidőt.
    quote: >-
      "Caffeine appears to be most beneficial during times or in sports where there is an accumulation of fatigue, i.e., exercise
      over a longer continuous or intermittent duration." / "Ingestion of lower doses of caffeine (1–3 mg/kg of body mass) ... also
      appear to deliver measurable ergogenic effects."
    notes: >-
      Konszenzus, sok RCT-re épül, de a bizonyíték zöme <3 órás labor-terhelés; ultrára (20–100+ óra, alváshiány) csak extrapoláció.
      A 4 hetes napi koffeinbevitel toleranciát növelt (hivatkozott [310] tanulmány, n=18) – ultrán ezért a verseny előtti hét
      mérséklése észszerű, de ezt a stand nem ultrán vizsgálta. Kiadói teljes szöveg megnyitva.
    status: ellenorizve-doi

  - key: guest-2018-cyp1a2-cycling
    type: journal
    authors: [Guest N., Corey P., Vescovi J., El-Sohemy A.]
    year: 2018
    title: "Caffeine, CYP1A2 Genotype, and Endurance Performance in Athletes"
    journal: "Medicine & Science in Sports & Exercise 50(8):1570-1578"
    doi: 10.1249/MSS.0000000000001596
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1249/MSS.0000000000001596&resultType=core&format=json
    grade: A
    questions: [Q6]
    summary: >-
      101 versenyző férfi sportoló, 10 km-es kerékpáros időfutam, 0 / 2 / 4 mg/kg koffein, kettős vak, placebo-kontrollált.
      Összességében a 4 mg/kg 3%-kal javította az időt (17,6 vs 18,1 perc), de erős gén–koffein interakció: AA genotípusnál
      -4,8% (2 mg/kg) és -6,8% (4 mg/kg); AC genotípusnál semmi; CC ("lassú metabolizáló") genotípusnál a 4 mg/kg 13,7%-kal
      RONTOTTA az időt (20,8 vs 18,3 perc, p=0,04).
    quote: >-
      "In those with the CC genotype, 4 mg·kg increased cycling time by 13.7% versus placebo (20.8 ± 0.8 vs 18.3 ± 0.5 min, P = 0.04).
      No effects were observed among those with the AC genotype."
    notes: >-
      Absztraktból (Europe PMC REST). Rövid (~18 perc) időfutam, nem ultra; a CC-csoport kicsi volt (a 101-ből csak ~8%),
      ezért a 13,7% romlás bizonytalan. A gyakorlati üzenet ultrára: aki koffeinre rosszul reagál (szorongás, GI, alvásképtelenség),
      annak a kis adag (≤2 mg/kg) vagy elhagyás észszerű – genetikai teszt nélkül is tesztelhető edzésen.
    status: ellenorizve-doi

  - key: grgic-2021-cyp1a2-sr
    type: journal
    authors: [Grgic J., Pickering C., Del Coso J., Schoenfeld B.J., Mikulic P.]
    year: 2021
    title: "CYP1A2 genotype and acute ergogenic effects of caffeine intake on exercise performance: a systematic review"
    journal: "European Journal of Nutrition 60:1181-1195"
    doi: 10.1007/s00394-020-02427-6
    url: https://link.springer.com/article/10.1007/s00394-020-02427-6
    grade: A
    questions: [Q6]
    summary: >-
      Szisztematikus áttekintés 17 tanulmányról a CYP1A2 −163C>A polimorfizmusról. Csak 4 tanulmány talált szignifikáns
      genotípus-különbséget, mindegyik az AA javára; aerob állóképességnél ez férfi kerékpárosokra, ≥10 km-es időfutamra és
      60 perccel a terhelés előtt bevett koffeinre korlátozódott. A szerzők szerint a genotípusok közti különbségek kicsik,
      inkonzisztensek vagy csak specifikus helyzetekre korlátozódnak – mindkét genotípus-csoport profitálhat.
    quote: >-
      "CYP1A2 genotype variations may modulate caffeine's ergogenic effects, but the differences between genotypes were small,
      inconsistent, or limited to specific exercise scenarios"
    notes: >-
      Kiadói absztrakt-oldal. Ellensúlyozza a guest-2018 eredményt: a gén-teszt nem indokolt rutinszerűen; ultrán a fő kérdés
      nem az ergogén hatás, hanem a mellékhatás/alvás – erre a genotípus-irodalom nem ad választ.
    status: ellenorizve-doi

  - key: cox-2002-caffeine-protocols
    type: journal
    authors: [Cox G.R., Desbrow B., Montgomery P.G., Anderson M.E., Bruce C.R., Macrides T.A., Martin D.T., Moquin A., Roberts A., Hawley J.A., Burke L.M.]
    year: 2002
    title: "Effect of different protocols of caffeine intake on metabolism and endurance performance"
    journal: "Journal of Applied Physiology 93(3):990-999"
    doi: 10.1152/japplphysiol.00249.2002
    url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1152/japplphysiol.00249.2002?fields=title,abstract,year,venue
    grade: A
    questions: [Q6]
    summary: >-
      Klasszikus labor-vizsgálat versenyző kerékpárosokkal (A-vizsgálat n=12, B-vizsgálat n=8): 2 óra 70% VO2peak, majd 7 kJ/kg
      időfutam, szénhidráttal. Egy nagy adag 1 órával előtte (6 mg/kg): +3,4% (95% CI 0,2–6,5); 6×1 mg/kg 20 percenként a
      terhelés alatt: +3,1% (−0,1–6,5); Coca-Cola az utolsó 40 percben (~1,5 mg/kg koffein): +3,1% (−0,2–6,2). B-vizsgálat:
      a koffeines kóla +3,3%, a koffein önmagában +2,2% (0,5–3,8; p<0,05). Következtetés: a 6 mg/kg hatása független az időzítéstől,
      és a kis, késői adag (~1,5 mg/kg) is elegendő.
    quote: >-
      "6 mg/kg caffeine enhanced TT performance independent of timing of intake and 2) replacing sports drink with Coca-Cola
      during the latter stages of exercise was equally effective in enhancing endurance performance, primarily due to low intake
      of caffeine (approximately 1.5 mg/kg)."
    notes: >-
      Absztrakt Semantic Scholar API-ból; ~2,5 órás terhelés, jól edzett kerékpárosok, nem ultra. Ez az alapja az "ismételt kis
      adag" és a "kóla a végén" stratégiának – 20+ órás versenyre a fenntartható, alvást kímélő adagolás átvitele saját következtetés.
    status: ellenorizve-doi

  - key: bescos-2012-24h-relay
    type: journal
    authors: [Bescós R., Rodríguez F.A., Iglesias X., Knechtle B., Benítez A., Marina M., Padullés J.M., Torrado P., Vazquez J., Rosemann T.]
    year: 2012
    title: "Nutritional behavior of cyclists during a 24-hour team relay race: a field study report"
    journal: "Journal of the International Society of Sports Nutrition 9:3"
    doi: 10.1186/1550-2783-9-3
    url: https://api.openalex.org/works/doi:10.1186/1550-2783-9-3
    grade: B
    questions: [Q6, Q9]
    summary: >-
      Terepvizsgálat, 8 férfi (36,7 év, 71,6 kg) 24 órás kerékpáros csapatváltó versenyen; minden étel/ital lemérve. 24 óra alatt
      943 ± 245 g CH (13,1 g/kg), 174 g fehérje (2,4 g/kg), 107 g zsír; energiabevitel 22,8 ± 8,9 MJ vs. becsült kiadás 42,9 ± 6,8 MJ
      (p=0,012). Folyadék 10,5 ± 2,7 l/24 h. Koffeinbevitel átlag 142 ± 76 mg/24 h (~2 mg/kg) – kicsi, és nem függött össze a
      teljesítménnyel (távolság, sebesség).
    quote: >-
      "Average fluid consumption corresponded to 10497 ± 2654 mL. Mean caffeine ingestion 142 ± 76 mg. Additionally, there was no
      relationship between the nutritional main variables (i.e. energy intake, carbohydrates, proteins, fluids and caffeine ingestion)
      and performance"
    notes: >-
      Absztrakt OpenAlex-ből rekonstruálva. Váltóverseny (szakaszos terhelés, pihenők), n=8, megfigyeléses – a szóló ultrára
      korlátozottan vihető át. Az egyetlen kerékpáros terepadat, ahol koffeinbevitelt is mértek: a versenyzők ténylegesen keveset
      (~2 mg/kg/24 h) fogyasztottak.
    status: ellenorizve-doi

  # ---------------------------------------------------------------- Q6: nitrát, bikarbonát
  - key: senefeld-2020-nitrate-meta
    type: journal
    authors: [Senefeld J.W., Wiggins C.C., Regimbal R.J., Dominelli P.B., Baker S.E., Joyner M.J.]
    year: 2020
    title: "Ergogenic Effect of Nitrate Supplementation: A Systematic Review and Meta-analysis"
    journal: "Medicine & Science in Sports & Exercise 52(10):2250-2261"
    doi: 10.1249/MSS.0000000000002363
    url: https://api.crossref.org/works/10.1249/MSS.0000000000002363
    grade: A
    questions: [Q6]
    summary: >-
      80 randomizált, placebo-kontrollált tanulmány metaanalízise. A nitrát összességében kis hatással javítja a teljesítményt
      (d=0,174; p<0,001), de a hatás nem jelent meg jól edzett állóképességi sportolóknál (VO2max ≥65 ml/kg/perc; d=0,021) és
      csak nőket vizsgáló tanulmányokban sem (d=0,116). A szerzők szerint kiváló aerob fittségnél korlátozott a haszna.
    quote: >-
      "not observed in well-trained endurance athletes (≥65 mL·kg⁻¹·min⁻¹; d = 0.021)" ... "limited utility as an ergogenic aid in
      participants with excellent aerobic fitness."
    notes: >-
      Absztraktból (Crossref + Semantic Scholar). A vizsgált terhelések rövidek (perc–1 óra); ultrán nincs nitrát-adat. Üzenet:
      céklalé-nitrát ultrán a legkevésbé alátámasztott szer; GI-kockázat és a nagy volumenű lé (500 ml/adag) a hosszú eseményen
      inkább hátrány.
    status: ellenorizve-doi

  - key: grgic-2021-issn-bicarbonate
    type: position-stand
    authors: [Grgic J., Pedisic Z., Saunders B., Artioli G.G., Schoenfeld B.J., McKenna M.J., Bishop D.J., Kreider R.B., Stout J.R., Kalman D.S., Arent S.M., VanDusseldorp T.A., Lopez H.L., Ziegenfuss T.N., Burke L.M., Antonio J., Campbell B.I.]
    year: 2021
    title: "International Society of Sports Nutrition position stand: sodium bicarbonate and exercise performance"
    journal: "Journal of the International Society of Sports Nutrition 18:61"
    doi: 10.1186/s12970-021-00458-w
    url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1186/s12970-021-00458-w?fields=title,abstract,year,venue,authors
    grade: A
    questions: [Q6]
    summary: >-
      ISSN állásfoglalás: a nátrium-bikarbonát ergogén hatása főleg a 30 mp–12 perces, nagy intenzitású feladatoknál igazolt;
      minimális egyszeri adag 0,2 g/kg, optimális 0,3 g/kg, 60–180 perccel a terhelés előtt. Leggyakoribb mellékhatás: puffadás,
      hányinger, hányás, hasi fájdalom. Ultra-távú, több órás terhelésre nincs bizonyíték.
    quote: >-
      Ergogenic effects are "mostly established for exercise tasks of high-intensity that last between 30 s and 12 min." ...
      "The most common side-effects of sodium bicarbonate supplementation are bloating, nausea, vomiting, and abdominal pain."
    notes: >-
      Absztraktból (Semantic Scholar API; a Springer-oldal 429-cel elutasította). Ultrakerékpárra: irreleváns, sőt a GI-mellékhatás
      miatt kontraindikált tartós terhelésen.
    status: ellenorizve-doi

  # ---------------------------------------------------------------- Q6: NSAID – vese, GI, hyponatraemia
  - key: lipman-2017-ibuprofen-aki
    type: journal
    authors: [Lipman G.S., Shea K., Christensen M., Phillips C., Burns P., Higbee R., Koskenoja V., Eifling K., Krabak B.J.]
    year: 2017
    title: "Ibuprofen versus placebo effect on acute kidney injury in ultramarathons: a randomised controlled trial"
    journal: "Emergency Medicine Journal 34(10):637-642"
    doi: 10.1136/emermed-2016-206353
    url: https://emj.bmj.com/content/34/10/637
    grade: A
    questions: [Q6]
    summary: >-
      Kettős vak, placebo-kontrollált RCT sivatagi többnapos ultrafutó-versenyek 50 mérföldes (80 km) szakaszán, n=89.
      Ibuprofen 400 mg 4 óránként vs. placebo. Akut vesekárosodás (kreatinin-emelkedés alapján) 52% ibuprofen vs. 34% placebo
      (különbség 18%, 95% CI −4–41%); az ibuprofennél súlyosabb AKI-fokozat; NNH = 5,5. Az NSAID-ot az ultrafutók akár 75%-a használja.
    quote: >-
      "Greater severity of AKI was seen with ibuprofen compared with placebo" ... "Consideration should therefore be taken before
      ingesting NSAID during endurance running as it could exacerbate renal injury."
    notes: >-
      Kiadói oldal (BMJ) + Crossref. Futók, hőség, sivatag, 80 km; a nem-inferioritás nem bizonyult, a CI átfedi a nullát, de a
      trend és a súlyosság egyértelmű. Kerékpáron az izomkárosodás kisebb (nincs excentrikus terhelés), a dehidráció + hőség +
      NSAID kombináció viszont ugyanúgy veseterhelő.
    status: ellenorizve-doi

  - key: kuster-2013-analgesics-marathon
    type: journal
    authors: [Küster M., Renner B., Oppel P., Niederweis U., Brune K.]
    year: 2013
    title: "Consumption of analgesics before a marathon and the incidence of cardiovascular, gastrointestinal and renal problems: a cohort study"
    journal: "BMJ Open 3(4):e002090"
    doi: 10.1136/bmjopen-2012-002090
    url: https://bmjopen.bmj.com/content/3/4/e002090
    grade: B
    questions: [Q6]
    summary: >-
      Kohorsz-kérdőív a 2010-es bonni maratonon: 3913 válaszadó a 7048 indulóból; 49% (n=1931) vett be fájdalomcsillapítót a rajt
      előtt. A fájdalomcsillapítós csoportban közel 5× nagyobb volt a nemkívánatos események előfordulása (kockázatkülönbség 13%),
      dózisfüggően; GI-panasz miatti feladás gyakoribb; 9 kórházi felvétel (3 átmeneti veseelégtelenség ibuprofen után, 4 vérzés
      aszpirin után, 2 szívinfarktus), a kontrollcsoportban egy sem.
    quote: >-
      "analgesics cohort had an almost 5 times higher incidence of AEs (overall risk difference of 13%)" ... "Nine respondents
      reported temporary hospital admittance: three for temporary kidney failure ... four with bleeds ... None of the control
      reported hospital admittance"
    notes: >-
      Kiadói oldal (BMJ Open) + Crossref. Önbevallás, nem randomizált, maraton (nem ultra), de a legnagyobb minta a GI-vérzés/vese
      kimenetekre. Az aszpirin-vérzés és az ibuprofen-vese jel különválik.
    status: ellenorizve-doi

  - key: wichardt-2011-nsaid-adventure
    type: journal
    authors: [Wichardt E., Mattsson C.M., Ekblom B., Henriksson-Larsén K.]
    year: 2011
    title: "Rhabdomyolysis/myoglobinemia and NSAID during 48 h ultra-endurance exercise (adventure racing)"
    journal: "European Journal of Applied Physiology 111:1541-1544"
    doi: 10.1007/s00421-010-1774-2
    url: https://link.springer.com/article/10.1007/s00421-010-1774-2
    grade: B
    questions: [Q6, Q9]
    summary: >-
      Terepvizsgálat egy 48+ órás kalandversenyen (kerékpár, futás, kajak), 20 induló (3 nő, 17 férfi). Mioglobin jelentősen
      emelkedett a verseny alatt; 6/20 (30%) használt NSAID-ot, náluk a verseny utáni mioglobin alacsonyabb volt, de a versenyidejük
      hosszabb. A magas mioglobin a gyorsabb befejezéssel korrelált.
    quote: >-
      "a significant rise in Mb throughout the race, with the NSAID group (n = 6) having significantly lower Mb-Post than the
      no-NSAID group (n = 14)" ... "Rhabdomyolysis with myoglobinemia, which might be reduced with NSAID use, exists during a
      48+ h adventure race"
    notes: >-
      Kiadói absztrakt-oldal. Kis minta, nem randomizált (aki NSAID-ot vett, lassabb is volt – ok-okozat nem tisztázott).
      Vegyes sportág, részben kerékpár; a mioglobin-csökkenés a vesevédelem szempontjából nem jelent biztonságot.
    status: ellenorizve-doi

  - key: emerson-2020-naproxen-heat
    type: journal
    authors: [Emerson D.M., Davis J.M., Chen S.C.L., Torres-McGehee T.M., Pfeifer C.E., Emerson C.C., Bivona J.D., Stone J.V.]
    year: 2020
    title: "A 24 hour naproxen dose on gastrointestinal distress and performance during cycling in the heat"
    journal: "Sports Medicine and Health Science 2(1):19-24"
    doi: 10.1016/j.smhs.2020.02.003
    url: https://www.sciencedirect.com/science/article/pii/S2666337620300032
    grade: A
    questions: [Q6, Q8]
    summary: >-
      Kontrollált labor-vizsgálat, 11 önkéntes (6 férfi, 5 nő): 220 mg naproxen vagy placebo 8 óránként 24 órán át, majd
      kerékpározás 22,7 °C-on és 35,7 °C-on, euhidráltan, mérsékelt intenzitással. Nem volt különbség GI-tünetekben, teljesítményben
      (távolság), pulzusban, RPE-ben.
    quote: >-
      "A 24 h naproxen dose did not significantly affect performance or cause more frequent or serious GI distress when
      participants were euhydrated and cycling at moderate intensity"
    notes: >-
      Kiadói oldal (ScienceDirect). Rövid terhelés, euhidrált állapot, kis n – ellenpont: az NSAID-ártalom a dehidráció + hőség +
      hosszú terhelés kombinációhoz kötődik, nem magához a gyógyszerhez rövid távon.
    status: ellenorizve-doi

  # ---------------------------------------------------------------- Q8: hőség – izzadás, gyomorürülés, étvágy, hűtés
  - key: barnes-2019-sweat-normative
    type: journal
    authors: [Barnes K.A., Anderson M.L., Stofan J.R., Dalrymple K.J., Reimel A.J., Roberts T.J., Randell R.K., Ungaro C.T., Baker L.B.]
    year: 2019
    title: "Normative data for sweating rate, sweat sodium concentration, and sweat sodium loss in athletes: An update and analysis by sport"
    journal: "Journal of Sports Sciences 37(20):2356-2366"
    doi: 10.1080/02640414.2019.1633159
    url: https://api.openalex.org/works/doi:10.1080/02640414.2019.1633159
    grade: B
    questions: [Q8]
    summary: >-
      1303 sportoló megfigyeléses izzadásteszt-adatbázisa (2000–2017, GSSI, standardizált tapasz-módszer + testtömeg-változás).
      Egésztest-izzadási ráta: amerikai futball 1,51 ± 0,70 l/h; állóképességi sportok (kerékpár, futás, triatlon) 1,28 ± 0,57 l/h;
      kosárlabda 0,95; foci 0,94; baseball 0,83 l/h. Nátriumveszteség állóképességi sportban 51,7 ± 27,8 mmol/h (~1,2 g Na/h).
      A ±0,57 l/h szórás miatt az egyéni tartomány kb. 0,7–1,9 l/h; hőségben és nagy teljesítménynél a felső sáv reális.
    quote: >-
      endurance "1.28 ± 0.57 L/h" ... endurance "51.7 ± 27.8 mmol/h"
    notes: >-
      Absztrakt OpenAlex-ből rekonstruálva. Zömmel edzés/verseny 1–2 órás mérések, mérsékelt–meleg környezet; nem ultra, nem
      éjszakai/hidegebb szakaszokat is tartalmazó 20+ órás átlag. Ultrán a napi átlag jóval alacsonyabb (a bescos-2012 24 órás
      váltóban 10,5 l/24 h bevitel ≈ 0,44 l/h), a nappali hőségcsúcsban viszont 1,5–2 l/h is előfordulhat.
    status: ellenorizve-doi

  - key: neufer-1989-gastric-heat
    type: journal
    authors: [Neufer P.D., Young A.J., Sawka M.N.]
    year: 1989
    title: "Gastric emptying during exercise: effects of heat stress and hypohydration"
    journal: "European Journal of Applied Physiology and Occupational Physiology 58:433-439"
    doi: 10.1007/BF00643521
    url: https://link.springer.com/article/10.1007/BF00643521
    grade: A
    questions: [Q8]
    summary: >-
