      (cél-mondat; az eredmény-számok az OpenAlex-rekonstrukció parafrázisából)
    notes: >-
      Absztrakt OpenAlex-ből rekonstruálva, a számok parafrázis – a végleges szövegbe csak teljes szöveg ellenőrzése után. Kis n, 2 órás
      terhelés. Ultrán a kreatin +1–2 kg vízretenciója (hegyi versenyen W/kg-hátrány) és a nem igazolt állóképességi haszon miatt nem
      ajánlott; egyetlen ultra-vizsgálatot sem találtam.
    status: ellenorizve-doi
