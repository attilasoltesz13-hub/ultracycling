  - key: hickner-2010-creatine-cycling
    type: journal
    authors: [Hickner R.C., Dyck D.J., Sklar J., Hatley H., Byrd P.]
    year: 2010
    title: "Effect of 28 days of creatine ingestion on muscle metabolism and performance of a simulated cycling road race"
    journal: "Journal of the International Society of Sports Nutrition 7:26"
    doi: 10.1186/1550-2783-7-26
    url: https://api.openalex.org/works/doi:10.1186/1550-2783-7-26
    grade: A
    questions: [Q6]
    summary: >-
      12 állóképességi férfi kerékpáros (27 év, VO2peak ~53 ml/kg/perc), 28 nap 3 g/nap kreatin-monohidrát vs. placebo, előtte-utána
      2 órás szimulált országúti verseny 15 percenként 3×10 mp sprinttel. Az izom össz-kreatin és kreatin-foszfát nőtt, a plazmatérfogat
      a kreatin-csoportnak kedvezett, a szubmaximális O2-fogyasztás ~10%-kal csökkent, de a záró sprint kimerülési ideje és teljesítménye
      mindkét csoportban egyformán (~33%) javult – az állóképességi teljesítmény nem javult szignifikánsan.
    quote: >-
