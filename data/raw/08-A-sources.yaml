  - key: hyldahl-2024-tourdivide
    type: journal
    authors: [Hyldahl R.D., Gifford J.R., Davidson L.E., Hancock C.R., Hafen P.S., Parcell A.C., Mack G.W.]
    year: 2024
    title: "Physiological assessment of a 16 day, 4385 km ultra-endurance mountain bike race: A case study"
    journal: "Experimental Physiology 109(2):165-174"
    doi: 10.1113/EP091260
    url: https://doaj.org/article/0e26490f416c437ba963d772c9064514
    grade: B
    questions: [Q1]
    summary: >-
      Tour Divide (4385 km), 47 éves férfi, 16 nap 7 óra 45 perc, átlagosan 16,8 óra nyeregben naponta. Mérés
      35 nappal a rajt előtt és ~36 órával a cél után: VO2max és maximális teljesítmény nem változott; duplán jelölt
      vízzel mért energiaforgalom + étkezési napló szerint az első 9 napban energiaegyensúly, testtömeg változatlan;
      zsír csökkent, láb-izomtömeg nőtt; izom-mitokondriális és ér-endotél funkció romlott.
    quote: >-
      "The 47‐year‐old male subject took 16 days 7 h 45 min to complete the route. He rode an average of 16.8 h/day.
      Neither maximal O2 uptake nor maximal power output changed pre‐ to post‐TD."
    notes: >-
      n=1, férfi; verseny alatti W/pulzus adatot NEM közöl (csak a napi nyeregidőt) – Tour Divide-ra ez az egyetlen
      lektorált fiziológiai esettanulmány. Üzenet a durability-vitához: 16 nap után is megmaradt a VO2max/Pmax,
      miközben a sejtszintű funkció romlott ("metabolikus tartalék"). Absztraktból, DOI Crossrefen.
    status: ellenorizve-doi

