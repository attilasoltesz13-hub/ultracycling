    notes: >-
      n=1, férfi, self-supported; szerzői kézirat (UCL repozitórium), DOI Crossrefen ellenőrizve. A 109 W a
      legalacsonyabb publikált ultra-átlag: TCR-en a mozgásidő nagy része nagyon alacsony intenzitású. A késői
      pulzusemelkedést a szerzők kronotróp zavarnak nevezik (ok: fiziológiai/környezeti/genetikai – nyitott).
