  - key: heidenfelder-2016-raam-pacing
    type: journal
    authors: [Heidenfelder A., Rosemann T., Rüst C.A., Knechtle B.]
    year: 2016
    title: "Pacing Strategies of Ultracyclists in the 'Race Across AMerica'"
    journal: "International Journal of Sports Physiology and Performance 11(3):319-327"
    doi: 10.1123/ijspp.2015-0051
    url: https://api.crossref.org/works/10.1123/ijspp.2015-0051
    grade: B
    questions: [Q1]
    summary: >-
      RAAM 2010–2014 szóló mezőnye (~4860 km): sebesség az időállomásokon, szint, szél, hőmérséklet, kor, nem.
      A sebesség az időállomások mentén nőknél és férfiaknál egyaránt csökkent (férfiak gyorsabbak); a teljesítmény
      is csökkent a verseny során. A top 3 gyorsabban és nagyobb teljesítménnyel rajtolt, elérte a legmagasabb
      csúcssebességet/-teljesítményt, és tovább tartotta, mielőtt lassult. Következtetés: pozitív pacing
      (sebességcsökkenés végig) tűnik megfelelőnek a RAAM-on.
    quote: >-
      "The top 3 finishers started faster and had a higher power output at the start than less successful
      competitors, achieved the highest peak cycling speeds and power output, and maintained peak cycling speed
      and power output longer before slowing down."
    notes: >-
      Absztraktból (Crossref), a kiadói oldal 403. Az abstract nem adja meg n-t és a százalékos lassulást.
      Megfigyeléses: a "gyors rajt" a jobb versenyzők tulajdonsága, nem bizonyítottan ok; a pozitív pacing
      ajánlása a mezőny gyakorlatát írja le (= mindenki lassul), nem kontrollált összehasonlítás.
    status: ellenorizve-doi

  # ---------------------------------------------------------------- Q1: durability / fáradtságállóság
  - key: clark-2019-cp-dynamics
    type: journal
    authors: [Clark I.E., Vanhatalo A., Thompson C., Joseph C., Black M.I., Blackwell J.R., Wylie L.J., Tan R., Bailey S.J., Wilkins B.W., Kirby B.S., Jones A.M.]
    year: 2019
    title: "Dynamics of the power-duration relationship during prolonged endurance exercise and influence of carbohydrate ingestion"
    journal: "Journal of Applied Physiology 127(3):726-736"
    doi: 10.1152/japplphysiol.00207.2019
    url: https://api.crossref.org/works/10.1152/japplphysiol.00207.2019
    grade: A
    questions: [Q1, Q7]
    summary: >-
      16 résztvevő, 3 perces all-out teszt pihenten, illetve 40, 80 és 120 perc "heavy" intenzitású kerékpározás
      után (placebo), valamint 2 óra után 60 g/h szénhidráttal. Végteszt-teljesítmény (EP ≈ CP): 260 ± 37 W
      kontroll, 268 ± 39 (40 perc), 260 ± 40 (80 perc), 2 óra után 236 ± 47 W (-9%, p<0,05). W' (WEP): 17,9 ± 3,3 kJ →
      14,7 ± 2,9 (80 perc) és 13,8 ± 2,7 kJ (2 óra). Szénhidráttal az EP-csökkenés eltűnt (254 ± 49 W), a WEP nem
      (13,5 ± 3,4 kJ).
    quote: >-
      "after 2-h, EP was 9% lower compared to control (236 ± 47 W; P<0.05)." ... "CHO ingestion negated the
      reduction of EP following 2-h of heavy-intensity exercise (254 ± 49 W) but had no effect on WEP (13.5 ± 3.4 kJ)."
    notes: >-
      Laborvizsgálat, csak 2 óra "heavy" (CP alatti, de LT feletti) munka – ultrán a munka intenzitása ennél
      alacsonyabb, az időtartam 10–100-szoros. Két különböző időlefutás: a W' hamarabb (80 perc) esik, a CP később
      (2 óra); a CP-esés szénhidrátfüggő → Q7: az energiadeficit közvetlenül lejjebb tolja a fenntartható tempót.
    status: ellenorizve-doi

  - key: spragg-2024-intensity
    type: journal
    authors: [Spragg J., Leo P., Giorgi A., Martinez Gonzalez B., Swart J.]
    year: 2024
    title: "The intensity rather than the quantity of prior work determines the subsequent downward shift in the power duration relationship in professional cyclists"
    journal: "European Journal of Sport Science 24(4):449-457"
    doi: 10.1002/ejsc.12077
    url: https://api.crossref.org/works/10.1002/ejsc.12077
    grade: A
    questions: [Q1]
    summary: >-
      14 profi kerékpáros (CP 5,3 ± 0,21 W/kg), power-profil teszt (15 s, 3 perc, 12 perc) frissen, ~2000 kJ
      <70% CP alatti folyamatos munka (LIC) után, és 5×8 perc 105–110% CP (HI) után. A HI-ben kevesebb munka mellett
      az 1 s és 15 s teljesítmény szignifikánsan alacsonyabb volt, mint LIC után; a 3 perces teljesítmény HI után
      esett, LIC után nem szignifikánsan; a 12 perces teljesítmény és a CP egyik kondícióban sem különbözött.
    quote: >-
      "The 12‐min power output and CP were not significantly different between conditions. These findings demonstrate
      the importance of the intensity of prior work in the resultant downward shift in the power‐duration relationship"
