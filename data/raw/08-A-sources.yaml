  - key: neumayr-2004-rata
    type: journal
    authors: [Neumayr G., Pfister R., Mitterbauer G., Maurer A., Hoertnagl H.]
    year: 2004
    title: "Effect of ultramarathon cycling on the heart rate in elite cyclists"
    journal: "British Journal of Sports Medicine 38(1):55-59"
    doi: 10.1136/bjsm.2002.003707
    url: https://bjsm.bmj.com/content/38/1/55
    grade: B
    questions: [Q1, Q7]
    summary: >-
      10 elit férfi ultrakerékpáros az első Race Across the Alps-on (2001; 525 km, 12 600 m szint). Versenyidő
      27 óra 25 perc, 18,6 km/h. HRmax 186, átlagpulzus 126/perc → HRátlag/HRmax = 0,68. Időeloszlás: 53% <70% HRmax,
      25% 70–80%, 19% 80–90%, 3% >90%. A HRátlag/HRmax a rajtnál 0,86-ról a végén 0,66-ra esett (-23%);
      a szerzők szerint ~10% csökkenés 10 óránként, és az "ultraendurance küszöb" ~70% HRmax.
    quote: >-
      "In all subjects, exercise intensity declined significantly during the race, as indicated by a decrease in
      HRaverage/HRmax of 23% from 0.86 at the start to 0.66 at the end."
    notes: >-
      n=10, csak férfi, ~27 órás, hegyes verseny; nincs teljesítménymérő adat. Klasszikus alap a
      "10%/10 óra pulzuscsökkenés" szabályhoz. A 0,86-os rajtintenzitás elit mezőnyben is túl magasnak bizonyult
      – ez a "túl gyors rajt" fiziológiai lenyomata.
    status: ellenorizve-doi

