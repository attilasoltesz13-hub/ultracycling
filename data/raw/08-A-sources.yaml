    authors: [Knechtle B., Rosemann T., Nikolaidis P.T.]
    year: 2019
    title: "Self-Selected Pacing during a 24 h Track Cycling World Record"
    journal: "International Journal of Environmental Research and Public Health 16(16):2943"
    doi: 10.3390/ijerph16162943
    url: https://www.mdpi.com/1660-4601/16/16/2943
    grade: B
    questions: [Q1]
    summary: >-
      Ugyanaz a sportoló (35 év, 76 kg) 250 m-es pályán: 3767 kör, 941,873 km (+37,99 km a régi rekordhoz képest),
      átlagsebesség 39,2 ± 1,9 km/h (35,5–42,8), teljesítmény 214,5 ± 23,7 W (190–266 W). Négy fázis: 0–4. óra
      stabil sebesség; 4–9. óra a legnagyobb sebességesés; 9–22. óra kis változás; 22. órától hajrá.
      Első megállás (2,5 perc WC) csak 21:53-nál. Sebesség vs. távolság r=-0,73, teljesítmény r=-0,66.
    quote: >-
      "The average cycling speed was 39.2 ± 1.9 km/h (range 35.5–42.8 km/h) and the power output measured was
      214.5 ± 23.7 W (range 190.0–266.0 W) during the 24 h of cycling."
    notes: >-
      n=1, férfi; pulzust nem közöl. A pályán a szélárnyék/légellenállás miatt a W alacsonyabb (214 W), mint az
      országúti rekordnál (250 W), a km több. A négyfázisú mintázat (elején tartás, 4–9. óra esés, plató, hajrá)
      a 24 órás tempótervezés sablonja.
    status: ellenorizve-doi

