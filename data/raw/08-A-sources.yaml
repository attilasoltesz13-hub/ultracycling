  - key: rothschild-2021-ultracyclist
    type: journal
    authors: [Rothschild J.A., Delcourt M., Maunder E., Plews D.J.]
    year: 2021
    title: "Racing and Training Physiology of an Elite Ultra-Endurance Cyclist: Case Study of 2 Record-Setting Performances"
    journal: "International Journal of Sports Physiology and Performance 16(5):739-743"
    doi: 10.1123/ijspp.2020-0515
    url: https://pubmed.ncbi.nlm.nih.gov/33547258/
    grade: B
    questions: [Q1, Q7]
    summary: >-
      Egy elit ultrakerékpáros (győztes és pályacsúcstartó) nyers teljesítmény-, pulzus- és sebességadatai két
      versenyről 4 hónapon belül. 24 órás szólóverseny: 861,6 km, 35,9 km/h, átlag 210 W (2,8 W/kg), átlagpulzus
      121/perc; a teljesítmény 37%-kal, a pulzus 22%-kal csökkent a verseny folyamán. RAAM 2 fős váltóban
      (4939 km, 6 nap 10 óra 39 perc, 31,9 km/h): a versenyző 75,2 órát tekert, 2532 km-t, átlag 203 W (2,7 W/kg),
      a teljesítménycsökkenés csak 12%; nappal 212 (25) W, éjjel 189 (18) W (p<0,001).
    quote: >-
      "the athlete completed 861.6 km (average speed 35.9 km·h⁻¹, average power 210 W [2.8 W·kg⁻¹], average HR
      121 beats per minute) with a 37% decrease in power and a 22% decrease in HR throughout the race."
    notes: >-
      n=1 esettanulmány, férfi, elit; absztraktból. Két formátum egy sportolónál: a folyamatos 24 óra
      (-37% teljesítmény) vs. a szakaszos 75 óra/6,5 nap (-12%) – a pihenőkkel tagolt terhelés sokkal laposabb
      lecsengést ad. Az éjszakai -11% (212→189 W) a cirkadián/álmossági komponens. Szóló RAAM-ra és
      self-supported versenyekre csak irányadó.
    status: ellenorizve-doi

  - key: knechtle-2015-24h-road
    type: journal
    authors: [Knechtle B., Bragazzi N.L., Rosemann T., Rüst C.A.]
    year: 2015
    title: "Pacing in a self-paced world record attempt in 24-h road cycling"
    journal: "SpringerPlus 4:650"
    doi: 10.1186/s40064-015-1445-1
    url: https://link.springer.com/article/10.1186/s40064-015-1445-1
    grade: B
    questions: [Q1]
    summary: >-
      Tapasztalt ultrakerékpáros (33 év, 76 kg) 24 órás országúti világrekord-kísérlete 11,731 km-es körön:
      896,173 km, átlag 37,34 km/h, átlagteljesítmény 250,2 W (~3,3 W/kg). Pozitív pacing: a sebesség és a
      teljesítmény körről körre lineárisan csökkent (távolság vs. sebesség r=-0,79; vs. teljesítmény r=-0,85);
      a hőmérséklet és a szél is befolyásolta a sebességet (átlag ~6 °C, minimum ~2 °C hajnali 3-kor).
      22:37 után hajrá: az utolsó szakasz 44,38 km/h.
    quote: >-
      "The decrease in cycling speed and power output across laps could be modelled linearly."
    notes: >-
      n=1, férfi (feltehetően Christoph Strasser 2015-ös rekordja, a cikk nem nevesíti). Az r-értékek a
      Springer-oldalról, a W/kg saját számítás (250,2 W / 76 kg). Tanulság: a rutinos rekorder is lineárisan
      lassul, nem "egyenletes" – a tervezésnél számolni kell a lecsengéssel, és a végén marad tartalék a hajrára.
    status: ellenorizve-doi

  - key: knechtle-2019-24h-track
