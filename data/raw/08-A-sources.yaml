      pihenés, 45 óra alvás, ~5 óra alvás/nap, délben 20–30 perces szunyókálás). Szegmensenként stabil teljesítmény
      mellett szignifikánsan csökkenő átlagpulzus. Tesztoszteron kezdetben -30–40%, kortizol végig +75–90%.
    quote: >-
      "The race was mainly performed at low intensities (mean ± SD: power output = 141 ± 76 W, HR = 117 ± 14 bpm)."
    notes: >-
      n=1, férfi, teljes szöveg (szerzői PDF-tükör). A DOI Crossrefen ellenőrizve. Az 1,8 W/kg ~38%-a a Pmax-nak és
      ~76%-a az LT-teljesítménynek. Ellenpélda az "alvásminimalizáló" RAAM-stratégiához: sok alvással is befutott.
      Kulcs Q7-hez: azonos wattnál eső pulzus napról napra → a pulzuszóna-tartás egyre nagyobb wattot kényszerítene ki.
    status: ellenorizve-doi

  - key: brayson-2019-tcr
