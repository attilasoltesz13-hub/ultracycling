  # ---------------------------------------------------------------- Q11: CGM
  - key: skroce-2026-cgm-records
    type: journal
    authors: [Skroce K., Turner L.V., Zignoli A., Lipman D.J., Zisser H.C., Riddell M.C.]
    year: 2026
    title: "Beyond Euglycemia: Case Studies Using Continuous Glucose Monitoring in Elite Athletes Without Diabetes During Record Athletic Events"
    journal: "Sensors 26(5):1624"
    doi: 10.3390/s26051624
    url: https://www.mdpi.com/1424-8220/26/5/1624
    grade: B
    questions: [Q11]
    summary: >-
      Három elit sportoló CGM-esettanulmánya (Abbott Libre Sense sport-bioszenzor), köztük egy Race Across the West
      (RAW) váltó-világrekord (44 óra 20 perc) és egy Everesting-rekordkísérlet. A RAW alatt a tekerési szakaszokban az
      átlagos interstitialis glükóz 91 ± 23,2 mg/dl volt, a pihenőkben 115 ± 24,7 mg/dl; a tekerés idejének 9,15%-a
      (a pihenő 1,23%-a) esett a céltartomány alá (TBR). Az Everestingnél végig magas, 160 ± 5,7 mg/dl-es glükóz
      (100% TAR140), 3,5%-os variációs együtthatóval. Következtetés: a klinikai euglikémiás tartományoktól való
      eltérés elit teljesítmény közben gyakori, az értelmezésnek kontextusfüggőnek kell lennie.
    quote: >-
      "Mean interstitial glucose during cycling segments was 91 ± 23.2 mg/dL, compared with 115 ± 24.7 mg/dL during
      resting periods" ... "TBR accounted for 9.15% of cycling time and 1.23% of resting time"
    notes: >-
      n=3 esettanulmány (ebből 2 kerékpáros: RAW váltó, Everesting), nem kontrollált, a szenzor gyártói kapcsolat
      (Abbott/Supersapiens-környezet) miatt érdekkonfliktus lehetséges. Ultrakerékpárra közvetlenül releváns: a
      váltó-formátumban a nyeregben ~24 mg/dl-rel alacsonyabb glükóz, mint pihenőben – a szólóversenyzőnél
      (fesseler-2026-raam58) hasonló, napról napra csökkenő minta. Nem bizonyítja, hogy a CGM-vezérelt etetés javítja a
      teljesítményt.
    status: ellenorizve-doi

  - key: riddell-2025-gssi-cgm
    type: web-article
    authors: [Riddell M.C., et al.]
    credential: "Gatorade Sports Science Institute, Sports Science Exchange #263 – York University, diabetes/exercise-fiziológus"
    year: 2025
    title: "Glucose Monitoring In Athletes Without Diabetes (SSE #263)"
    venue: "GSSI Sports Science Exchange"
    doi: null
    url: https://www.gssiweb.org/sports-science-exchange/article/continuous-glucose-monitoring-use-in-athletes-without-diabetes
    grade: C
    questions: [Q11]
    summary: >-
      Narratív áttekintés a nem diabéteszes sportolók CGM-használatáról. A szenzorpontosság edzés közben elfogadható, de
      gyengébb (MARD <15%), az interstitialis érték késik a vérglükózhoz képest gyors változásoknál. Elit kerékpárosoknál
      az edzés alatti átlag 108 ± 9 mg/dl, az edzésen belüli max/min 144 ± 14 és 74 ± 10 mg/dl. Ultramaratonon a
      kevesebb szénhidrátot fogyasztók glükózszintje és teljesítménye is alacsonyabb volt; szénhidrátbevitel mellett
      106 ± 18 vs. 88 ± 10 mg/dl és 113 ± 69 vs. 81 ± 49 perc kimerülési idő. Reaktív hipoglikémia a felhasználók ~8%-ánál,
      főleg 30–90 perccel az edzés előtti étkezésnél. A CGM nem méri az izomglikogént.
    quote: >-
      "Accuracy is deemed to be acceptable, but perhaps a little worse (MARD <15%), in persons without diabetes who are
      exercising" ... "Athletes anecdotally report better performances when glucose levels were higher than their usual
      trends, but lack scientific evidence supports this claim"
    notes: >-
      GSSI = Gatorade-finanszírozású intézet, narratív (C). A számok másodlagosak (a cikk idézi az elsődleges
      vizsgálatokat, n nem mindenütt megadott). Ultrakerékpárra a fő üzenet: a CGM trend- és hipoglikémia-jelzőként
      használható, de a „magasabb glükóz = jobb teljesítmény" állításra nincs bizonyíték.
