  # ---------------------------------------------------------------- Q11: ketonészter
  - key: brooks-2022-ketone-meta
    type: journal
    authors: [Brooks E., Lamothe G., Nagpal T.S., Imbeault P., Adamo K., Kara J., Doucet É.]
    year: 2022
    title: "Acute Ingestion of Ketone Monoesters and Precursors Do Not Enhance Endurance Exercise Performance: A Systematic Review and Meta-Analysis"
    journal: "International Journal of Sport Nutrition and Exercise Metabolism 32(3):214-225"
    doi: 10.1123/ijsnem.2021-0280
    url: https://journals.humankinetics.com/view/journals/ijsnem/32/3/article-p214.xml
    grade: A
    questions: [Q11]
    summary: >-
      8 randomizált keresztezett vizsgálat, 80 résztvevő (77 férfi, 3 nő), 2016–2020. Az akut exogén keton (monoészter
      és prekurzor) bevitel nem javította az állóképességi teljesítményt: Hedges g = 0,136 (95% CI -0,195–0,467;
      p = 0,419); sem a kimerülési idő, sem az időfutam nem különbözött. A monoészterek hatékonyabban emelték a
      vérketon-szintet, mint a prekurzorok; a GI-panaszok a keton-karon gyakoribbak voltak.
    quote: >-
      "no significant differences were found between ketone and control trials" ... "exogenous ketone precursors and
      monoesters do not exert significant improvements on endurance exercise performance"
    notes: >-
      Meta-analízis, főleg 1–2 órás laborprotokollok, nem ultra. A g-érték és CI a kiadói oldal absztraktjából. Ultrára
      irányadó: akut ergogén hatás nincs; a többnapos „regenerációs" (EPO, overreaching) hatás külön kérdés
      (sitko-2024-ketones-cycling).
    status: ellenorizve-doi

