      testvíz-egyensúlyt és a hőterhelést.
    quote: >-
      "No effect of sodium observed for ad libitum fluid intake or net fluid balance (P > .05)" ... "Personalized sodium
      replacement during ultraendurance running in hot conditions did not substantially influence overall body-water
      balance or thermophysiological strain." [OpenAlex-absztraktból]
    notes: >-
      Futók, n=9, labor, 5 óra – nem kerékpár, nem többnapos. A kiadói oldal 403, az absztrakt OpenAlexen ellenőrizve.
