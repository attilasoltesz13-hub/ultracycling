    summary: >-
      9 résztvevő (7 férfi, 2 nő), kettős vak randomizált keresztezett; 2×5 órás futószalagfutás 60% VO2max-on,
      30 °C-ban, ad libitum ivással; NaCl-kapszula az előzetesen mért izzadságveszteség 100%-ának pótlására vs.
      placebo. A nátrium nem befolyásolta az ad libitum folyadékbevitelt és a nettó folyadékegyensúlyt (p > 0,05);
      a plazma-nátrium mindkét karon nőtt, a nátriummal jobban (2,5 óránál és utána); a plazmatérfogat-változás
