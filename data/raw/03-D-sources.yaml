  # ---------------------------------------------------------------- Q11: egyénre szabott nátrium
  - key: mccubbin-2024-sodium-personalized
    type: journal
    authors: [McCubbin A.J., Costa R.J.S.]
    year: 2024
    title: "Effect of Personalized Sodium Replacement on Fluid and Sodium Balance and Thermophysiological Strain During and After Ultraendurance Running in the Heat"
    journal: "International Journal of Sports Physiology and Performance 19(2):105-115"
    doi: 10.1123/ijspp.2023-0295
    url: https://api.crossref.org/works/10.1123/ijspp.2023-0295
    grade: A
