  # ---------------------------------------------------------------- Q11: bélflóra, probiotikum, gut training
  - key: aitkenhead-2025-supplements-gut
    type: journal
    authors: [Aitkenhead R., Waldron M., Conway G.E., Horner K., Heffernan S.M.]
    year: 2025
    title: "The Influence of Dietary Supplements on Exercise-Induced Gut Damage and Gastrointestinal Symptoms: A Systematic Review and Meta-Analysis"
    journal: "Nutrients 17(3):443"
    doi: 10.3390/nu17030443
    url: https://www.mdpi.com/2072-6643/17/3/443
    grade: A
    questions: [Q11]
    summary: >-
      26 vizsgálat, 495 résztvevő, három meta-analízis. A terhelés a bélkárosodás-marker I-FABP-t átlagosan 106%-kal
      emelte (g = 1,01). A kiegészítők összesített hatása a GI-tünetekre nem szignifikáns (g = 0,42; 95% CI -0,17–1,02;
      p = 0,15); alcsoportban a probiotikumok mérsékelt hatásúak (g = -0,62; p = 0,05). A teljesítményre egyik
      kiegészítőnek sincs hatása (p = 0,53); a változások a klinikai relevancia alatt maradnak; heterogenitás
      I² ≥ 58,6%.
    quote: >-
      "probiotics had a moderate significant effect for gastrointestinal symptoms (Hedges' g = −0.62, 95% CI −1.01; 1.01,
      p = 0.05)" ... "no pooled or sub-group differences for exercise performance for any supplements (p = 0.53)"
    notes: >-
      Meta-analízis, rövid labor-terhelések (futás/kerékpár), nem ultra. A probiotikum-hatás határértékű (p = 0,05, a CI
      a kiadói absztraktban furcsán szerepel: −1,01; 1,01). Ultrakerékpárra: a probiotikum legfeljebb tünetcsökkentő
      kiegészítő, nem teljesítményjavító.
    status: ellenorizve-doi

