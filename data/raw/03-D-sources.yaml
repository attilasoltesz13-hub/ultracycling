      esti nyitás (19–20 óra). Egy 2017-es versenyző 16 nap alatt 122 l folyadékot ivott (5–11 l/nap). Kalóriadús étel
      utáni azonnali tekerés emésztési gondot okoz; egy versenyző az első energiaitaltól 2 hét után 24 órára kidőlt.
    quote: >-
      "Estimates of how many calories most people can absorb per hour are about 200 to 300, making about 4,000 to 7,000
      calories per day." ... "Many of the fastest bikepacking racers have commented that doing such a race can be more
      like an eating contest than a bike race."
    notes: >-
      Edzői/versenyzői kézikönyv (C), a számok becslések vagy másodlagos versenyzői közlések (n nincs). Közvetlenül
