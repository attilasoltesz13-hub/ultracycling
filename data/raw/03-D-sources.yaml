      teljesítmény nem függött nemtől, kortól, GI-tünet-előzménytől. Ajánlás: egyénre szabott GI-kezelés.
    quote: >-
      "Interest in food and appetite during exercise was lower in symptomatic athletes than asymptomatic athletes
