  # ---------------------------------------------------------------- Q11: 120+ g/h, hidrogél
  - key: wilson-2025-highcarb-review
    type: journal
    authors: [Wilson P.B.]
    year: 2025
    title: "A Narrative Review of the High-Carbohydrate Fueling Revolution (≥ 100 g/h) in the Professional Peloton"
    journal: "Sports Medicine (online 2025-12-04, print 2026-02)"
    doi: 10.1007/s40279-025-02372-6
    url: https://link.springer.com/article/10.1007/s40279-025-02372-6
    grade: C
    questions: [Q11, Q10]
    summary: >-
      Narratív áttekintés a ≥100 g/h szénhidrát-etetésről a profi pelotonban. A kísérletes vizsgálatok kis száma
      alapján nincs egyértelmű bizonyíték, hogy 100–120 g/h a 60–90 g/h-hoz képest csökkentené az endogén
      szénhidrát-felhasználást vagy javítaná a teljesítményt (King 2018: 90 g/h-nál ~5%-kal magasabb időfutam-
      teljesítmény, mint 112,5 g/h-nál, nem szignifikáns; Viribay: csoportonként 6–7 fő). Az 1984–2023 közötti
      országúti versenyek óránkénti bevitele idővel nőtt (r = 0,64 a kiugró érték nélkül). Lehetséges előny:
      a versenybeli bevitel erősen korrelál a napi összbevitellel (glikogén-újratöltés, alacsony energia-
      elérhetőség elkerülése). Javaslat: egyéni exogén-oxidációs mérés alapján személyre szabni.
    quote: >-
      "there is not clear evidence that it reduces reliance on endogenous carbohydrate stores or improves performance"
      ... "average power output during the time trial was highest with 90 g/h and ~ 5% higher than with 112.5 g/h,
      though this was statistically insignificant."
    notes: >-
      Narratív áttekintés, profi országúti (3–6 órás) kontextus. Ultrára átvihető tanulság: a 120 g/h nem
      „bizonyítottan jobb" mint 90; a többnapos formátumban a napi összbevitel emelése lehet a valódi haszon.
      A Springer-oldal megnyílt, a számok az onnan idézett mondatokból.
    status: ellenorizve-doi

