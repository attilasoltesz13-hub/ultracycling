# Felkészülési ütemterv-generátor — paraméterek a 02 modul 6–8., 14. és 16. oldalából.
# Jelölés: fix (szabály) · példa (edzői keret, C) · egyéni (saját helyzet). Minden kimenet „keret — az edződdel egyeztetve”.
module: "02"
total_weeks: [16, 24]      # példa — tatt-boundary, white-ridefar, grandgeorge
taper:                     # bosquet-2007 (A) + ultra-gyakorlat (C)
  days: [10, 14]
  days_multiday: [14, 21]
  volume_cut_pct: [40, 60]
  keep: "intenzitás és edzésgyakoriság marad; utolsó hosszú a rajt előtt 10–14 nappal; utolsó nehéz erősítés 7–10 nappal"
peak_weeks_before: [4, 6]  # példa — grandgeorge (30–42 nap adaptáció)
rehearsal:                 # példa — apidura/white: 2–4 napos főpróba
  days: [2, 4]
  weeks_before: 4
specific_phase_weeks: [3, 4]
build_phase_weeks: [6, 8]
block: "3+1 (nagy terhelésnél 2+1); heti legalább 1 teljes pihenőnap"
long_ride_progression: "4–6 óra → 8–10+ óra az építés alatt; back-to-back hétvégék a specifikus fázisban (amatőr: 2×5–8 óra)"
brevet_ladder:             # fix — pbp-2027-rules (SR-sorozat), lenhard/tatt
  steps: [200, 300, 400, 600]
  last_600_weeks_before: [4, 6]
  gap_weeks: [2, 6]
heat_block:                # tyler-2016, daanen-2018, ronnestad-2022 (A)
  days: [10, 14]
  timing: "a taperrel átfedésben"
  maintenance: "2 naponta 1 hőexpozíció (levezetett szabály, C) vagy rövid újra-indukció"
strength:                  # ronnestad-2010/2011 (A)
  prep: "heti 2 nehéz alkalom (4 kategória × 3 sorozat, 4–10 ism.)"
  season: "heti 1 fenntartó"
  last_heavy_days_before: [7, 10]
minimal_dose:              # spiering-2021 (A) — munkacsúcs-hetekre
  sessions_per_week: 2
  keep: "intenzitás megtartva; az állóképesség ~15 hétig megőrizhető"
two_races_gap_weeks: [6, 8]  # példa — vanderlinden-wuca
monitoring: "napi 2 kérdés (fáradtság, edzéskészség 0–10) + heti összóra; HRV 7 napos trendben, ha mérsz"
